name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The repository pins its own toolchain via go.mod / tools/go.mod;
  # disable GOTOOLCHAIN auto-download so CI uses the runner's Go exactly.
  GOTOOLCHAIN: local

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Lint, govulncheck and the gofumpt/goimports binaries live in
      # tools/go.mod pins the minimum toolchain. Use the fixed 1.26.5
      # patch level so govulncheck does not flag stdlib CVEs already
      # fixed upstream.
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: |
            go.sum
            tools/go.sum
            tools/scenariotool/go.sum
            op/storeadapter/sql/go.sum
            op/storeadapter/redis/go.sum
            op/storeadapter/dynamodb/go.sum
            cmd/op-demo/go.sum

      # A release commit pins adapter go.mod files to the new root tag, which
      # does not exist until after this CI run. The workspace makes pre-tag CI
      # test the identical checked-out root without shipping a replace to
      # external adapter consumers. The member list is derived from the shared
      # module inventory so CI, `make verify`, and the release script cannot
      # cover different sets.
      - name: Initialize multi-module workspace
        run: scripts/workspace.sh

      - name: Cache pinned tool binaries
        uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-${{ hashFiles('tools/go.mod', 'tools/go.sum', 'tools/tools.go') }}
          restore-keys: |
            go-tools-${{ runner.os }}-

      - name: Install pinned tools
        run: make tools

      - name: gofumpt + goimports check
        run: |
          set -euo pipefail
          gobin="$(go env GOBIN)"
          if [ -z "$gobin" ]; then
            gobin="$(go env GOPATH)/bin"
          fi

          fumpt_diff="$("$gobin/gofumpt" -l -extra .)"
          if [ -n "$fumpt_diff" ]; then
            echo "::error::gofumpt would reformat the files below; run 'make fmt'"
            printf '%s\n' "$fumpt_diff"
            exit 1
          fi

          imports_diff="$("$gobin/goimports" -l -local github.com/libraz/go-oidc-provider .)"
          if [ -n "$imports_diff" ]; then
            echo "::error::goimports would reformat the files below; run 'make format'"
            printf '%s\n' "$imports_diff"
            exit 1
          fi

      - name: go vet
        run: make vet

      - name: golangci-lint
        run: make lint

      - name: scenario advisories (strict)
        run: make scenario-advisories-strict

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Single Go version: pin the patched stdlib version used by the
      # module directives so x509 / template / http2 fixes are present.
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: |
            go.sum
            op/storeadapter/sql/go.sum
            op/storeadapter/redis/go.sum
            op/storeadapter/dynamodb/go.sum
            cmd/op-demo/go.sum

      # See the matching lint-job note: release commits need a local root only
      # until the root tag is published after CI is green.
      - name: Initialize multi-module workspace
        run: scripts/workspace.sh

      - name: Test conformance release verifier
        run: python3 -m unittest discover -s tools/conformance/tests -v

      - name: Test root module (race + coverage)
        run: |
          go test -race \
            -coverprofile="$GITHUB_WORKSPACE/cover.root.out" \
            -covermode=atomic \
            -count=1 -timeout=5m \
            ./...

      - name: Test op/storeadapter/sql (race + coverage)
        working-directory: op/storeadapter/sql
        run: |
          go test -race \
            -coverprofile="$GITHUB_WORKSPACE/cover.sql.out" \
            -covermode=atomic \
            -count=1 -timeout=5m \
            ./...

      - name: Test op/storeadapter/redis (race + coverage)
        working-directory: op/storeadapter/redis
        run: |
          go test -race \
            -coverprofile="$GITHUB_WORKSPACE/cover.redis.out" \
            -covermode=atomic \
            -count=1 -timeout=5m \
            ./...

      # The DynamoDB adapter's own suite sits entirely behind the
      # testcontainers tag because it needs the emulator, so this step
      # only compiles it. The tagged run lives with the other
      # container-backed suites.
      - name: Test op/storeadapter/dynamodb (race + coverage)
        working-directory: op/storeadapter/dynamodb
        run: |
          go test -race \
            -coverprofile="$GITHUB_WORKSPACE/cover.dynamodb.out" \
            -covermode=atomic \
            -count=1 -timeout=5m \
            ./...

      # op-demo is its own module so the storage drivers it links for
      # -store=composite stay out of the library's dependency list. The root
      # module's test step no longer reaches it.
      - name: Test cmd/op-demo (race only)
        working-directory: cmd/op-demo
        run: go test -race -count=1 -timeout=5m ./...

      - name: Test real SQL and Redis contract backends
        run: scripts/test_contracts.sh

      - name: Test example sub-modules (race only)
        run: |
          set -euo pipefail
          shopt -s nullglob
          for ex in examples/*/go.mod; do
            d=$(dirname "$ex")
            echo "::group::go test $d"
            (cd "$d" && GOWORK=off go test -race -tags=example -count=1 -timeout=5m ./...)
            echo "::endgroup::"
          done

      - name: Test shared example helpers (race only)
        run: |
          set -euo pipefail
          for d in examples/internal/rpkit examples/internal/seedkit; do
            echo "::group::go test $d"
            (cd "$d" && GOWORK=off go test -race -tags=example -count=1 -timeout=5m ./...)
            echo "::endgroup::"
          done

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: cover.root.out,cover.sql.out,cover.redis.out,cover.dynamodb.out
          flags: unit
          fail_ci_if_error: false
          disable_search: true

  examples:
    name: examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: |
            go.sum
            op/storeadapter/sql/go.sum
            op/storeadapter/redis/go.sum
            op/storeadapter/dynamodb/go.sum

      - name: make verify-examples
        run: make verify-examples

  # The runtime half of the example gate. verify-examples only compiles and
  # vets, so an example whose configuration op.New has come to reject stays
  # green there; this job is the one that boots each example as a real
  # process. It is a separate job because it takes minutes, and the browser
  # half needs a Chrome the compile job has no reason to install.
  example-harness:
    name: example harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: |
            go.sum
            op/storeadapter/sql/go.sum
            op/storeadapter/redis/go.sum
            op/storeadapter/dynamodb/go.sum

      - name: make verify-examples-api
        run: make verify-examples-api

      # ubuntu-latest ships Chrome, so a skip here would mean the harness
      # stopped finding it rather than that the runner lacks one.
      - name: make verify-examples-browser
        run: make verify-examples-browser
        env:
          BROWSERVERIFY_REQUIRED: "1"

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Cache pinned tool binaries
        uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-${{ hashFiles('tools/go.mod', 'tools/go.sum', 'tools/tools.go') }}
          restore-keys: |
            go-tools-${{ runner.os }}-

      - name: Install pinned tools
        run: make tools

      - name: make govulncheck
        run: make govulncheck
