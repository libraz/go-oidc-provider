version: "2"

run:
  timeout: 5m
  go: "1.23"
  modules-download-mode: readonly
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosec
    - errorlint
    - revive
    - gocritic
    - depguard
    - bodyclose
    - noctx
    - nilerr
    - nilnil
    - nolintlint
    - exhaustive
    - ireturn
    - gocognit
    - cyclop
    - prealloc
    - predeclared
    - tagalign
    - perfsprint
    - copyloopvar
    - intrange
    - testpackage
    - tparallel
    - paralleltest
    - nakedret
    - forbidigo
    - gochecknoinits
    - gochecknoglobals

  settings:
    cyclop:
      max-complexity: 15
    gocognit:
      min-complexity: 15
    revive:
      severity: error
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: receiver-naming
        - name: indent-error-flow
        - name: unused-parameter
        - name: time-equal
        - name: defer
        - name: empty-block
    forbidigo:
      # Match against the resolved package rather than the literal
      # source text, so an aliased import cannot walk past a rule.
      # `pattern` is then matched against "<package name>.<identifier>"
      # and `pkg` against the full import path; a rule that names an
      # import path in `pattern` alone matches nothing.
      analyze-types: true
      forbid:
        - pattern: ^time\.Now$
          pkg: ^time$
          msg: "use a Clock obtained from internal/timex so every deadline is testable and moves together"
        - pattern: ^rand\.
          pkg: ^math/rand(/v2)?$
          msg: "math/rand is forbidden; use crypto/rand via internal/keys"
        - pattern: ^panic$
          msg: "panic is forbidden in library code; return an error"
    depguard:
      rules:
        main:
          list-mode: lax
          deny:
            - pkg: math/rand
              desc: "use crypto/rand via internal/keys"
            - pkg: io/ioutil
              desc: "deprecated; use io / os"
            - pkg: github.com/sirupsen/logrus
              desc: "use log/slog"
            - pkg: go.uber.org/zap
              desc: "use log/slog"
        # crypto/rand may only be imported from a small allow-list of
        # packages. Files NOT matching the listed globs cannot import it.
        # The leading "!" inverts the glob: "this rule applies to files
        # that do NOT match" — i.e. the deny only fires outside the allow-
        # list. Test files are exempt so test fixtures can build keys.
        crypto-rand-restrict:
          list-mode: lax
          files:
            - "!**/internal/keys/**"
            - "!**/internal/jose/**"
            - "!**/internal/dpop/**"
            - "!**/internal/csrf/**"
            - "!**/internal/cookie/**"
            - "!**/internal/sessions/**"
            - "!**/internal/tokens/**"
            - "!**/internal/tokenendpoint/**"
            - "!**/internal/authorizeendpoint/**"
            - "!**/internal/parendpoint/**"
            - "!**/internal/registrationendpoint/**"
            - "!**/internal/grants/**"
            - "!**/internal/customgrant/**"
            - "!**/internal/devicecode/**"
            - "!**/internal/devicecodeendpoint/**"
            - "!**/internal/cibaendpoint/**"
            - "!**/internal/authn/**"
            - "!**/internal/backchannel/**"
            - "!**/internal/clientauth/**"
            - "!**/internal/httpx/**"
            - "!**/op/testkit/**"
            # internal/testutil holds test-only support packages that are
            # imported from _test.go files in other packages, so they
            # cannot themselves be _test.go and are not covered by the
            # blanket test-file exemption below.
            - "!**/internal/testutil/**"
            - "!**/test/scenarios/internal/scenariokit/**"
            - "!**/op/registration.go"
            - "!**/op/dpop_inmemory.go"
            - "!**/cmd/op-demo/**"
            - "!**/examples/**"
            - "!**/*_test.go"
          deny:
            - pkg: crypto/rand
              desc: "crypto/rand is allow-listed; route randomness through internal/keys"
        # Argon2id derivation is admitted through a concurrency gate in
        # internal/argon2id, because one derivation reserves 64 MiB for
        # its duration and an unauthenticated caller can trigger it.
        # A call site that reached the derivation library directly would
        # take the memory outside that bound — and if it were one of the
        # timing shims, would also let a rejection skip the queue a real
        # verify waits in, rebuilding the client-existence timing
        # channel out of load. Neither failure changes any test's
        # result, so the import restriction is the check. Test files are
        # exempt: fixtures build stored hashes directly, and the gate's
        # own benchmark has to measure the ungated curve to justify the
        # capacity.
        argon2-isolation:
          list-mode: lax
          files:
            - "!**/internal/argon2id/**"
            - "!**/*_test.go"
          deny:
            - pkg: golang.org/x/crypto/argon2
              desc: "derive through internal/argon2id.Key so the derivation stays inside the concurrency gate"
        # go-jose/v4 is the only JOSE primitive in the module. Every
        # signing / verification path is required to route through the
        # closed-type Algorithm allow-list in internal/jose, so a new
        # package gaining direct access to the underlying library would
        # silently widen the attack surface (alg-confusion, "none",
        # HS256-on-public-key). The allow-list pins the current callers;
        # any new caller must be added here intentionally — at which
        # point the security review naturally asks whether the new
        # caller is also routing through internal/jose's Algorithm gate.
        # Test infrastructure (testkit / scenariokit) and *_test.go are
        # exempt so fixtures can build raw JWS / JWE payloads.
        jose-isolation:
          list-mode: lax
          files:
            - "!**/internal/jose/**"
            - "!**/internal/keys/**"
            - "!**/internal/dpop/**"
            - "!**/internal/jar/**"
            - "!**/internal/jarm/**"
            - "!**/internal/mtls/**"
            - "!**/internal/backchannel/**"
            - "!**/internal/clientauth/**"
            - "!**/internal/clientencjwks/**"
            - "!**/internal/introspectendpoint/**"
            - "!**/internal/rpjwks/**"
            - "!**/internal/tokens/**"
            - "!**/internal/userinfo/**"
            - "!**/op/testkit/**"
            - "!**/test/scenarios/internal/scenariokit/**"
            - "!**/*_test.go"
          deny:
            - pkg: github.com/go-jose/go-jose/v4
              desc: "go-jose/v4 is allow-listed; new callers must route through internal/jose for the Algorithm gate"
        # Go's /internal/ path rule already blocks external imports of
        # internal/. This rule additionally blocks intra-module callers
        # outside op/ and internal/ (i.e. examples/, cmd/) from reaching
        # in. The op/ public namespace is allowed: it is the bridge
        # layer that wires user-supplied configuration into private
        # implementation packages.
        internal-isolation:
          list-mode: lax
          files:
            - "!**/*_test.go"
            - "!**/internal/**"
            - "!**/op/**"
          deny:
            - pkg: github.com/libraz/go-oidc-provider/internal
              desc: "internal/* may only be reached via the op/ namespace"
    exhaustive:
      default-signifies-exhaustive: true
    gosec:
      excludes:
        - G104
    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib
        # A function returning its own type parameter has no concrete
        # type available to return instead, so the finding is never
        # actionable there.
        - generic
        - github.com/libraz/go-oidc-provider/op\.Option
        - github.com/libraz/go-oidc-provider/op\.CIBAOption
        - github.com/libraz/go-oidc-provider/op\.HintResolver
        - github.com/libraz/go-oidc-provider/op/store\..*
        - github.com/libraz/go-oidc-provider/op/interaction\..*
        - github.com/libraz/go-oidc-provider/op/grant\..*
        - github.com/libraz/go-oidc-provider/op/feature\..*
        - github.com/libraz/go-oidc-provider/op/profile\..*
        - github.com/libraz/go-oidc-provider/internal/log\.Logger
        - github.com/libraz/go-oidc-provider/internal/timex\.Clock
        - github.com/libraz/go-oidc-provider/internal/audit\.Emitter
        - github.com/libraz/go-oidc-provider/internal/jose\.EncryptionKeyResolver
        - github.com/go-jose/go-jose/v4\.Signer
        - github.com/libraz/go-oidc-provider/op/storeadapter/sql\.runner
        - github.com/libraz/go-oidc-provider/op/storeadapter/sql\.scanner
        # The from-scratch reference store hands out the same two
        # seams, and for the same reason: the transaction-bound
        # implementation is what reports a settled handle, so a
        # concrete return type would leave that path unable to.
        - github.com/libraz/go-oidc-provider/examples/26-byo-store-from-scratch\.querier
        - github.com/libraz/go-oidc-provider/examples/26-byo-store-from-scratch\.scanner
    nakedret:
      max-func-lines: 30
    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gochecknoglobals
          - gochecknoinits
          - cyclop
          - gocognit
          - errcheck
          - forbidigo
      # G124 wants Secure / HttpOnly / SameSite on every http.Cookie
      # literal, but a cookie handed to Request.AddCookie is serialised as
      # a bare name=value Cookie header: the attributes exist only on the
      # Set-Cookie side and are dropped. Tests build cookies to drive a
      # request, so the finding is never actionable there. The one place
      # that does emit Set-Cookie is internal/cookie, which is production
      # code and stays covered.
      - path: _test\.go
        linters:
          - gosec
        text: "G124"
      - path: examples/
        linters:
          - depguard
          - gochecknoglobals
          - gosec
      # The example verification harnesses (apiverify / browserverify) are
      # modules made entirely of _test.go files. Each test compiles one
      # example and runs it as a subprocess, and the examples bind fixed
      # ports (OP :8080, RP :9090) plus, for browserverify, a single
      # headless Chrome — so the tests are required to run sequentially and
      # t.Parallel would make them fight over the port. Nothing here is
      # importable either: there is no production package, so an external
      # _test package would be a rename with no visibility change.
      - path: examples/internal/(api|browser)verify/
        linters:
          - paralleltest
          - testpackage
      # The reference application is an embedder, not library code. Two
      # rules exist to keep the library routing through internal packages
      # it cannot reach from outside the module: randomness through
      # internal/keys (depguard) and wall-clock reads through
      # internal/timex (forbidigo). An application calls crypto/rand and
      # time.Now directly, which is what its readers should copy.
      #
      # The forbidigo half is narrowed to the wall-clock rule on purpose.
      # Excluding the whole linter also lifted the math/rand ban, and a
      # reference application seeding randomness from math/rand is
      # exactly the code a reader would copy.
      - path: sample/
        linters:
          - depguard
          - gochecknoglobals
      - path: sample/
        linters:
          - forbidigo
        text: time\.Now
      - path: cmd/op-demo/
        linters:
          - gochecknoinits

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/libraz/go-oidc-provider
