# yaml-language-server: $schema=./schema.json
feature: ciba
prefix: CIBA
title: Client-Initiated Backchannel Authentication
specs:
  - OpenID Connect Client-Initiated Backchannel Authentication Flow — Core 1.0
  - OpenID Connect Discovery 1.0 §3 (CIBA metadata)
  - RFC 9126 — Pushed Authorization Requests (interaction with CIBA)
  - RFC 9101 — JWT-Secured Authorization Request (signed CIBA requests)
  - FAPI-CIBA Profile (signed Request Object claims, alg restrictions)
  - RFC 6749 §5.2 (invalid_client, invalid_request)
  - RFC 7519 §4.1 (registered JWT claims)

description: |
  CIBA endpoint (POST /bc-authorize, mounted under the OP's mountPrefix
  — /oidc/bc-authorize on the testkit) plus the
  urn:openid:params:grant-type:ciba token grant. v1.0 ships poll-mode
  delivery only; ping and push are reserved for a future release. The
  auth_req_id is the wire identifier of the persisted store.CIBARequest;
  embedders Approve / Deny by calling store.CIBARequestStore directly.
  Discovery, parameter validation, signed Request Object handling under
  FAPI-CIBA, and hint resolution are all in scope.

rows:
  - id: CIBA-001
    severity: P1
    spec: CIBA Core §4; OIDC Discovery §3
    behaviour: |
      With CIBA enabled and the JAR feature off, discovery advertises
      backchannel_authentication_endpoint (issuer + mountPrefix +
      /bc-authorize), backchannel_token_delivery_modes_supported=["poll"]
      (poll-only — ping is deferred), and
      backchannel_user_code_parameter_supported is not advertised as
      true (the field is encoded with omitempty, so a deployment that
      does not pre-validate user codes either omits it or emits
      false — the wire forbids only the true shape). The
      backchannel_authentication_request_signing_alg_values_supported
      field MUST be absent because the CIBA request-object channel
      shares the JAR verifier.
    status: active

  - id: CIBA-002
    severity: P1
    spec: CIBA Core §7.1.1; FAPI-CIBA §5.2.2; OIDC Discovery §3
    behaviour: |
      With CIBA enabled and the JAR feature also on, discovery
      additionally publishes
      backchannel_authentication_request_signing_alg_values_supported
      (RS256, PS256, ES256, EdDSA). The list MUST exclude HS-family
      algorithms per FAPI-CIBA's symmetric-alg ban.
    status: active

  - id: CIBA-003
    severity: P1
    spec: CIBA Core §10
    behaviour: |
      Embedders Approve a Pending CIBA request through the
      store.CIBARequestStore substore directly; an unknown auth_req_id
      surfaces as store.ErrNotFound to the embedder.
    status: out-of-scope
    out_of_scope_reason: "Provider-side approval-result API is a JS-runtime hook not modelled in v1.0; embedders Approve/Deny via store.CIBARequestStore directly (op/store/cibarequests.go)."

  - id: CIBA-004
    severity: P2
    spec: CIBA Core §10
    behaviour: |
      The provider-side approval API also accepts a typed
      BackchannelAuthenticationRequest instance directly.
    status: out-of-scope
    out_of_scope_reason: "Typed-request overload of the provider-side approval API is a JS-runtime hook not modelled in v1.0; embedders interact with store.CIBARequestStore using auth_req_id strings."

  - id: CIBA-005
    severity: P2
    spec: CIBA Core §10
    behaviour: |
      Calling the provider-side approval API with an invalid request
      type raises a runtime type error.
    status: out-of-scope
    out_of_scope_reason: "JS-runtime type-checks not applicable to the Go-typed surface; equivalent discipline is enforced by the compiler."

  - id: CIBA-006
    severity: P1
    spec: CIBA Core §10
    behaviour: |
      The provider-side approval API resolves a Grant JTI string to a
      Grant entity; an unknown JTI MUST be rejected.
    status: out-of-scope
    out_of_scope_reason: "Grant-string-to-entity resolution is a JS-runtime hook not modelled in v1.0; grant binding lives on the persisted CIBARequest."

  - id: CIBA-007
    severity: P2
    spec: CIBA Core §10
    behaviour: |
      Passing an invalid result type to the provider-side approval API
      raises a runtime type error.
    status: out-of-scope
    out_of_scope_reason: "JS-runtime type-checks not applicable to the Go-typed surface; equivalent discipline is enforced by the compiler."

  - id: CIBA-008
    severity: P1
    spec: CIBA Core §10
    behaviour: |
      The provider-side approval API rejects a request whose clientId
      does not resolve to a known client.
    status: out-of-scope
    out_of_scope_reason: "clientId resolution via the provider-side approval API is a JS-runtime hook not modelled; v1.0 reads client_id off the CIBARequest record directly."

  - id: CIBA-009
    severity: P0
    spec: CIBA Core §10
    behaviour: |
      The provider-side approval API rejects when the request's
      clientId differs from the Grant's clientId; cross-client grant
      binding is forbidden.
    status: out-of-scope
    out_of_scope_reason: "Client-mismatch guard via the provider-side approval API is a JS-runtime hook not modelled; v1.0's /token grant handler enforces client binding via store.CIBARequestStore (internal/grants/ciba.go)."

  - id: CIBA-010
    severity: P0
    spec: CIBA Core §10
    behaviour: |
      The provider-side approval API rejects when the request's
      accountId differs from the Grant's accountId.
    status: out-of-scope
    out_of_scope_reason: "AccountId-mismatch guard via the provider-side approval API is a JS-runtime hook not modelled; v1.0 records subject on the persisted CIBARequest and requires no separate accountId comparison."

  - id: CIBA-011
    severity: P2
    spec: CIBA Core §10
    behaviour: |
      Calling the provider-side approval API on an unsaved request
      persists the request and assigns it a JTI on the fly.
    status: out-of-scope
    out_of_scope_reason: "On-the-fly persistence inside the provider-side approval API is a JS-runtime hook not modelled; v1.0 persists at /bc-authorize emission."

  - id: CIBA-012
    severity: P0
    spec: CIBA Core §10.2
    behaviour: |
      For ping-mode clients, a backend that returns 204 No Content to
      the notification callback is treated as successful delivery.
    status: out-of-scope
    out_of_scope_reason: "Ping-mode delivery (HTTP 204) deferred. v1.0 advertises poll-only (backchannel_token_delivery_modes_supported=[\"poll\"]); ping is post-v1.0 — see internal/discovery/build.go::applyCIBAFeature."

  - id: CIBA-013
    severity: P1
    spec: CIBA Core §10.2
    behaviour: |
      For ping-mode clients, a backend that returns 200 OK to the
      notification callback is treated as successful delivery.
    status: out-of-scope
    out_of_scope_reason: "Ping-mode delivery (HTTP 200) deferred. v1.0 advertises poll-only; ping is post-v1.0."

  - id: CIBA-014
    severity: P0
    spec: CIBA Core §10.2
    behaviour: |
      When the ping endpoint returns 4xx, the provider raises a
      delivery-integrity error referencing the response.
    status: out-of-scope
    out_of_scope_reason: "Ping-mode delivery (4xx integrity surface) deferred. v1.0 advertises poll-only; there is no ping callback to fail."

  - id: CIBA-015
    severity: P0
    spec: CIBA Core §7.1, §7.3
    behaviour: |
      A POST /bc-authorize with login_hint, scope=openid, and valid
      client authentication returns 200 application/json with a
      non-empty auth_req_id, expires_in (capped by the OP default), and
      interval. The persisted store.CIBARequest carries the resolved
      subject (from the configured HintResolver) and the requested
      scope.
    status: active

  - id: CIBA-016
    severity: P1
    spec: CIBA Core §7.1; RFC 9126 §2
    behaviour: |
      A client posting directly to /bc-authorize MUST receive 200 OK
      regardless of the deployment's PAR posture. CIBA is a separate
      request channel and does not flow through PAR.
    status: active

  - id: CIBA-017
    severity: P1
    spec: CIBA Core §7.1
    behaviour: |
      When the request supplies requested_expiry=300 and the OP's
      configured CIBA max-expiry is at least 300 seconds, the response
      expires_in is exactly 300.
    status: active

  - id: CIBA-018
    severity: P0
    spec: CIBA Core §7.1
    behaviour: |
      A POST /bc-authorize with login_hint_token and scope=openid
      returns 200 OK; the persisted record's hint_kind is
      "login_hint_token".
    status: active

  - id: CIBA-019
    severity: P0
    spec: CIBA Core §7.1
    behaviour: |
      A POST /bc-authorize with id_token_hint and scope=openid returns
      200 OK; the persisted record's hint_kind is "id_token_hint". The
      handler does not parse the id_token internally — the
      HintResolver receives the raw value and is responsible for any
      JWT verification.
    status: active

  - id: CIBA-020
    severity: P0
    spec: CIBA Core §4
    behaviour: |
      A registered client whose grant_types do not include
      urn:openid:params:grant-type:ciba MUST be rejected with 400
      unauthorized_client and the description "client is not authorized
      for the ciba grant".
    status: active

  - id: CIBA-021
    severity: P0
    spec: RFC 6749 §5.2; CIBA Core §7.1
    behaviour: |
      An unknown client_id at /bc-authorize MUST be rejected with 401
      invalid_client.
    status: active

  - id: CIBA-022
    severity: P1
    spec: CIBA Core §7; RFC 6749 §3.2
    behaviour: |
      /bc-authorize MUST reject any body whose Content-Type is not
      application/x-www-form-urlencoded with 400 invalid_request and
      the description "content-type must be application/x-www-form-urlencoded".
    status: active

  - id: CIBA-023
    severity: P1
    spec: CIBA Core §7.1.1
    behaviour: |
      /bc-authorize MUST reject a "request" form parameter when the
      JAR feature is off with 400 invalid_request_object and the
      description "request is not supported by this OP".
    status: active

  - id: CIBA-024
    severity: P1
    spec: CIBA Core §7.1
    behaviour: |
      /bc-authorize rejects a request_uri form parameter; CIBA never
      supports request_uri.
    status: out-of-scope
    out_of_scope_reason: "request_uri at /bc-authorize: CIBA Core §7.1 does not define request_uri for backchannel-authentication; v1.0 silently ignores unknown form params. The signed-request channel is JWT-by-value via the \"request\" parameter only."

  - id: CIBA-025
    severity: P1
    spec: OIDC Core §7.2.1
    behaviour: |
      /bc-authorize rejects a registration form parameter.
    status: out-of-scope
    out_of_scope_reason: 'registration parameter on CIBA: OIDC Core §7.2.1 defines "registration" for the front-channel /authorize redirect; CIBA never carries it. v1.0 ignores unknown form params.'

  - id: CIBA-026
    severity: P0
    spec: CIBA Core §7.1, §13
    behaviour: |
      When a login_hint cannot resolve to a known end-user (the
      HintResolver returns op.ErrUnknownCIBAUser), /bc-authorize MUST
      return 400 unknown_user_id with the description "the hint did
      not resolve to a known end-user".
    status: active

  - id: CIBA-027
    severity: P0
    spec: CIBA Core §7.1.1
    behaviour: |
      When a login_hint_token cannot resolve to a known end-user (the
      HintResolver returns op.ErrUnknownCIBAUser), /bc-authorize MUST
      return 400 unknown_user_id with the description "the hint did
      not resolve to a known end-user".
    status: active

  - id: CIBA-028
    severity: P0
    spec: CIBA Core §7.1
    behaviour: |
      A /bc-authorize request missing scope MUST be rejected with 400
      invalid_request and the description "scope parameter is required".
    status: active

  - id: CIBA-029
    severity: P0
    spec: CIBA Core §7.1.1
    behaviour: |
      A ping-mode client that omits client_notification_token MUST be
      rejected with 400 invalid_request.
    status: out-of-scope
    out_of_scope_reason: "Ping-mode client_notification_token deferred. v1.0 advertises poll-only; ping is post-v1.0."

  - id: CIBA-030
    severity: P0
    spec: CIBA Core §7.1
    behaviour: |
      A scope value that lacks openid MUST be rejected with 400
      invalid_scope and the description "the openid scope value is
      required for ciba".
    status: active

  - id: CIBA-031
    severity: P1
    spec: CIBA Core §7.1
    behaviour: |
      requested_expiry that is not a positive integer (zero, a
      negative integer, or a non-numeric string) MUST be rejected with
      400 invalid_request and the description "requested_expiry must
      be a positive integer".
    status: active

  - id: CIBA-032
    severity: P0
    spec: CIBA Core §7.1
    behaviour: |
      A request supplying none of login_hint / login_hint_token /
      id_token_hint MUST be rejected with 400 invalid_request and the
      description "exactly one of login_hint, id_token_hint, or
      login_hint_token is required".
    status: active

  - id: CIBA-033
    severity: P0
    spec: CIBA Core §7.1
    behaviour: |
      A request supplying more than one hint parameter MUST be rejected
      with 400 invalid_request and the description "exactly one of
      login_hint, id_token_hint, or login_hint_token is required".
    status: active

  - id: CIBA-034
    severity: P1
    spec: CIBA Core §7.1
    behaviour: |
      With JAR enabled but no FAPI-CIBA profile active, /bc-authorize
      MUST still accept plain form requests that do not include a
      "request" parameter — the signed-request channel is opt-in for
      vanilla deployments. 200 OK.
    status: active

  - id: CIBA-035
    severity: P1
    spec: CIBA Core §7.1.1
    behaviour: |
      Even with JAR enabled, /bc-authorize rejects a request_uri form
      parameter.
    status: out-of-scope
    out_of_scope_reason: "request_uri at /bc-authorize (with-JAR variant): CIBA Core §7.1 does not define request_uri for backchannel-authentication; v1.0 silently ignores unknown form params. The signed-request channel is JWT-by-value via the \"request\" parameter only."

  - id: CIBA-036
    severity: P1
    spec: OIDC Core §7.2.1
    behaviour: |
      Even with JAR enabled, /bc-authorize rejects a registration form
      parameter.
    status: out-of-scope
    out_of_scope_reason: 'registration parameter on CIBA (with-JAR variant): OIDC Core §7.2.1 defines "registration" for the front-channel /authorize redirect; CIBA never carries it. v1.0 ignores unknown form params.'

  - id: CIBA-037
    severity: P0
    spec: CIBA Core §7.1.1; FAPI-CIBA §5.2.2
    behaviour: |
      Under FAPI-CIBA profile, posting /bc-authorize without a
      "request" parameter MUST be rejected with 400 invalid_request and
      the description "request object is required by the active
      profile". Retrying with a valid signed Request Object yields 200
      OK.
    status: active

  - id: CIBA-038
    severity: P0
    spec: CIBA Core §7.1.1; RFC 9101 §10.8
    behaviour: |
      Under FAPI-CIBA profile, a signed Request Object missing the
      exp claim MUST be rejected with 400 invalid_request_object.
    status: active

  - id: CIBA-039
    severity: P0
    spec: CIBA Core §7.1.1; FAPI-CIBA §5.2.2
    behaviour: |
      Under FAPI-CIBA profile, a signed Request Object missing the
      nbf claim MUST be rejected with 400 invalid_request_object. The
      JAR verifier flips RequireNbf=true under FAPI-CIBA per
      FAPI 2.0 Message Signing §5.6.
    status: active

  - id: CIBA-040
    severity: P0
    spec: CIBA Core §7.1.1; RFC 7519 §4.1.7
    behaviour: |
      Under FAPI-CIBA profile, a signed Request Object missing the
      jti claim MUST be rejected with 400 invalid_request_object. The
      JAR verifier flips AllowMissingJTI=false under any FAPI profile.
    status: active

  - id: CIBA-041
    severity: P0
    spec: CIBA Core §7.1.1; RFC 7519 §4.1.6
    behaviour: |
      Under FAPI-CIBA profile, a signed Request Object missing the
      iat claim is rejected with 400 invalid_request_object.
    status: out-of-scope
    out_of_scope_reason: "Mandatory iat claim on the request object: RFC 9101 §6.1 marks iat OPTIONAL and v1.0's JAR verifier honours that — replay defence is anchored on exp + jti, not iat. See internal/jar/verify.go::assertIat."

  - id: CIBA-042
    severity: P1
    spec: CIBA Core §7.1.1
    behaviour: |
      A JWE-formed request parameter MUST be rejected with 400
      invalid_request_object.
    status: out-of-scope
    out_of_scope_reason: "Encrypted CIBA request object rejection: v1.0's JAR verifier accepts JWE-wrapped request objects when an encryption keyset is registered (internal/jar/verify.go); FAPI-CIBA-ID1 §5.2.2 does not forbid encryption. If a deployment wishes to disallow it, the embedder leaves WithEncryptionKeyset unset."

  - id: CIBA-043
    severity: P1
    spec: RFC 6749 §3.2; CIBA Core §7.1
    behaviour: |
      /bc-authorize MUST reject any request whose body repeats a
      single-valued parameter (login_hint, login_hint_token,
      id_token_hint, binding_message, acr_values, requested_expiry,
      scope, user_code, request, or client_notification_token). The
      response is 400 invalid_request before hint classification or
      scope parsing fires. The RFC 8707 §2 resource indicator is
      legitimately multi-valued and MUST still be accepted; client_id
      and client_secret are validated by the client-authentication
      layer and do not double-fire here.
    status: active

  - id: CIBA-044
    severity: P0
    spec: FAPI-CIBA-ID1 §5; FAPI 2.0 §3.1.9; CIBA Core §7.1
    behaviour: |
      Under the FAPI-CIBA profile, /bc-authorize MUST reject any
      requested_expiry value above the ten-minute (600s) cap with
      400 invalid_request. The error description names the
      "FAPI-CIBA 10-minute cap" so a conformance probe can diagnose
      the over-spec request. Under non-FAPI-CIBA deployments the
      legacy clamp behaviour against MaxExpiresIn is preserved (a
      requested_expiry above the cap is silently capped, not
      rejected) so vanilla CIBA Core compliance stays intact.
      Boundary: requested_expiry=600 is accepted under FAPI-CIBA;
      requested_expiry=601 is rejected.
    status: active

  - id: CIBA-045
    severity: P0
    spec: OIDC Core §3.1.2.1; CIBA Core §7.1
    behaviour: |
      When the OP advertises acr_values_supported in discovery,
      /bc-authorize MUST reject any acr_values entry the client
      requests that is absent from the advertised list with 400
      invalid_request. The error description names the offending
      value and references acr_values_supported. Without the gate a
      client could drive the issued id_token's acr claim to any
      string regardless of the OP's enrolled set. When the OP did
      not advertise acr_values_supported (the field is omitted /
      empty), the legacy "carry verbatim" posture is preserved.
    status: active

  - id: CIBA-046
    severity: P1
    spec: CIBA Core §7.1
    behaviour: |
      The OP advertises backchannel_user_code_parameter_supported as
      false (the v0.9.x default; the option to flip the flag is
      reserved for a future release). CIBA Core §7.1 requires the
      client to refrain from sending parameters the OP has not
      advertised, so any non-empty user_code on /bc-authorize MUST
      be rejected with 400 invalid_request and the description
      "user_code parameter is not supported". Absent or empty
      user_code values continue to succeed.
    status: active

  - id: CIBA-047
    severity: P0
    spec: RFC 8707 §2 / CIBA Core §7.1
    behaviour: |
      A /bc-authorize request whose resource indicator is a
      syntactically valid absolute URI but does not appear in the
      client's registered Resources allowlist MUST be rejected with
      400 invalid_target. The check mirrors /authorize and
      /token (client_credentials), preventing audience escalation
      against a client that has never been registered for the
      resource server.
    status: active

  - id: CIBA-048
    severity: P0
    spec: RFC 8707 §2 / CIBA Core §7.1
    behaviour: |
      v0.9.x's issuance pipeline encodes a single audience entry on
      the access-token aud claim, so a /bc-authorize request
      carrying more than one resource= form value (RFC 8707 §2
      permits the parameter to repeat) MUST be rejected with 400
      invalid_target rather than silently truncated to the first
      entry. Multi-aud support is deferred to a later wave; the
      handler refuses input the issuer side cannot honour in full.
    status: active

  - id: CIBA-049
    severity: P1
    spec: OIDC Core §2 / CIBA Core §7.1
    behaviour: |
      The id_token issued from a CIBA poll redemption MUST stamp
      acr from the first entry of the persisted ACRValues slice
      when non-empty, and MUST NOT synthesise amr by copying the
      same slice. acr names the authentication context class and
      amr names the authentication methods used; the two are not
      synonymous, and the v0.9.x CIBARequest substore does not
      retain a real authentication-method signal. The previous
      "amr := acr_values" plumbing was a wire-shape mismatch and
      let the OP misrepresent the methods the authentication device
      actually satisfied.
    status: active
