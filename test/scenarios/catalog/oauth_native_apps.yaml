# yaml-language-server: $schema=./schema.json
feature: oauth_native_apps
prefix: NA
title: OAuth 2.0 for Native Apps
specs:
  - RFC 8252 — OAuth 2.0 for Native Apps (§7.3 Loopback Interface Redirection)
  - RFC 6749 §3.1.2 (Redirection Endpoint), §10.6 (authorization code redirection-URI manipulation)
  - RFC 3986 — Uniform Resource Identifier (Generic Syntax)
  - OIDC Dynamic Client Registration §2 (application_type=native)
  - OpenID Connect RP-Initiated Logout (post_logout_redirect_uris semantics)

description: |
  Loopback redirect URI handling for native applications: parse-time
  rejection of malformed URIs, port-flexibility for IPv4/IPv6/localhost
  loopback variants on both redirect_uri and post_logout_redirect_uris,
  and registration-time rejection of non-loopback http schemes.

rows:
  - id: NA-001
    severity: P0
    spec: RFC 8252 §7.3 / RFC 3986
    behaviour: |
      The redirectUriAllowed and postLogoutRedirectUriAllowed
      predicates MUST return false for redirect URI strings that are
      not parseable URLs (for example "http:", "http://127.0.0.",
      "http://127.0.0.1::"); malformed URIs MUST NOT be approved.
    status: active

  - id: NA-002
    severity: P0
    spec: RFC 8252 §7.3 / OIDC Reg §2
    behaviour: |
      For a native client registered with
      http://localhost:2355/op/callback, redirectUriAllowed MUST
      return true for any port variant on the same host and path: no
      port, port 80, port 443, the originally registered port, and
      any other port (e.g. 8888). DCR (OIDC Reg §2 / RFC 8252 §7.3)
      admits the textual "localhost" alongside 127.0.0.1 / ::1 for
      native clients, so the authorize-side wildcard MUST mirror
      that set; otherwise registration succeeds but the typical
      ephemeral-port callback fails at /authorize.
    status: active

  - id: NA-003
    severity: P0
    spec: RFC 8252 §7.3 / OIDC Reg §2
    behaviour: |
      For a native client registered with http://localhost/op/callback
      (no port), redirectUriAllowed MUST return true for any port
      variant (none, 80, 443, 2355, 8888) on the same host and path.
      DCR admits the textual "localhost" for native clients; the
      authorize-side wildcard mirrors that set.
    status: active

  - id: NA-004
    severity: P0
    spec: RFC 8252 §7.3
    behaviour: |
      For a native client registered with
      http://127.0.0.1:2355/op/callback, redirectUriAllowed MUST
      return true for any port variant on 127.0.0.1 with the same
      path.
    status: active

  - id: NA-005
    severity: P0
    spec: RFC 8252 §7.3
    behaviour: |
      For a native client registered with http://127.0.0.1/op/callback
      (no port), redirectUriAllowed MUST return true for any port
      variant on 127.0.0.1 with the same path.
    status: active

  - id: NA-006
    severity: P0
    spec: RFC 8252 §7.3
    behaviour: |
      For a native client registered with
      http://[::1]:2355/op/callback, redirectUriAllowed MUST return
      true for any port variant on [::1] with the same path.
    status: active

  - id: NA-007
    severity: P0
    spec: RFC 8252 §7.3
    behaviour: |
      For a native client registered with http://[::1]/op/callback
      (no port), redirectUriAllowed MUST return true for any port
      variant on [::1] with the same path.
    status: active

  - id: NA-008
    severity: P1
    spec: RFC 8252 §7.3 / OIDC RP-Initiated Logout §3
    behaviour: |
      For a native client whose post_logout_redirect_uris registers
      http://localhost:2355/op/logout, postLogoutRedirectUriAllowed
      MUST return true for any port variant on localhost with the
      same path.
    status: out-of-scope
    out_of_scope_reason: "Same RFC 8252 §7.3 'localhost is NOT RECOMMENDED' rationale as NA-002 / NA-003: v1.0 rejects the textual 'localhost' host and accepts only the IP literals (127.0.0.1 / ::1) the RFC actually recommends. Independently, v1.0's /end_session does byte-for-byte exact-match comparison on store.Client.PostLogoutRedirectURIs (internal/endsession/handler.go validatePostLogout) — there is no loopback-port-wildcard relaxation on the post-logout side; the IP-literal-port-wildcard semantics tested for redirect_uri (NA-004 / NA-005 / NA-006 / NA-007) live in the /authorize codepath only. Both reasons make this row non-spec residue against v1.0."

  - id: NA-009
    severity: P1
    spec: RFC 8252 §7.3
    behaviour: |
      For a native client whose post_logout_redirect_uris registers
      a localhost URL without a port, postLogoutRedirectUriAllowed
      MUST return true for any port variant on the same host and
      path.
    status: out-of-scope
    out_of_scope_reason: "Same dual rationale as NA-008: (1) RFC 8252 §7.3 'localhost is NOT RECOMMENDED' — v1.0 rejects the textual 'localhost' host (NA-002 / NA-003 OOS); (2) /end_session does byte-for-byte exact-match on store.Client.PostLogoutRedirectURIs, with no loopback-port-wildcard relaxation on the post-logout side."

  - id: NA-010
    severity: P1
    spec: RFC 8252 §7.3
    behaviour: |
      For a native client whose post_logout_redirect_uris registers
      http://127.0.0.1:2355/op/logout, postLogoutRedirectUriAllowed
      MUST return true for any port variant on 127.0.0.1 with the
      same path.
    status: out-of-scope
    out_of_scope_reason: "v1.0's /end_session does byte-for-byte exact-match comparison on store.Client.PostLogoutRedirectURIs (internal/endsession/handler.go validatePostLogout) — there is no loopback-port-wildcard relaxation on the post-logout side. The IP-literal-port-wildcard semantics tested for redirect_uri (NA-004 / NA-005 / NA-006 / NA-007) live in the /authorize codepath only and reflect a deliberate scope split: at /authorize the OS-assigned ephemeral port is unknowable until the native app binds, but at /end_session the RP knows the exact post-logout URL it registered."

  - id: NA-011
    severity: P1
    spec: RFC 8252 §7.3
    behaviour: |
      For a native client whose post_logout_redirect_uris registers
      http://127.0.0.1/op/logout, postLogoutRedirectUriAllowed MUST
      return true for any port variant on 127.0.0.1 with the same
      path.
    status: out-of-scope
    out_of_scope_reason: "Same /end_session exact-match rationale as NA-010: store.Client.PostLogoutRedirectURIs comparison is byte-for-byte; loopback-port-wildcard semantics are scoped to /authorize only (NA-004 / NA-005 / NA-006 / NA-007)."

  - id: NA-012
    severity: P1
    spec: RFC 8252 §7.3
    behaviour: |
      For a native client whose post_logout_redirect_uris registers
      http://[::1]:2355/op/logout, postLogoutRedirectUriAllowed MUST
      return true for any port variant on [::1] with the same path.
    status: out-of-scope
    out_of_scope_reason: "Same /end_session exact-match rationale as NA-010: v1.0 has no loopback-port-wildcard relaxation on the post-logout side for IPv6 [::1] either. /authorize-side IPv6 wildcard is bound by NA-006 / NA-007."

  - id: NA-013
    severity: P1
    spec: RFC 8252 §7.3
    behaviour: |
      For a native client whose post_logout_redirect_uris registers
      http://[::1]/op/logout, postLogoutRedirectUriAllowed MUST
      return true for any port variant on [::1] with the same path.
    status: out-of-scope
    out_of_scope_reason: "Same /end_session exact-match rationale as NA-010 / NA-012: byte-for-byte comparison on store.Client.PostLogoutRedirectURIs, no IPv6 [::1] port-wildcard relaxation on the post-logout side."

  - id: NA-014
    severity: P0
    spec: RFC 8252 §7.3 / §8.3
    behaviour: |
      A client registration with application_type=native and a
      redirect_uri using http to a non-loopback host (e.g.
      http://rp.example.com/op/callback) MUST be rejected with
      invalid_redirect_uri and the description
      "redirect_uris for native clients using http as a protocol can
      only use loopback addresses as hostnames".
    status: active

  - id: NA-015
    severity: P0
    spec: RFC 8252 §7.3 / OIDC RP-Initiated Logout §3
    behaviour: |
      A native client registered with valid loopback redirect_uris
      but post_logout_redirect_uris pointing at a non-loopback http
      URL MUST be rejected with invalid_client_metadata and the
      description "post_logout_redirect_uris for native clients
      using http as a protocol can only use loopback addresses as
      hostnames".
    status: active
