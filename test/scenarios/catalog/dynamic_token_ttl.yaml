# yaml-language-server: $schema=./schema.json
feature: dynamic_token_ttl
prefix: DTT
title: Dynamic per-token TTL
specs:
  - RFC 6749 §4.4 — Client Credentials
  - RFC 6749 §5.1 — expires_in
  - RFC 6749 §6 — Refresh Token
  - RFC 8628 — Device Authorization Grant
  - OIDC Core 1.0 §3.1 — Authorization Code Flow
  - OIDC Core 1.0 §2 — ID Token exp/iat

description: |
  Per-token-kind dynamic TTL configuration: the OP invokes
  (ctx, token, client) and adopts the returned seconds value. Coverage
  spans every grant flow that mints tokens (authorization code, hybrid,
  device, refresh, client credentials) and asserts both response shape
  (expires_in) and ID Token exp/iat consistency.

rows:
  - id: DTT-001
    severity: P1
    spec: RFC 6749 §5.1
    behaviour: |
      With ttl.ClientCredentials configured to return 123 and a grant
      execution of grant_type=client_credentials, the response body
      carries expires_in=123. The TTL function is invoked exactly once
      with the ClientCredentials token instance and the issuing Client.
    status: out-of-scope
    out_of_scope_reason: v1.0 exposes only global static TTL options (op.WithAccessTokenTTL, op.WithRefreshTokenTTL, op.WithRefreshTokenOfflineTTL); there is no per-token-kind callback API like ttl.ClientCredentials(ctx, token, client) the row asserts on. The dynamic-callback contract has no v1.0 wire equivalent. Additionally, the client_credentials grant is allowlisted only for static clients via op.WithGrants — there is no embedder-facing TTL hook to invoke once per credentials issuance.

  - id: DTT-002
    severity: P1
    spec: RFC 8628 §3.2
    behaviour: |
      With ttl.DeviceCode configured to return 123 and a request to
      /device/auth, the response body carries expires_in=123 and the
      TTL function is invoked once with the DeviceCode token instance
      and the issuing Client.
    status: out-of-scope
    out_of_scope_reason: v1.0 does not expose feature.Device or a /device/auth endpoint; grant.DeviceCode constant exists for option-signature stability but no device-flow handler is mounted. The ttl.DeviceCode dynamic callback API is also absent (v1.0 ships only global static TTL options). No v1.0 wire path can drive this row.

  - id: DTT-003
    severity: P1
    spec: RFC 8628 §3.5 / OIDC Core
    behaviour: |
      A device code exchange via
      grant_type=urn:ietf:params:oauth:grant-type:device_code MUST
      invoke the TTL functions for IdToken, AccessToken and
      RefreshToken exactly once each, with the corresponding token
      instance and the issuing Client.
    status: out-of-scope
    out_of_scope_reason: "Device-code grant exchange is not implemented in v1.0; grant.DeviceCode is a stub constant and no token-endpoint dispatcher accepts urn:ietf:params:oauth:grant-type:device_code. Per-token-kind dynamic TTL callbacks (ttl.IdToken, ttl.AccessToken, ttl.RefreshToken) are also absent — v1.0 uses global static TTL options only. No v1.0 wire path can drive this row."

  - id: DTT-004
    severity: P1
    spec: OIDC Core §3.3
    behaviour: |
      For response_type=code id_token token under hybrid flow, the
      TTL functions for AccessToken, IdToken and AuthorizationCode are
      each invoked once. The redirect URL carries expires_in matching
      the AccessToken TTL, the id_token payload satisfies exp - iat
      equal to the IdToken TTL, and the AuthorizationCode TTL is
      consumed when the code is issued.
    status: out-of-scope
    out_of_scope_reason: "v1.0 advertises response_type=code only (op.WithDynamicRegistration AllowedResponseTypes accepts only 'code'; the authorize endpoint rejects every other value). Hybrid response_type='code id_token token' has no v1.0 wire path. Per-token-kind dynamic TTL callbacks are also absent — v1.0 ships only global static TTL options."

  - id: DTT-005
    severity: P1
    spec: OIDC Core §3.1
    behaviour: |
      An authorization_code grant exchange (code plus code_verifier at
      /token) MUST invoke the TTL functions for IdToken, AccessToken
      and RefreshToken exactly once each, each with the correct token
      instance.
    status: out-of-scope
    out_of_scope_reason: "v1.0 exposes only global static TTL options (op.WithAccessTokenTTL, op.WithRefreshTokenTTL); there is no per-token-kind callback API like ttl.IdToken(ctx, token, client). The 'invoke ttl.IdToken / ttl.AccessToken / ttl.RefreshToken exactly once each' contract has no v1.0 surface to assert on. Static-TTL invariants are exercised by the dedicated TTL scenarios in id_token_claims and access_token_opaque."

  - id: DTT-006
    severity: P1
    spec: RFC 6749 §6 / OIDC Core §12
    behaviour: |
      A refresh_token grant exchange MUST invoke the TTL functions
      for IdToken, AccessToken and RefreshToken anew (once each) so
      the refreshed lifetimes can differ from the original issuance.
    status: out-of-scope
    out_of_scope_reason: "Same root cause as DTT-005: v1.0 has no per-token-kind dynamic TTL callback API. Refresh-grant TTL recomputation is governed by the global op.WithRefreshTokenTTL (and offline variant) at issuance time; there is no embedder-supplied ttl.* function that the OP invokes per-grant-execution. The 'reinvoke once per grant' contract is non-spec residue."
