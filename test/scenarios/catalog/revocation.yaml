# yaml-language-server: $schema=./schema.json
feature: revocation
prefix: REV
title: Token revocation endpoint
specs:
  - RFC 7009 — OAuth 2.0 Token Revocation
  - RFC 6749 §2.3 — Client Authentication
  - RFC 8414 §2 — `revocation_endpoint` discovery metadata
  - RFC 9068 §6 — Structured JWT access tokens are not revocable
  - OIDC Core 1.0 §1 — Grant cascade extension

description: |
  Behaviour of the OAuth 2.0 token revocation endpoint. Covers
  discovery metadata, revocation of access / refresh / client
  credentials tokens, token_type_hint handling, optional grant cascade,
  failure modes (missing token, structured JWT, invalid input, adapter
  exception), cross-client semantics (confidential expose vs. public
  silent), and audit observability.

rows:
  - id: REV-001
    severity: P2
    spec: RFC 8414 §2
    behaviour: |
      The discovery document advertises revocation_endpoint with a
      concrete URL and does not emit the legacy
      token_revocation_endpoint name.
    status: active

  - id: REV-002
    severity: P0
    spec: RFC 7009 §2
    behaviour: |
      A confidential client revoking its own access token without a
      hint receives 200 with an empty body and the access token is
      destroyed (subsequent /userinfo calls fail with WWW-Authenticate
      error="invalid_token"). The underlying grant is preserved: the
      paired refresh token still rotates at /token. Per ADR 0025,
      single-AT revocation never cascades to a grant tombstone.
    status: active

  - id: REV-003
    severity: P0
    spec: RFC 7009 §2
    behaviour: |
      With revokeGrantPolicy=true, revoking an access token returns
      200 and destroys both the access token and its grant.
    status: out-of-scope
    out_of_scope_reason: "v1.0 explicitly does NOT cascade single-AT revocation to grant tombstone (ADR 0025 Alternatives). The runtime 'revokeGrantPolicy' flag is panva-specific. Grant cascade in v1.0 is triggered by refresh-token revocation, not access-token revocation. Reconsider when grant-revocation-on-AT-revoke becomes a v1.x option."

  - id: REV-004
    severity: P1
    spec: RFC 7009 §2.1
    behaviour: |
      Revoking an access token with token_type_hint=access_token
      returns 200 with an empty body and destroys the access token.
    status: pending

  - id: REV-005
    severity: P1
    spec: RFC 7009 §2.1
    behaviour: |
      Revoking an access token with token_type_hint=refresh_token
      ignores the wrong hint, resolves the token as an access token,
      destroys it, and returns 200 with an empty body.
    status: pending

  - id: REV-006
    severity: P1
    spec: RFC 7009 §2.1
    behaviour: |
      An unrecognised hint such as foobar is ignored; the access
      token is destroyed and the endpoint returns 200.
    status: pending

  - id: REV-007
    severity: P0
    spec: RFC 7009 §2.2.1
    behaviour: |
      If adapter.find throws while resolving the token, the request
      fails with 500 server_error.
    status: out-of-scope
    out_of_scope_reason: "v1.0 collapses adapter errors onto silent 200 per RFC 7009 §2.2 ('invalid tokens do not cause an error response'); a token.revoke_failed audit event is emitted instead. The panva 'adapter exception → 500 server_error' shape leaks the failure mode through HTTP, contradicting RFC 7009 §2.2."

  - id: REV-008
    severity: P0
    spec: RFC 7009 §2
    behaviour: |
      A confidential client revoking its own refresh token without a
      hint returns 200 with an empty body and destroys the
      refresh-token chain; subsequent /token grant_type=refresh_token
      attempts return invalid_grant.
    status: active

  - id: REV-009
    severity: P1
    spec: RFC 7009 §2.1
    behaviour: |
      Revoking a refresh token with token_type_hint=refresh_token
      returns 200 with an empty body and destroys the refresh token.
    status: pending

  - id: REV-010
    severity: P1
    spec: RFC 7009 §2.1
    behaviour: |
      Revoking a refresh token with token_type_hint=access_token
      ignores the wrong hint, destroys the refresh token, and returns
      200.
    status: pending

  - id: REV-011
    severity: P1
    spec: RFC 7009 §2.1
    behaviour: |
      An unrecognised hint when revoking a refresh token is ignored;
      the refresh token is destroyed and the endpoint returns 200.
    status: pending

  - id: REV-012
    severity: P0
    spec: RFC 7009 §2
    behaviour: |
      A confidential client revoking its own client_credentials
      access token without a hint destroys the token and returns 200
      with an empty body.
    status: active

  - id: REV-013
    severity: P1
    spec: RFC 7009 §2.1
    behaviour: |
      Revoking a client_credentials access token with
      token_type_hint=access_token destroys the token and returns 200.
    status: pending

  - id: REV-014
    severity: P1
    spec: RFC 7009 §2.1
    behaviour: |
      An unrecognised hint when revoking a client_credentials access
      token is ignored; the token is destroyed and the endpoint
      returns 200.
    status: pending

  - id: REV-015
    severity: P1
    spec: RFC 7009 §2.1
    behaviour: |
      Posting to the revocation endpoint without a token parameter
      returns 400 invalid_request "missing required parameter
      'token'".
    status: pending

  - id: REV-016
    severity: P0
    spec: RFC 7009 §2.2
    behaviour: |
      Submitting an arbitrary nonsense string as token returns 200
      with an empty body, never disclosing whether the value
      corresponded to any token.
    status: active

  - id: REV-017
    severity: P0
    spec: RFC 9068 §6 / RFC 7009 §2.2.1
    behaviour: |
      Submitting a structured JWT access token to the revocation
      endpoint is rejected with 400 unsupported_token_type
      "Structured JWT Tokens cannot be revoked via the
      revocation_endpoint".
    status: out-of-scope
    out_of_scope_reason: "v1.0 does NOT emit unsupported_token_type at /revoke. RFC 9068 §6 says JWT access tokens are revocable via the revocation endpoint, and v1.0 implements this by writing a JTI denylist row (ADR 0025 GrantTombstone). The panva 'JWT cannot be revoked, return 400 unsupported_token_type' shape is the opposite of what v1.0 does. Reconsider only if the OP is reconfigured to RevocationStrategyNone, in which case the current silent-200 path is still correct, never 400."

  - id: REV-018
    severity: P0
    spec: RFC 7009 §2.1
    behaviour: |
      A confidential client attempting to revoke another client's
      token receives 400 invalid_request "client is not authorized to
      revoke the presented token"; the token is not destroyed.
    status: out-of-scope
    out_of_scope_reason: "v1.0 silently returns 200 for cross-client revocation (both confidential and public clients), per RFC 7009 §2.2 'invalid tokens do not cause an error response'. The 400 invalid_request 'client is not authorized to revoke the presented token' shape leaks the failure mode through HTTP; v1.0 deliberately does not."

  - id: REV-019
    severity: P0
    spec: RFC 7009 §2.1
    behaviour: |
      A public client attempting to revoke another client's token
      silently receives 200 with an empty body; the token is not
      destroyed and no information about ownership leaks.
    status: active

  - id: REV-020
    severity: P0
    spec: RFC 6749 §2.3 / RFC 7009
    behaviour: |
      A client presenting an incorrect basic-auth secret at /revoke
      receives 401 invalid_client with WWW-Authenticate: Basic
      realm="oidc". (v1.0's /revoke does not currently emit a
      client-auth failure audit event; a token.revoke_failed event is
      reserved for non-NotFound store faults after successful auth.)
    status: active

  - id: REV-021
    severity: P0
    spec: RFC 7009 §2.2
    behaviour: |
      If the adapter returns an authorization-code record for the
      revocation lookup, the endpoint silently returns 200 without
      invoking destroy on the unrevocable kind.
    status: out-of-scope
    out_of_scope_reason: "v1.0's revokeOpaque branches consult OpaqueAccessTokenStore and RefreshTokenStore only; there is no 'auth code' substore at /revoke. The panva 'adapter returns auth-code record' shape is unobservable at v1.0's wire — an authorization code as a /revoke token simply collapses onto the silent-200 path REV-016 already covers."

  - id: REV-022
    severity: P2
    spec: implementation observability
    behaviour: |
      A successful access-token revocation registers both Client and
      AccessToken entities on the observability context.
    status: pending

  - id: REV-023
    severity: P2
    spec: implementation observability
    behaviour: |
      A successful refresh-token revocation registers Client and
      RefreshToken entities on the observability context.
    status: pending

  - id: REV-024
    severity: P2
    spec: implementation observability
    behaviour: |
      A successful client_credentials revocation registers Client and
      ClientCredentials entities on the observability context.
    status: pending
