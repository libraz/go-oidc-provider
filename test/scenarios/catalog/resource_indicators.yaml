# yaml-language-server: $schema=./schema.json
feature: resource_indicators
prefix: RI
title: Resource Indicators (RFC 8707)
specs:
  - RFC 8707 — Resource Indicators for OAuth 2.0
  - RFC 6749 §4.1 (authorization code), §4.4 (client credentials), §6 (refresh)
  - RFC 8628 — OAuth 2.0 Device Authorization Grant
  - RFC 9126 — OAuth 2.0 Pushed Authorization Requests
  - OpenID Connect CIBA Core 1.0 (urn:openid:params:grant-type:ciba)
  - OIDC Core 1.0 §5.3 (UserInfo)

description: |
  RFC 8707 resource parameter handling at /authorize, /token,
  /device/auth, and /backchannel. Covers the defaultResource and
  getResourceServerInfo policy hooks, URI shape validation, audience
  binding on issued access tokens, refresh-token resource preservation,
  multi-grant interactions (code, device, CIBA, client credentials),
  and UserInfo audience constraints.

rows:
  - id: RI-001
    severity: P1
    spec: RFC 8707 §2
    behaviour: |
      The OP MUST expose a defaultResource(ctx, client, oneOf) hook.
      The default implementation returns undefined; when the caller
      passes a fallback list, the hook returns that list verbatim.
    status: out-of-scope
    out_of_scope_reason: "v1.0 does not expose a defaultResource(ctx, client, oneOf) hook — the only resource-policy surface is the per-client store.Client.Resources allowlist (covered by RI-021 / RI-031 / RI-032 / RI-033 / RI-060 / RI-062 / RI-063). Adding the hook would expand the OP's public surface for a dynamism the allowlist already expresses declaratively. The library prefers narrow, declarative configuration over imperative hooks, which is the same rationale that puts the sibling getResourceServerInfo hook RI-002 out of scope."

  - id: RI-002
    severity: P0
    spec: RFC 8707 §2.2
    behaviour: |
      The OP MUST expose a getResourceServerInfo(ctx, resource,
      client) hook that fails closed: the default rejects with
      invalid_target ("resource indicator is missing, or unknown") so
      unconfigured resources are denied.
    status: out-of-scope
    out_of_scope_reason: Dynamic getResourceServerInfo(ctx, resource, client) hook is not exposed. The OP relies on the per-client store.Client.Resources []string allowlist (RI-010/011/030 cover that path). The library prefers narrow, declarative configuration over imperative hooks because a per-resource hook expands the attack surface (an embedder bug becomes a wrong audience) without adding capability the allowlist cannot already express.

  - id: RI-010
    severity: P0
    spec: RFC 8707 §2
    behaviour: |
      A resource value MUST be an absolute URI; bare strings yield
      400 invalid_target with the description "resource indicator
      must be an absolute URI".
    status: active

  - id: RI-011
    severity: P0
    spec: RFC 8707 §2
    behaviour: |
      A resource value MUST NOT contain a fragment component; for
      example "urn:wl:foo/bar#" yields 400 invalid_target with the
      description "resource indicator must not contain a fragment
      component".
    status: active

  - id: RI-012
    severity: P1
    spec: RFC 8707 §2
    behaviour: |
      When multiple resource values are supplied (for example via
      duplicate resource params), each value MUST be validated
      individually.
    status: out-of-scope
    out_of_scope_reason: "v1.0 parses /authorize 'resource' as single-valued (internal/authorize/request.go: singleParseFields → singleValue): differing duplicates yield ErrDuplicateParameter (invalid_request) before per-value validation, so there is no per-value path to test. The single-valued posture is intentional (and is the same pattern the /token client_credentials handler enforces)."

  - id: RI-020
    severity: P0
    spec: RFC 8707 §3
    behaviour: |
      An unknown resource at /authorize for a token-issuing
      response_type yields a fragment redirect carrying
      error=invalid_target,
      error_description="resource indicator is missing, or unknown",
      and the supplied state is preserved.
    status: out-of-scope
    out_of_scope_reason: "v1.0 only ships response_type=code (internal/authorize/request.go validateResponseType rejects every other value with ErrResponseTypeUnsupported). There is no token-issuing response_type, so the 'fragment redirect' wire shape this row asserts cannot be produced. The query-mode error redirect for code flow is already covered by RI-030."

  - id: RI-021
    severity: P0
    spec: RFC 8707 §3
    behaviour: |
      For an allowed resource, the issued access token's aud claim
      MUST equal the resource value.
    status: active

  - id: RI-022
    severity: P1
    spec: RFC 8707 §2
    behaviour: |
      When the client omits resource at /authorize and the
      defaultResource hook returns a value, the issued access token's
      aud MUST reflect that default.
    status: out-of-scope
    out_of_scope_reason: "v1.0 does not expose a defaultResource(ctx, client, oneOf) hook; the only resource-policy surface is the per-client store.Client.Resources allowlist. RI-002 (the sibling getResourceServerInfo hook row) is out-of-scope on the same grounds: the library prefers declarative configuration over imperative hooks."

  - id: RI-023
    severity: P0
    spec: RFC 8707 §3
    behaviour: |
      Resource validation MUST behave identically between
      GET /authorize and POST /authorize.
    status: active

  - id: RI-030
    severity: P0
    spec: RFC 8707 §3
    behaviour: |
      An unknown resource at /authorize?response_type=code yields a
      query-parameter redirect carrying invalid_target (no fragment
      because the code flow does not use fragments).
    status: active

  - id: RI-031
    severity: P0
    spec: RFC 8707 §3
    behaviour: |
      An allowed resource MUST be persisted on the authorization code
      as code.resource.
    status: active

  - id: RI-032
    severity: P0
    spec: RFC 8707 §3 / RFC 6749 §4.1.3
    behaviour: |
      Token exchange via grant_type=authorization_code MUST propagate
      code.resource to the issued access token's aud and to the
      issued refresh token's resource.
    status: active

  - id: RI-033
    severity: P0
    spec: RFC 6749 §6 + RFC 8707 §3
    behaviour: |
      Refreshing such a refresh token MUST yield a new access token
      with the same aud and a new refresh token preserving resource.
    status: active

  - id: RI-034
    severity: P1
    spec: RFC 8707 §2
    behaviour: |
      When the client omits resource at /authorize and
      defaultResource returns a value, the code, access token, and
      refresh token MUST all carry that default.
    status: out-of-scope
    out_of_scope_reason: "Depends on the defaultResource hook that is out of scope for v1.0 (see RI-022); without the hook there is no way for a request to pick up a default resource at /authorize, so the assertion 'code, AT, and RT all carry that default' has no v1.0 wire seam."

  - id: RI-035
    severity: P1
    spec: implementation policy
    behaviour: |
      A useGrantedResource hook MAY narrow or pin the resource at
      token-exchange time even when the request omits the resource
      parameter; the behaviour is driven by a per-call flag.
    status: out-of-scope
    out_of_scope_reason: "Same useGrantedResource hook absence as RI-053 / RI-054 (both OOS): v1.0 does not expose a useGrantedResource hook at the token-exchange boundary. The AT minter unconditionally embeds the validated resource as aud (internal/tokenendpoint/authcode.go: mintJWTAccessToken) and falls back to aud=Issuer when resource is empty; there is no per-call narrow/pin policy decision. The wire-observable resource binding through code → AT is bound by RI-031 / RI-032; the per-call narrowing semantic this row asserts has no v1.0 surface."

  - id: RI-036
    severity: P1
    spec: RFC 8707 §2
    behaviour: |
      Token exchange MAY include an explicit resource parameter; the
      resulting access token's aud MUST match it, subject to that
      resource having been included on the underlying grant.
    status: out-of-scope
    out_of_scope_reason: "v1.0 binds the access-token aud at /authorize time (resource flows through the authorization code: RI-031 → RI-032 → RI-033). The /token authorization_code grant does NOT accept an explicit resource parameter that overrides the code's bound resource — internal/tokenendpoint/authcode.go reads code.Resource and stamps it onto the AT directly. RFC 8707 §2 permits but does not require AS support for the resource parameter at token exchange; v1.0 chose the simpler one-shot binding model where resource is locked at authorize time. Embedders that need token-exchange-time resource selection wire RFC 8693 token exchange (custom grant) instead."

  - id: RI-040
    severity: P0
    spec: RFC 8628 §3.1 + RFC 8707 §3
    behaviour: |
      POST /device/auth with an unknown resource yields 400
      invalid_target with the description "resource indicator is
      missing, or unknown".
    cross_refs:
      - device_code#DEV-102
    status: out-of-scope
    out_of_scope_reason: "Duplicate: device_code#DEV-102 asserts this exact wire result — a /device_authorization request naming a resource outside the client's registered allowlist is rejected 400 invalid_target — and is active. The device authorization grant is shipped and routable (op.WithDeviceCodeGrant mounts /device_authorization, and the token dispatcher accepts urn:ietf:params:oauth:grant-type:device_code), so the exclusion is duplication, not absence."

  - id: RI-041
    severity: P0
    spec: RFC 8628 §3.4 + RFC 8707 §3
    behaviour: |
      After user approval, a token call with grant_type=
      urn:ietf:params:oauth:grant-type:device_code MUST emit an
      access token whose aud and a refresh token whose resource
      reflect the resource supplied at /device/auth.
    status: active

  - id: RI-042
    severity: P1
    spec: RFC 8628 + RFC 8707 §3
    behaviour: |
      The default-resource path applies to the device flow as well,
      and refresh MUST preserve the resource.
    cross_refs:
      - device_code#DEV-102
    status: out-of-scope
    out_of_scope_reason: "Two halves, one of which is genuinely absent: the OP exposes no defaultResource hook, the default-resource path this row extends has no configuration surface (see RI-001). The device flow itself is shipped, and the refresh half — a refresh exchange preserving the resource bound at authorization time — is asserted by RI-033 against the grant-agnostic refresh path. Revisit when a default-resource hook ships."

  - id: RI-043
    severity: P1
    spec: implementation policy
    behaviour: |
      useGrantedResource semantics MUST also apply to the device
      flow.
    status: out-of-scope
    out_of_scope_reason: "The OP exposes no useGrantedResource hook (see RI-035 / RI-053 / RI-054), so the semantic this row extends has no configuration surface on any grant. The device flow is shipped and is not the obstacle."

  - id: RI-044
    severity: P1
    spec: RFC 8707 §3
    behaviour: |
      An explicit resource parameter at token exchange MUST be
      allowed and granted on the device flow.
    status: out-of-scope
    out_of_scope_reason: "The OP does not accept an explicit resource parameter at token exchange on any grant: the resource is bound once at authorization time and read back from the code (see RI-036). The device flow is shipped and is not the obstacle; RFC 8707 §3 permits but does not require token-exchange-time resource selection."

  - id: RI-050
    severity: P0
    spec: OIDC CIBA §7.1 + RFC 8707 §3
    behaviour: |
      POST /backchannel with an unknown resource yields 400
      invalid_target.
    cross_refs:
      - ciba#CIBA-047
    status: out-of-scope
    out_of_scope_reason: "Duplicate: ciba#CIBA-047 asserts this exact wire result — a /bc-authorize request naming a resource outside the client's registered allowlist is rejected 400 invalid_target — and is active. CIBA is shipped and routable (/bc-authorize is mounted and the token dispatcher accepts urn:openid:params:grant-type:ciba), so the exclusion is duplication, not absence."

  - id: RI-051
    severity: P0
    spec: OIDC CIBA + RFC 8707 §3
    behaviour: |
      A grant_type=urn:openid:params:grant-type:ciba token call MUST
      yield an access token whose aud equals the resource the
      backchannel request registered, and a refresh token that retains
      that resource so a later exchange cannot widen the audience.
      Admitting the resource at /bc-authorize is the separate step
      ciba#CIBA-047 asserts.
    cross_refs:
      - ciba#CIBA-047
      - ciba#CIBA-049
    status: active
    covered_by: internal/tokenendpoint.TestHandleCIBA_AccessTokenBoundToRequestedResource
    notes: |
      Approving a backchannel request is not reachable from the public
      surface, so a wire-level test cannot get past
      authorization_pending to inspect the issued token. The assertion
      sits at the token endpoint, where an approved record can be
      seated directly — the same seam ciba#CIBA-049 uses for the same
      reason.

  - id: RI-052
    severity: P1
    spec: OIDC CIBA + RFC 8707 §3
    behaviour: |
      Refreshing the CIBA-issued refresh token MUST preserve the
      resource.
    cross_refs:
      - ciba#CIBA-047
    status: out-of-scope
    out_of_scope_reason: "Duplicate by mechanism: resource preservation across a refresh exchange is a property of the grant-agnostic refresh path, asserted by RI-033. CIBA is shipped and issues refresh tokens through that same path, so a CIBA-specific restatement adds no distinct wire surface."

  - id: RI-053
    severity: P1
    spec: RFC 8707 §3 (default + useGrantedResource=true)
    behaviour: |
      The default resource flows through CIBA; with
      useGrantedResource=true, the issued tokens MUST carry the
      default resource.
    status: out-of-scope
    out_of_scope_reason: "Neither hook this row composes exists: the OP exposes no defaultResource hook (RI-001) and no useGrantedResource hook (RI-035). CIBA is shipped and is not the obstacle."

  - id: RI-054
    severity: P0
    spec: RFC 8707 §3 (useGrantedResource=false)
    behaviour: |
      When useGrantedResource returns false, a token call without an
      explicit resource MUST yield an access token with aud
      undefined (UserInfo-eligible) while the refresh token retains
      resource for refresh exchanges.
    status: out-of-scope
    out_of_scope_reason: "The OP exposes no useGrantedResource hook, so the useGrantedResource=false branch this row asserts has no configuration surface; the access-token minter unconditionally stamps the validated resource as aud and falls back to aud=Issuer when none was bound, so an undefined aud is not a wire shape the OP produces. CIBA is shipped and is not the obstacle."

  - id: RI-060
    severity: P0
    spec: RFC 8707 §3
    behaviour: |
      grant_type=client_credentials with an explicit resource MUST
      yield an access token whose aud equals that resource.
    status: active

  - id: RI-061
    severity: P1
    spec: RFC 6749 §3.3
    behaviour: |
      Unsupported scopes are silently dropped from the issued token's
      scope; the supported subset is honoured.
    status: out-of-scope
    out_of_scope_reason: "v1.0 client_credentials does not silently drop unsupported scopes; it rejects with invalid_scope (clientcred.ErrScopeForbidden in internal/grants/clientcred/clientcred.go: 'requested scope is not permitted for client'). The strict-rejection posture is documented on ErrScopeForbidden's godoc as a deliberate library posture vs the §3.3 'MAY narrow' permission. The silent-drop behaviour this row asserts is vendor-specific; rebinding it would require adopting a posture where a client silently receives less than it asked for, which the library declines."

  - id: RI-062
    severity: P0
    spec: RFC 8707 §3
    behaviour: |
      An unrecognised resource at the client_credentials grant MUST
      yield 400 invalid_target.
    status: active

  - id: RI-063
    severity: P0
    spec: RFC 8707 §3
    behaviour: |
      Multiple resource parameters on a client_credentials request
      MUST yield 400 invalid_target with the description "only a
      single resource indicator value is supported".
    status: active

  - id: RI-064
    severity: P0
    spec: RFC 8707 §3
    behaviour: |
      Each resource value MUST be validated for URI shape
      individually; one valid value combined with one malformed value
      MUST still be rejected.
    status: out-of-scope
    out_of_scope_reason: "v1.0 client_credentials accepts at most one resource value per request (internal/tokenendpoint/clientcred.go: parseClientCredsRequest). When two differing values are presented the handler short-circuits with invalid_target/'only a single resource indicator value is supported' BEFORE any URI-shape validation runs, so there is no per-value URI-shape check to assert. The single-value posture is documented on parseClientCredsRequest's godoc and is the same posture the /authorize side enforces via singleValue. RI-063 covers the differing-duplicate path."

  - id: RI-065
    severity: P1
    spec: RFC 8707 §3
    behaviour: |
      The defaultResource hook applies to client_credentials when the
      client omits resource.
    status: out-of-scope
    out_of_scope_reason: Depends on the defaultResource hook that is out of scope for v1.0 (see RI-001 OOS); without the hook the client_credentials path has no fallback that could pick up a default when resource is omitted. The only resource-policy surface is the per-client store.Client.Resources allowlist (covered by RI-060 / RI-062 / RI-063).

  - id: RI-066
    severity: P1
    spec: implementation
    behaviour: |
      The OP MAY support both opaque and JWT access token formats per
      resource (e.g. via a resource-scoped policy decision); both
      paths MUST accept a single resource parameter.
    status: out-of-scope
    out_of_scope_reason: "v1.0 does not expose a per-resource access-token format policy hook. The token format choice (opaque vs JWT) is global (op.WithAccessTokenFormat); there is no resource-scoped 'this resource gets opaque, that one gets JWT' policy decision at the /token boundary. Adding such a hook would need a new public option and a per-resource policy callback shape the library does not define. Embedders that need resource-scoped formats run a downstream gateway that re-projects opaque tokens to JWT (or vice versa) per the resource server's expectation."

  - id: RI-070
    severity: P1
    spec: OIDC Core §5.3
    behaviour: |
      Audience-less access tokens (aud=undefined) MUST be accepted at
      /userinfo.
    status: out-of-scope
    out_of_scope_reason: "v1.0 cannot mint an audience-less access token: the AT minter unconditionally embeds the validated resource as aud and falls back to aud=Issuer when resource is empty (internal/tokenendpoint/authcode.go: mintJWTAccessToken; documented under RI-054 OOS). There is no v1.0 wire shape that produces aud=undefined, so the assertion 'audience-less ATs MUST be accepted at /userinfo' has no input that the OP can produce. The /userinfo audience policy v1.0 does enforce (aud-contains-issuer, with explicit rejection of resource-bound tokens) is bound by RI-071."

  - id: RI-071
    severity: P0
    spec: OIDC Core §5.3 + RFC 8707 §3
    behaviour: |
      An access token whose aud is set to a resource URI (rather than
      the OP's UserInfo URL) MUST be rejected at /userinfo with 401
      invalid_token, the description "invalid token provided", and an
      error_detail of "token audience prevents accessing the userinfo
      endpoint".
    status: active

  - id: RI-072
    severity: P0
    spec: input validation
    behaviour: |
      Non-string aud values (object, false, number) MUST also fail at
      /userinfo with the same error envelope; this defends against
      storage tampering.
    status: out-of-scope
    out_of_scope_reason: "RI-071 covers aud-contains-issuer enforcement at /userinfo (internal/userinfo/handler.go enforceAudience). The 'non-string aud values (object, false, number)' axis this row layers on top is structurally unreachable on the v1.0 wire: store-side records are typed (store.OpaqueAccessToken.Audience is string; tokens.AccessTokenClaims.Audience is []string) and the JWT decoder (internal/tokens/verify.go decodeAudience) only accepts string and []string per RFC 7519 §4.1.3. A wire-level 'non-string aud' submission already fails at access-token decode with ErrAccessTokenMalformed before any audience policy runs. The defence-in-depth this row asks for has no production code path that could regress without first introducing a typed-bypass bug in the substore, which the contract harness catches at the Save/Find boundary."
