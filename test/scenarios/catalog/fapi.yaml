# yaml-language-server: $schema=./schema.json
feature: fapi
prefix: FAPI
title: Financial-grade API Security Profile (FAPI 1.0 / 2.0)
specs:
  - FAPI 1.0 Part 2 (Advanced) — Final
  - FAPI 2.0 Security Profile — Final
  - FAPI 2.0 Message Signing
  - RFC 9101 — JAR / Request Object
  - RFC 9126 — PAR
  - RFC 6749 §3.2.1, §10
  - RFC 9700 — OAuth 2.0 Security Best Current Practice
  - RFC 8707 — Resource Indicators
  - OIDC Core 1.0 §3.2 (hybrid), §15.5 (sender-constrained tokens)

description: |
  Financial-grade API Security Profile obligations the OP must satisfy
  when an embedder enables FAPI mode for a client. Covers FAPI 1.0
  Final (hybrid / signed front-channel) and FAPI 2.0 Final (PKCE,
  private_key_jwt audience, redirect_uri policy, Request Object claim
  windows) plus the cross-cutting policy enforcement guarantee. Sub-
  prefix V1 covers FAPI 1.0 rows, V2 covers FAPI 2.0 rows; rows
  without a sub-prefix apply to both profiles.

rows:
  - id: FAPI-001
    severity: P0
    spec: FAPI 2.0 §5.3 / FAPI 1.0 Part 2 §5.2.2
    behaviour: |
      UserInfo MUST reject access tokens delivered via the access_token
      query parameter, returning 400 invalid_request with
      "access tokens must not be provided via query parameter".
      Authorization header (Bearer) and form-encoded access_token body
      remain valid.
    status: out-of-scope
    out_of_scope_reason: "non-spec residue: catalog asserts a 400 invalid_request envelope with the upstream-style description 'access tokens must not be provided via query parameter'; v1.0 instead follows RFC 9700 §2.4 by silently dropping URL query credentials at /userinfo (internal/userinfo/handler.go extractBearer never consults r.URL.Query()), so an ?access_token=X request resolves to the bare 'missing access token' 401 challenge with no leaked detail. The defensive posture is the stronger one — the query channel is unreachable rather than rejected — but it does not produce the catalog's specific 400 envelope."

  - id: FAPI-002
    severity: P1
    spec: FAPI 1/2 (Authorization Request)
    behaviour: |
      The authorization endpoint MUST reject FAPI requests whose
      response_mode does not match the FAPI profile's allowed set for
      that response_type.
    status: out-of-scope
    out_of_scope_reason: "non-spec residue: catalog asserts a FAPI-conditional response_mode allow-list whose violation surfaces as invalid_request; v1.0 has no per-profile response_mode allow-list (internal/authorize/validation.go validateResponseMode admits the same closed set {'', query, form_post, query.jwt, fragment.jwt, form_post.jwt, jwt} regardless of WithProfile). Unknown values still collapse onto unsupported_response_mode (RMO-001 binds that path), but the FAPI-only allow-list narrowing the catalog implies is not implemented."

  - id: FAPI-V1-010
    severity: P1
    spec: FAPI 1 Part 2 §5.2.2
    behaviour: |
      The plain authorization endpoint (no PAR) accepts
      response_type=code id_token without PKCE; PKCE is NOT mandatory
      at /authorize when an ID Token is co-issued (detached signature
      path).
    status: out-of-scope
    out_of_scope_reason: "FAPI 1.0 Final (hybrid / signed front-channel) is intentionally not shipped as a profile. docs/plans/002-product-design.md line 2146 records: \"Hybrid flow ... OAuth 2.1 / FAPI 2.0 が code-only に統一.\" The OP advertises ProfileFAPI2Baseline and ProfileFAPI2MessageSigning only (line 2333-2334); FAPI 1.0 advanced requirements are subsumed into FAPI 2.0 Message Signing."

  - id: FAPI-V1-011
    severity: P0
    spec: FAPI 1 Part 2 §5.2.2-15
    behaviour: |
      When PAR is used, PKCE (code_challenge with method S256) is
      mandatory; missing code_challenge MUST yield 400 invalid_request
      with description "Authorization Server policy requires PKCE to
      be used for this request".
    status: out-of-scope
    out_of_scope_reason: "FAPI 1.0 Final (hybrid / signed front-channel) is intentionally not shipped as a profile. docs/plans/002-product-design.md line 2146 records: \"Hybrid flow ... OAuth 2.1 / FAPI 2.0 が code-only に統一.\" The OP advertises ProfileFAPI2Baseline and ProfileFAPI2MessageSigning only (line 2333-2334); FAPI 1.0 advanced requirements are subsumed into FAPI 2.0 Message Signing."

  - id: FAPI-V1-012
    severity: P0
    spec: FAPI 1 Part 2 §5.2.2-2
    behaviour: |
      If response_type does NOT cause an id_token to be issued from
      the authorization endpoint (for example response_type=code
      alone), response_mode=jwt (JARM) MUST be required; otherwise
      the OP returns invalid_request with description "requested
      response_mode is not allowed for this client or request".
    status: out-of-scope
    out_of_scope_reason: "FAPI 1.0 Final (hybrid / signed front-channel) is intentionally not shipped as a profile. docs/plans/002-product-design.md line 2146 records: \"Hybrid flow ... OAuth 2.1 / FAPI 2.0 が code-only に統一.\" The OP advertises ProfileFAPI2Baseline and ProfileFAPI2MessageSigning only (line 2333-2334); FAPI 1.0 advanced requirements are subsumed into FAPI 2.0 Message Signing."

  - id: FAPI-V1-013
    severity: P0
    spec: FAPI 1 Part 2 §5.2.2-2 (JAR)
    behaviour: |
      The same response_mode=jwt requirement applies when the
      authorization request is sent as a signed Request Object (JAR).
    status: out-of-scope
    out_of_scope_reason: "FAPI 1.0 Final (hybrid / signed front-channel) is intentionally not shipped as a profile. docs/plans/002-product-design.md line 2146 records: \"Hybrid flow ... OAuth 2.1 / FAPI 2.0 が code-only に統一.\" The OP advertises ProfileFAPI2Baseline and ProfileFAPI2MessageSigning only (line 2333-2334); FAPI 1.0 advanced requirements are subsumed into FAPI 2.0 Message Signing."

  - id: FAPI-V1-014
    severity: P0
    spec: RFC 9101 §6.1 + FAPI 1 Part 2 §5.2.2
    behaviour: |
      The Request Object MUST contain exp; missing exp triggers a
      fragment redirect with error=invalid_request_object and
      error_description="Request Object is missing the 'exp' claim".
    status: out-of-scope
    out_of_scope_reason: "FAPI 1.0 Final (hybrid / signed front-channel) is intentionally not shipped as a profile. docs/plans/002-product-design.md line 2146 records: \"Hybrid flow ... OAuth 2.1 / FAPI 2.0 が code-only に統一.\" The OP advertises ProfileFAPI2Baseline and ProfileFAPI2MessageSigning only (line 2333-2334); FAPI 1.0 advanced requirements are subsumed into FAPI 2.0 Message Signing."

  - id: FAPI-V1-015
    severity: P0
    spec: FAPI 1 Part 2 §5.2.2-13
    behaviour: |
      The Request Object MUST contain nbf; missing nbf yields
      invalid_request_object with description "Request Object is
      missing the 'nbf' claim".
    status: out-of-scope
    out_of_scope_reason: "FAPI 1.0 Final (hybrid / signed front-channel) is intentionally not shipped as a profile. docs/plans/002-product-design.md line 2146 records: \"Hybrid flow ... OAuth 2.1 / FAPI 2.0 が code-only に統一.\" The OP advertises ProfileFAPI2Baseline and ProfileFAPI2MessageSigning only (line 2333-2334); FAPI 1.0 advanced requirements are subsumed into FAPI 2.0 Message Signing."

  - id: FAPI-V1-016
    severity: P0
    spec: FAPI 1 Part 2 §5.2.2-13
    behaviour: |
      Request Object exp - nbf MUST be at most 3600 seconds; otherwise
      invalid_request_object with description "Request Object 'exp'
      claim too far from 'nbf' claim".
    status: out-of-scope
    out_of_scope_reason: "FAPI 1.0 Final (hybrid / signed front-channel) is intentionally not shipped as a profile. docs/plans/002-product-design.md line 2146 records: \"Hybrid flow ... OAuth 2.1 / FAPI 2.0 が code-only に統一.\" The OP advertises ProfileFAPI2Baseline and ProfileFAPI2MessageSigning only (line 2333-2334); FAPI 1.0 advanced requirements are subsumed into FAPI 2.0 Message Signing."

  - id: FAPI-V1-017
    severity: P1
    spec: OIDC Core §3.3
    behaviour: |
      A valid signed Request Object on the hybrid flow MUST still
      produce id_token, code and state in the fragment for
      response_type=code id_token.
    status: out-of-scope
    out_of_scope_reason: "FAPI 1.0 Final (hybrid / signed front-channel) is intentionally not shipped as a profile. docs/plans/002-product-design.md line 2146 records: \"Hybrid flow ... OAuth 2.1 / FAPI 2.0 が code-only に統一.\" The OP advertises ProfileFAPI2Baseline and ProfileFAPI2MessageSigning only (line 2333-2334); FAPI 1.0 advanced requirements are subsumed into FAPI 2.0 Message Signing."

  - id: FAPI-V2-020
    severity: P0
    spec: FAPI 2.0 §5.3.2.1
    behaviour: |
      response_type=code requires PKCE on the authorization endpoint
      regardless of PAR; missing code_challenge yields a redirect with
      error=invalid_request and
      error_description="Authorization Server policy requires PKCE to
      be used for this request".
    status: active

  - id: FAPI-V2-021
    severity: P0
    spec: FAPI 2.0 §5.3.2.2 + RFC 7523 §3
    behaviour: |
      A private_key_jwt client assertion's aud MUST equal the issuer
      identifier URL (NOT the token or PAR endpoint URL); a mismatch
      yields 401 invalid_client with error_detail
      "audience (aud) must equal the issuer identifier url".
    status: out-of-scope
    out_of_scope_reason: "non-spec residue (divergent posture): catalog asserts a strict aud == issuer rule for private_key_jwt at FAPI 2.0; v1.0 instead accepts both the issuer URL AND the absolute token / PAR endpoint URL as valid aud values via clientauth.PrivateKeyJWTVerifier.AuxAudiences (op/op_builders.go buildAssertionVerifier). The dual posture lets a single OP serve OIDC Core (aud == token endpoint URL per OIDC Core §9) and FAPI 2.0 (aud == issuer per §5.2.2) clients without forcing a per-profile verifier swap; the OFCS PAR audience module that uses aud == PAR endpoint also relies on this. A spec-strict embedder who wants the narrower posture swaps the verifier through the public store seam."

  - id: FAPI-V2-022
    severity: P0
    spec: FAPI 2.0 §5.3.1.2
    behaviour: |
      redirect_uri is REQUIRED in FAPI 2.0 even when only one is
      registered. The allowOmittingSingleRegisteredRedirectUri knob
      MUST be ignored under FAPI 2; missing redirect_uri yields a
      rendered (not redirected) 400 invalid_request with description
      "missing required parameter 'redirect_uri'".
    status: active

  - id: FAPI-V2-023
    severity: P0
    spec: RFC 9101 §6.1 / FAPI 2.0 §5.3.2.1
    behaviour: |
      A Request Object on FAPI 2 MUST carry both exp and nbf; missing
      either yields the same invalid_request_object envelope as
      FAPI 1.
    status: active

  - id: FAPI-V2-024
    severity: P0
    spec: FAPI 2.0 §5.3.2.1 / FAPI 2.0 Message Signing §5.6
    behaviour: |
      A Request Object's lifetime is bounded by 60 seconds (Message
      Signing §5.6 / OFCS conformance ensure-request-object-with-exp-
      over-60-fails / -nbf-over-60-fails); exp more than 60 seconds
      past now or nbf more than 60 seconds before now yields
      invalid_request_object.
    status: active

  - id: FAPI-V2-025
    severity: P1
    spec: FAPI 2.0 §5.3.1
    behaviour: |
      A valid FAPI 2 Request Object with code plus PKCE produces code
      (and state if the RP sent one) in the redirect query — NOT in
      the fragment, NOT JARM by default.
    status: active

  - id: FAPI-030
    severity: P0
    spec: FAPI 1/2 + RFC 9700
    behaviour: |
      When FAPI is enabled for a client, all the above MUST be
      enforced as authorization-server policy regardless of client
      metadata; the OP error rendering MUST emit iss per RFC 9207
      even on policy rejections.
    status: out-of-scope
    out_of_scope_reason: "non-spec residue: catalog asserts the OP MUST emit RFC 9207 iss on every policy rejection, including the rendered (no trusted redirect target) error envelope. RFC 9207 §2.4 itself only mandates iss on responses sent to the redirect_uri; rendered errors carry no redirect target by definition, so v1.0's wire shape (iss on redirect-channel errors via internal/authorizeendpoint/error.go buildRedirectError; no iss on rendered JSON envelopes) matches the spec's actual scope. The 'enforced regardless of client metadata' half is exercised by every other FAPI-V2 binding in this file: every FAPI-active rejection in v1.0 fires from the op-level wiring, not from per-client knobs (the registered client has no PKCE / redirect_uri / nbf required flags, yet the rejections still fire)."

  - id: FAPI-031
    severity: P1
    spec: FAPI 1 Part 2 §5.2.2
    behaviour: |
      Detached-signature path: with response_type=code id_token, the
      id_token carries s_hash (state hash) AND c_hash, as implied by
      the response_mode policy decision tree.
    status: out-of-scope
    out_of_scope_reason: "non-spec residue: catalog asserts the detached-signature path (response_type=code id_token, hybrid flow) carries s_hash and c_hash on the front-channel id_token. v1.0 advertises only response_type=code (docs/plans/002-product-design.md OAuth 2.1 / FAPI 2.0 code-only stance); hybrid is intentionally not shipped. With no hybrid surface there is no front-channel id_token, so the s_hash / c_hash claims have no emission path to assert. Mirrors the blanket OOS already applied to the FAPI-V1-010..017 hybrid rows in this file."
