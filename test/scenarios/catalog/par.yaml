# yaml-language-server: $schema=./schema.json
feature: par
prefix: PAR
title: PAR — Pushed Authorization Requests
specs:
  - RFC 9126 — OAuth 2.0 Pushed Authorization Requests
  - RFC 9101 — JWT-Secured Authorization Request (JAR)
  - OpenID Connect Core 1.0 §3.1.2 (Authorization Endpoint, redirect_uri rules)
  - OpenID Connect Discovery 1.0 §3 (pushed_authorization_request_endpoint,
    require_pushed_authorization_requests, request_uri_parameter_supported,
    request_object_signing_alg_values_supported)

description: |
  Pushed Authorization Requests at /request, including discovery
  surface, redirect_uri validation (registered, unregistered,
  malformed, fragmenting), single-use request_uri lifecycle, plain
  push and JAR-signed push, request_uri rejection at PAR, error
  remapping, JAR exp clamping, and integration with adapters that may
  fail. The request_uri prefix is RFC 9126 §2.2's
  urn:ietf:params:oauth:request_uri:.

rows:
  - id: PAR-001
    severity: P1
    spec: RFC 9126 §5
    behaviour: |
      When PAR is enabled without JAR, discovery exposes
      pushed_authorization_request_endpoint with
      request_uri_parameter_supported=false and does NOT advertise
      request_object_signing_alg_values_supported or
      require_pushed_authorization_requests.
    status: pending

  - id: PAR-002
    severity: P1
    spec: RFC 9126 §5
    behaviour: |
      When requirePushedAuthorizationRequests is toggled on globally,
      discovery advertises require_pushed_authorization_requests=true.
    status: pending

  - id: PAR-003
    severity: P1
    spec: RFC 9126 §5 / RFC 9101 §10.5
    behaviour: |
      When both PAR and JAR are enabled, discovery advertises a
      non-empty request_object_signing_alg_values_supported,
      request_parameter_supported=true and
      request_uri_parameter_supported=false.
    status: pending

  - id: PAR-004
    severity: P1
    spec: RFC 9126 §2.4 / OAuth 2.1 §3.1.2
    behaviour: |
      When the OP allows unregistered redirect_uris via PAR for
      confidential clients, the pushed redirect_uri is persisted with
      the request_uri and honoured by the subsequent /authorize and
      /token calls.
    status: pending

  - id: PAR-005
    severity: P0
    spec: RFC 9126 §2.4
    behaviour: |
      A public client whose /par push carries a redirect_uri that is
      not on its registered list is rejected with 400 invalid_request.
      v1.0 does not ship the RFC 9126 §2.4 ad-hoc redirect_uri opt-in,
      so every client (public or confidential) must use a pre-
      registered URI.
    status: active

  - id: PAR-006
    severity: P0
    spec: RFC 6749 §3.1.2 / OIDC Core §3.1.2.1
    behaviour: |
      A push with a malformed redirect_uri (not parseable as an
      absolute URI) is rejected with 400 invalid_request. v1.0
      enforces redirect_uri via byte-equal match against the
      registered list, so a malformed value cannot match any
      registered URI and the validator surfaces invalid_request.
    status: active

  - id: PAR-007
    severity: P0
    spec: RFC 6749 §3.1.2
    behaviour: |
      A push with a redirect_uri carrying a fragment is rejected with
      400 invalid_request. RFC 6749 §3.1.2 forbids fragments in
      redirect_uri; v1.0 enforces this implicitly via exact-match
      against the registered list (a registered URI never carries a
      fragment, so the variant is unmatched).
    status: active

  - id: PAR-008
    severity: P1
    spec: RFC 9126 §3 / RFC 9101 §6.2
    behaviour: |
      In PAR-only mode (JAR disabled), a push that includes a request
      parameter is rejected with 400 request_not_supported.
    status: pending

  - id: PAR-009
    severity: P2
    spec: RFC 9126 §2.1
    behaviour: |
      A successful PAR submission exposes Client and
      PushedAuthorizationRequest entities on the OP request context
      for downstream observers.
    status: pending

  - id: PAR-010
    severity: P0
    spec: RFC 9126 §2.2
    behaviour: |
      A plain-form push returns 201 Created with body
      {request_uri, expires_in}; the request_uri matches the RFC 9126
      §2.2 URN prefix urn:ietf:params:oauth:request_uri:; expires_in
      is a positive integer; the persisted record carries the
      authenticated client_id and a non-empty RawParams snapshot. The
      v1.0 storage shape is a JSON RequestSnapshot, not an alg=none
      JWT envelope.
    status: active

  - id: PAR-011
    severity: P0
    spec: RFC 9126 §3
    behaviour: |
      The PAR endpoint MUST NOT accept a request_uri parameter; such
      submissions are rejected with 400 invalid_request. (RFC 9101
      §6.2 reserves request_uri_not_supported for the OP advertising
      it does not honour the JAR-style request_uri at /authorize, NOT
      for the PAR-side rejection.)
    status: active

  - id: PAR-012
    severity: P1
    spec: RFC 9126 §2.3
    behaviour: |
      A push with a redirect_uri unknown to the client registration
      is rejected with 400 invalid_request (originally
      invalid_redirect_uri); the error MUST be remapped to
      invalid_request per PAR.
    status: pending

  - id: PAR-013
    severity: P1
    spec: RFC 9126 §2.3 / RFC 6749 §5.2
    behaviour: |
      When the storage adapter throws a non-OIDC error during upsert,
      the response is 500 server_error ("oops! something went
      wrong"); non-OIDC errors MUST NOT leak verbatim to the client.
    status: pending

  - id: PAR-014
    severity: P0
    spec: RFC 9126 §2.2
    behaviour: |
      After a plain push, exchanging the returned request_uri at
      /authorize succeeds (303 with code) and the persisted PAR is
      marked consumed (single-use).
    status: active

  - id: PAR-015
    severity: P1
    spec: RFC 9126 §2.2 / RFC 9101 §6.2
    behaviour: |
      A client with request_object_signing_alg registered may push
      plain params (no JAR) and then exchange the returned
      request_uri at /authorize; the PAR is consumed exactly once.
    status: pending

  - id: PAR-016
    severity: P2
    spec: RFC 9126 §2.1 / RFC 9101 §6.1
    behaviour: |
      A successful PAR submission carrying a signed Request Object
      exposes Client and PushedAuthorizationRequest entities on the
      OP request context.
    status: pending

  - id: PAR-017
    severity: P0
    spec: RFC 9126 §2.1 / RFC 9101 §6.1
    behaviour: |
      A push carrying a signed Request Object (under an asymmetric
      alg the OP allow-list admits — ES256 / PS256 / RS256 / EdDSA;
      v1.0 rejects HMAC algs at JOSE parse time) returns 201 with
      {request_uri, expires_in}. The catalog uses ES256 as the
      canonical FAPI 2.0 Message Signing alg.
    status: active

  - id: PAR-018
    severity: P1
    spec: RFC 9126 §2.2
    behaviour: |
      A signed Request Object without an exp claim is stored with
      expires_in clamped to the provider MAX_TTL (e.g. 60).
    status: pending

  - id: PAR-019
    severity: P1
    spec: RFC 9126 §2.2
    behaviour: |
      A signed Request Object with exp shorter than MAX_TTL has
      expires_in reflect the JWT exp.
    status: pending

  - id: PAR-020
    severity: P1
    spec: RFC 9126 §2.2
    behaviour: |
      A signed Request Object with exp longer than MAX_TTL has
      expires_in clamped to MAX_TTL (e.g. 60).
    status: pending

  - id: PAR-021
    severity: P0
    spec: RFC 9126 §2.1 / RFC 9101 §6.1
    behaviour: |
      RFC 9101 §6.1 precedence rule: when a push pairs outer form
      parameters with a signed Request Object, every authorization
      parameter inside the JWT overrides the wire-form value of the
      same name. Wire values whose key is absent from the JWT
      survive — the merge does NOT erase them. The persisted
      RequestSnapshot reflects this rule (e.g. JWT response_type=code
      defeats outer response_type=code+token; outer nonce survives
      when the JWT omits a nonce claim).
    status: active

  - id: PAR-022
    severity: P0
    spec: RFC 9101 §6.1
    behaviour: |
      When a client has a pre-registered request_object_signing_alg
      (e.g. ES256) and pushes a Request Object signed with a
      different asymmetric alg the OP otherwise admits (e.g. PS256),
      the push is rejected with 400 invalid_request_object. The
      catalog uses asymmetric algs because v1.0's JOSE allow-list
      refuses HMAC entirely (HS256/HS384 fail at parse time, not at
      the alg-pin gate).
    status: active

  - id: PAR-023
    severity: P0
    spec: RFC 9126 §2.1 / RFC 9101 §6.1
    behaviour: |
      A signed Request Object whose embedded "client_id" claim
      disagrees with the authenticated client_id is rejected with
      400 invalid_request. v1.0 surfaces this as invalid_request
      (NOT invalid_request_object) because the JAR merger emits
      ErrClientIDMismatch and the parendpoint translates that to
      the wire/JWT consistency code rather than a request-object-
      format failure.
    status: active

  - id: PAR-024
    severity: P1
    spec: RFC 9126 §2.3
    behaviour: |
      A signed Request Object pushed with an unregistered
      redirect_uri is rejected with 400 invalid_request (remapped
      from invalid_redirect_uri).
    status: pending

  - id: PAR-025
    severity: P1
    spec: RFC 9126 §2.3
    behaviour: |
      When the storage adapter throws a non-OIDC error during a
      signed PAR upsert, the response is 500 server_error.
    status: pending

  - id: PAR-026
    severity: P0
    spec: RFC 9126 §2.2
    behaviour: |
      After a signed Request Object push, exchanging the returned
      request_uri at /authorize succeeds (303 with code) and the PAR
      is marked consumed.
    status: active

  - id: PAR-027
    severity: P0
    spec: RFC 9126 §2.2 / RFC 9101 §6.2
    behaviour: |
      An /authorize call with an unknown request_uri (never issued,
      or already GC'd after expiry) is rejected with 400
      invalid_request_uri. The "consumed" branch is exercised by
      PAR-014 / PAR-026; expired is equivalent on the wire (the
      substore Find returns ErrNotFound once GC'd). State is NOT
      echoed: PAR-resolution failures render a pre-redirect-trust
      browser error with no state preserved, because the
      request_uri parameter is the only client_id-bound witness on
      /authorize.
    status: active
