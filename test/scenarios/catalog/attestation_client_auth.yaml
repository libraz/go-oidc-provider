# yaml-language-server: $schema=./schema.json
feature: attestation_client_auth
prefix: ATB
title: OAuth 2.0 Attestation-Based Client Authentication
specs:
  - draft-ietf-oauth-attestation-based-client-auth — OAuth 2.0 Attestation-Based Client Authentication
  - RFC 9126 — Pushed Authorization Requests
  - RFC 8628 — Device Authorization Grant
  - OpenID CIBA Core 1.0
  - RFC 7662 — OAuth 2.0 Token Introspection
  - RFC 7009 — OAuth 2.0 Token Revocation

description: |
  Attestation-Based Client Authentication via the
  OAuth-Client-Attestation and OAuth-Client-Attestation-PoP headers.
  Covers attestation envelope validation (typ/alg/iss/sub/exp/cnf),
  PoP envelope validation (typ/alg/iss/aud/jti/key/challenge),
  refresh-token binding to attestation jkt across grants, instance
  match/mismatch enforcement, introspection and revocation behaviour
  with binding instances, and integration with PAR, device
  authorization and CIBA flows.

rows:
  - id: ATB-001
    severity: P0
    spec: draft §4 / §5
    behaviour: |
      A request to a binding-eligible endpoint without both
      OAuth-Client-Attestation and OAuth-Client-Attestation-PoP
      headers is rejected with an attestation-related error
      (invalid_client / invalid_request) per draft §4.
    status: out-of-scope
    out_of_scope_reason: |
      Attestation-based client authentication
      (draft-ietf-oauth-attestation-based-client-auth) is intentionally
      not implemented in v1.0. The spec is an IETF draft, has no entry
      in docs/plans/002-product-design.md, and duplicates the threat
      model already covered by private_key_jwt for the in-scope use
      cases. Revisit when the draft is promoted to RFC and embedder
      demand surfaces.

