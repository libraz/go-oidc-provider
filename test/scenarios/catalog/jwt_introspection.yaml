# yaml-language-server: $schema=./schema.json
feature: jwt_introspection
prefix: JINT
title: JWT response for token introspection
specs:
  - RFC 9701 — JWT Response for OAuth 2.0 Token Introspection
  - RFC 7662 — OAuth 2.0 Token Introspection (prerequisite)
  - RFC 7515 / 7516 / 7518 — JWS / JWE / JWA
  - RFC 8414 §2 — `introspection_signing_alg_values_supported`
  - OIDC Core 1.0 §10 — client-registered signing / encryption keys

description: |
  RFC 9701 layered on top of the standard introspection endpoint:
  discovery metadata, content-type negotiation, signed (JWS) and
  encrypted (JWE / nested) responses, HMAC client-secret expiry, and
  the active=false JWT shape.

rows:
  - id: JINT-001
    severity: P2
    spec: RFC 8414 §2
    behaviour: |
      With JWT introspection enabled, the discovery document
      advertises introspection_signing_alg_values_supported.
    status: out-of-scope
    out_of_scope_reason: Covered by INT-001; introspection_signing_alg_values_supported ships unconditionally when introspection is mounted, no separate JWT toggle exists.

  - id: JINT-002
    severity: P1
    spec: RFC 9701 §1
    behaviour: |
      Enabling jwtIntrospection without the base introspection feature
      fails provider construction with "jwtIntrospection is only
      available in conjuction with introspection".
    status: out-of-scope
    out_of_scope_reason: No separate jwtIntrospection toggle exists; RFC 9701 JWS responses are unconditional behaviour of the introspection endpoint (see INT-001). The construction-time coupling error has no caller.

  - id: JINT-003
    severity: P1
    spec: RFC 7662 §2.2
    behaviour: |
      A client registered for JWT introspection that issues an
      introspection request without an Accept header still receives
      a normal application/json response.
    status: active

  - id: JINT-004
    severity: P0
    spec: RFC 9701 §4
    behaviour: |
      The same client repeating the request with
      Accept: application/token-introspection+jwt receives a JWT body
      with content-type application/token-introspection+jwt.
    status: active

  - id: JINT-005
    severity: P0
    spec: RFC 9701 §5
    behaviour: |
      The signed JWT response carries iss=provider issuer,
      aud=client_id, iat, and a token_introspection claim that nests
      the original introspection JSON document.
    status: active

  - id: JINT-006
    severity: P0
    spec: RFC 9701 §5
    behaviour: |
      The signed JWT response sets header typ=token-introspection+jwt.
    status: active

  - id: JINT-007
    severity: P1
    spec: RFC 9701 §5
    behaviour: |
      Repeating the introspection after time advances produces a JWT
      whose iat claim has progressed by the elapsed seconds relative
      to the earlier JSON response.
    status: active

  - id: JINT-008
    severity: P0
    spec: RFC 9701 §5
    behaviour: |
      Submitting an invalid token with Accept:
      application/token-introspection+jwt still returns 200 plus a
      JWT whose token_introspection claim is {"active": false} and
      whose iss, aud, and iat envelope claims are populated.
    status: active

  - id: JINT-009
    severity: P0
    spec: RFC 9701 §6 / OIDC Core §10
    behaviour: |
      A client pinned to an HMAC signing alg whose client_secret has
      expired receives 400 invalid_client "client secret is expired -
      cannot respond with HS256 JWT Introspection response" delivered
      as JSON.
    status: out-of-scope
    out_of_scope_reason: client_secret_jwt and HS* token-endpoint-auth signing algs are both non-goals — a shared signing secret forges assertions in either direction, and the OP signs with ES256 alone (see client_auth#CA-DISC-04). The OP advertises no HS* in token_endpoint_auth_signing_alg_values_supported and registration cannot pin a client to an HMAC introspection-response alg, so the expired-secret rejection path has no caller.

  - id: JINT-010
    severity: P0
    spec: RFC 9701 §4
    behaviour: |
      A client that mandates encrypted introspection responses but
      requests without the JWT Accept header receives 400
      invalid_request "introspection must be requested with Accept:
      application/token-introspection+jwt for this client".
    status: out-of-scope
    out_of_scope_reason: "JWE / encrypted response types are out-of-scope in v1.0 (see test/scenarios/catalog/encryption.yaml). Without JWE the 'encrypted introspection mandated' client configuration cannot exist, so the JWT-Accept guard described here has no caller."

  - id: JINT-011
    severity: P0
    spec: RFC 9701 §6 / RFC 7516
    behaviour: |
      A client configured for encrypted introspection responses
      receives a JWE with header alg=A128KW and enc=A128CBC-HS256.
    status: out-of-scope
    out_of_scope_reason: JWE / encrypted response types are out-of-scope in v1.0 (see test/scenarios/catalog/encryption.yaml). The OP cannot emit JWE introspection responses, so the A128KW / A128CBC-HS256 envelope shape has no caller.
