# yaml-language-server: $schema=./schema.json
feature: response_modes
prefix: RMO
title: Non-JWT response modes
specs:
  - OAuth 2.0 Multiple Response Type Encoding Practices §2 (response_mode)
  - OAuth 2.0 Form Post Response Mode (Final)
  - OAuth 2.0 Web Message Response Mode (draft, deprecated)
  - OIDC Core 1.0 §3.1.2 (response_mode default selection)
  - RFC 9207 — Authorization Server Issuer Identification

description: |
  Non-JWT (form_post, web_message, custom) response modes plus default
  selection rules. JWT-secured response modes (JARM) are catalogued in
  jarm.yaml. Web Message is informational only and SHOULD NOT be
  enabled by default.

rows:
  - id: RMO-001
    severity: P0
    spec: OAuth Form Post §2
    behaviour: |
      A successful authorization with response_type=code id_token token
      and response_mode=form_post returns 200 OK with an HTML page
      carrying a self-submitting <form method="post" action="{redirect_uri}">
      whose hidden inputs include code, state, and the response_type
      specific fields.
    status: out-of-scope
    out_of_scope_reason: "response_type=code id_token token is a hybrid response_type and the OP is code-only: response_types_supported is [\"code\"], so the multi-token form body this row describes has no emission path. The code-flow form_post body the OP does emit carries code, state and iss."

  - id: RMO-002
    severity: P0
    spec: OAuth Form Post §2 / OWASP HTML escaping
    behaviour: |
      The OP MUST HTML-escape redirect_uri when interpolating it into
      the form action attribute. An XSS payload such as
      https://client.example.com/cb"><script>...</script><x=" MUST be
      rendered as escaped text only and never executed.
    status: out-of-scope
    out_of_scope_reason: "The XSS precondition is unreachable. redirect_uri is matched for exact equality against the client's registered set before any response is composed, so an attacker-supplied payload URI is refused with invalid_request and never reaches the form writer; the writer additionally escapes the action attribute. There is no wire seam on which to observe the unescaped interpolation this row attacks."

  - id: RMO-003
    severity: P0
    spec: OAuth Form Post §2
    behaviour: |
      An error path (for example prompt=none yielding login_required)
      returns a 400 HTML form posting error=login_required and state to
      redirect_uri, and emits an authorization.error audit event.
    status: out-of-scope
    out_of_scope_reason: "The OP delivers form_post error responses — error, error_description, state and iss as hidden inputs — but with HTTP 200 OK, which is the status the auto-submitting form body carries in every case. The 400 status this row asserts is not the OP's wire behaviour, so the row cannot be bound as written."

  - id: RMO-004
    severity: P1
    spec: OAuth Form Post §2
    behaviour: |
      GET and POST authorization endpoints MUST behave identically when
      response_mode=form_post is selected.
    status: out-of-scope
    out_of_scope_reason: "GET and POST /authorize are parsed by one request decoder and reach one emit path, so response_mode handling is method-independent by construction rather than by a per-method branch. There is no method-specific seam for this row to observe; the shared emit path is covered by the form_post rows that do bind."

  - id: RMO-010
    severity: P1
    spec: Web Message draft §2
    behaviour: |
      A successful web_message response renders 200 OK HTML with
      Cache-Control: no-store and Content-Type: text/html; charset=utf-8,
      embedding a JSON literal of the form
      var data = {redirect_uri, response: {...}};.
    status: out-of-scope
    out_of_scope_reason: "Web Message response mode is intentionally not supported by default. The catalog header itself notes \"Web Message is informational only and SHOULD NOT be enabled by default\" (response_modes.yaml description) and it is not a shipped feature; the deprecated draft has known abuse surface (cf. RMO-012 relay-mode rejection rationale)."
    notes: web_message is deprecated; do not enable by default.

  - id: RMO-011
    severity: P1
    spec: Web Message draft §2
    behaviour: |
      The web_message response data MUST include every standard
      authorization response field appropriate for the response_type
      (code, state, id_token, access_token, expires_in, token_type,
      scope as applicable).
    status: out-of-scope
    out_of_scope_reason: "Web Message response mode is intentionally not supported by default. The catalog header itself notes \"Web Message is informational only and SHOULD NOT be enabled by default\" (response_modes.yaml description) and it is not a shipped feature; the deprecated draft has known abuse surface (cf. RMO-012 relay-mode rejection rationale)."

  - id: RMO-012
    severity: P0
    spec: Web Message draft (relay variant)
    behaviour: |
      Relay Mode (the web_message_uri parameter) MUST be rejected with
      a rendered error stating that Web Message Response Mode Relay
      Mode is not supported. The OP MUST NOT honour relay because of
      its known abuse surface.
    status: out-of-scope
    out_of_scope_reason: "Web Message response mode is intentionally not supported by default. The catalog header itself notes \"Web Message is informational only and SHOULD NOT be enabled by default\" (response_modes.yaml description) and it is not a shipped feature; the deprecated draft has known abuse surface (cf. RMO-012 relay-mode rejection rationale)."

  - id: RMO-013
    severity: P0
    spec: OWASP CSP / X-Frame-Options
    behaviour: |
      The OP MUST strip embedder-supplied x-frame-options and any
      frame-ancestors CSP directive on web_message responses. The
      response is itself the messaging surface, so the OP controls
      framing per its own policy.
    status: out-of-scope
    out_of_scope_reason: "Web Message response mode is intentionally not supported by default. The catalog header itself notes \"Web Message is informational only and SHOULD NOT be enabled by default\" (response_modes.yaml description) and it is not a shipped feature; the deprecated draft has known abuse surface (cf. RMO-012 relay-mode rejection rationale)."

  - id: RMO-014
    severity: P1
    spec: Web Message draft §3
    behaviour: |
      An error web_message response (for example prompt=none yielding
      login_required) renders the same HTML envelope but populates
      response.error, response.state, and iss instead of the success
      fields.
    status: out-of-scope
    out_of_scope_reason: "Web Message response mode is intentionally not supported by default. The catalog header itself notes \"Web Message is informational only and SHOULD NOT be enabled by default\" (response_modes.yaml description) and it is not a shipped feature; the deprecated draft has known abuse surface (cf. RMO-012 relay-mode rejection rationale)."

  - id: RMO-020
    severity: P1
    spec: OIDC Discovery
    behaviour: |
      When the web_message feature is enabled, the discovery document
      response_modes_supported array MUST include web_message.
    status: out-of-scope
    out_of_scope_reason: "Web Message response mode is intentionally not supported by default. The catalog header itself notes \"Web Message is informational only and SHOULD NOT be enabled by default\" (response_modes.yaml description) and it is not a shipped feature; the deprecated draft has known abuse surface (cf. RMO-012 relay-mode rejection rationale)."

  - id: RMO-030
    severity: P1
    spec: extension API
    behaviour: |
      The OP exposes a registerResponseMode(name, fn) hook so embedders
      can add new transports without the registration call panicking
      or returning an error for valid input.
    status: out-of-scope
    out_of_scope_reason: "v1.0 exposes no public registerResponseMode(name, fn) hook. The valid response_modes set is fixed at the dispatcher boundary (internal/authorizeendpoint) to {query, form_post, jwt, query.jwt, fragment.jwt, form_post.jwt} and gated by op.WithJARMResponseMode for the .jwt half; an unknown value triggers unsupported_response_mode (RMO-033). Adding a custom-response-mode extension API would expand the OP's public surface for a transport family the library deliberately keeps closed: web_message and embedder-defined modes do not ship. Embedders that need custom transports wrap the OP's response and re-encode at the gateway layer."

  - id: RMO-031
    severity: P1
    spec: extension API
    behaviour: |
      A registered custom response mode is invoked for SUCCESS results
      as fn(ctx, redirectUri, payload), where payload includes code,
      state, and iss (per RFC 9207) for response_type=code.
    status: out-of-scope
    out_of_scope_reason: "Same rationale as RMO-030: v1.0 has no registerResponseMode extension hook so there is no per-success custom-mode invocation surface to assert. The success-mode wire shape v1.0 does emit (query for code flow, with code/state/iss per RFC 9207) is bound by the active code-flow scenarios end-to-end via scenariokit.RunCodeFlow; the iss parameter is verified by ISS-020."

  - id: RMO-032
    severity: P1
    spec: extension API
    behaviour: |
      A registered custom response mode is invoked for ERROR results
      with payload populated with error, error_description, state, and
      iss.
    status: out-of-scope
    out_of_scope_reason: "Same rationale as RMO-030 / RMO-031: v1.0 has no registerResponseMode extension hook so there is no per-error custom-mode invocation surface. The error-redirect wire shape v1.0 does emit (query carrying error/error_description/state/iss) is bound by RMO-033 (unknown response_mode) and ERR-050 (iss on error redirects)."

  - id: RMO-033
    severity: P0
    spec: OAuth Multiple Response Type §2
    behaviour: |
      An unknown response_mode value (one outside the OP's known set
      {"", "query", "form_post", "query.jwt", "fragment.jwt",
      "form_post.jwt", "jwt"}) MUST trigger a redirect to the
      registered redirect_uri carrying error=unsupported_response_mode
      and error_description="response_mode is not supported", with the
      original `state` echoed.
    status: active

  - id: RMO-040
    severity: P0
    spec: OIDC Core §3.1.2
    behaviour: |
      Default response_mode selection (code half): a successful
      authorization with response_type=code and no response_mode in the
      request encodes the response in the redirect URL's query string
      (no fragment). The implicit half of the spec rule (id_token /
      token defaulting to fragment) is not exercisable at the wire in
      v1.0 because response_types_supported is ["code"] only and any
      implicit response_type is rejected upstream as
      unsupported_response_type; that half is intentionally not part of
      this row's coverage.
    status: active
