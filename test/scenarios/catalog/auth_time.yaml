# yaml-language-server: $schema=./schema.json
feature: auth_time
prefix: AT
title: auth_time claim and max_age handling
specs:
  - OIDC Core 1.0 §2 (ID Token, `auth_time` claim)
  - OIDC Core 1.0 §3.1.2.1 (`max_age`, `prompt` request parameters)
  - OIDC Core 1.0 §5.5.1.1 (`auth_time` essential claim)
  - OIDC Registration 1.0 §2 (`require_auth_time`, `default_max_age`)

description: |
  Conditions under which the issued ID Token MUST carry the `auth_time`
  claim. Triggers come from request parameters (`max_age`,
  `prompt=login`) and from client metadata (`default_max_age`,
  `require_auth_time`).

rows:
  - id: AT-001
    severity: P0
    spec: OIDC Core §3.1.2.1
    behaviour: |
      An authorization request that supplies a positive `max_age` (e.g.
      `max_age=999`) with `response_type=id_token` and scope `openid`
      MUST result in an ID Token whose payload includes `auth_time`
      as numeric epoch seconds.
    status: active

  - id: AT-002
    severity: P0
    spec: OIDC Core §3.1.2.1
    behaviour: |
      An authorization request that supplies `prompt=login` forces
      re-authentication, so the issued ID Token MUST include
      `auth_time`.
    status: active

  - id: AT-003
    severity: P0
    spec: OIDC Core §3.1.2.1
    behaviour: |
      An authorization request that supplies `max_age=0` is treated as
      "always re-authenticate"; the issued ID Token MUST include
      `auth_time` exactly as for any other `max_age`.
    status: active

  - id: AT-004
    severity: P1
    spec: OIDC Registration §2
    behaviour: |
      When the client's `default_max_age` is `0` and the request omits
      `max_age`, the metadata default applies as if it were a request
      `max_age` and the issued ID Token MUST include `auth_time`.
    status: active

  - id: AT-005
    severity: P0
    spec: OIDC Registration §2
    behaviour: |
      When the client's `require_auth_time` is `true`, the issued ID
      Token MUST include `auth_time` regardless of `max_age` or
      `prompt` on the request.
    status: active

  - id: AT-006
    severity: P1
    spec: OIDC Registration §2 / OIDC Core §3.1.2.1
    behaviour: |
      When the client's `default_max_age` is a positive integer and the
      request omits `max_age`, the issued ID Token MUST include
      `auth_time`.
    status: active

  - id: AT-007
    severity: P1
    spec: OIDC Core §2 / RFC 8628 §3
    behaviour: |
      The id_token issued from a device_code redemption MUST carry the
      `auth_time` claim populated from
      [store.DeviceCode.AuthTime] — the wall-clock the substore stamped
      at Approve. A zero AuthTime (legacy record / embedder did not
      stamp one) leaves the claim absent, matching the encoder's
      omit-on-zero posture; a client that sets `require_auth_time`
      additionally surfaces the missing value as a 500 server_error so
      the contract is not satisfied by silent omission.
    status: active

  - id: AT-008
    severity: P1
    spec: OIDC Core §2 / CIBA Core §11
    behaviour: |
      The id_token issued from a CIBA poll redemption MUST carry the
      `auth_time` claim populated from
      [store.CIBARequest.AuthTime] — the wall-clock the substore
      stamped at Approve. A zero AuthTime leaves the claim absent
      (omit-on-zero); a client that sets `require_auth_time`
      additionally surfaces the missing value as a 500 server_error.
    status: active
    covered_by: internal/tokenendpoint.TestHandleCIBA_IDTokenStampsAuthTime
    notes: |
      Driving a CIBA redemption end to end needs an approve hook the
      public surface does not expose, so the assertion sits at the
      token endpoint where the approved record can be seated directly.

  - id: AT-009
    severity: P0
    spec: OIDC Core §2 / §3.1.2.1
    behaviour: |
      When an authorization request is served from a live session and no
      credential chain runs during the attempt — the user is only asked
      to approve additional scope — the issued ID Token's `auth_time`
      MUST be the authentication time recorded on that session, and
      `acr` / `amr` MUST be the ones of that authentication. Neither may
      be re-derived from the attempt's empty factor set, and the durable
      grant the code hangs off MUST keep the same three values, since
      every later token minted from that grant reads them back off the
      record.
    status: active
    covered_by: internal/authorizeendpoint.TestEndToEnd_ConsentOnlyKeepsSessionAuthentication
    notes: |
      AT-001..AT-006 assert only that `auth_time` is present, and the
      rows that pin a value cover the device_code and CIBA redemptions,
      so this is where the authorization-code path's value is fixed.
      Driving it takes a two-pass browser flow against a movable clock,
      which the suite's single-pass fixtures do not provide; the
      assertion therefore sits beside the endpoint's other multi-hop
      freshness tests and runs on both authentication surfaces.
