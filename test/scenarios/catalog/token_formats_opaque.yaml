# yaml-language-server: $schema=./schema.json
# DEPRECATED: this file enumerates the panva/node-oidc-provider
# adapter.upsert payload contract (kind=AccessToken, kind=AuthorizationCode,
# kind=DeviceCode, kind=BackchannelAuthenticationRequest, kind=RefreshToken,
# kind=ClientCredentials, kind=InitialAccessToken, kind=RegistrationAccessToken,
# nested under accountId / params / extra / inFlight / expiresWithSession,
# etc.). go-oidc-provider v1.0 does NOT adopt that payload contract:
# ADR 0024 ("Opaque access-token format opt-in") fixes the on-the-wire
# bytes at 43-character base64url and persists a Go-shaped
# [store.OpaqueAccessToken] record (no kind tag, no params blob, no
# expiresWithSession bit) through the [store.OpaqueAccessTokenStore]
# substore. Other token kinds (authorization code, refresh token, device
# code, CIBA request, initial / registration access tokens) live in
# their own substores with their own Go-shaped records and are exercised
# by the catalog files that own those features.
#
# These TFO-NNN rows remain in the tree as historical traceability for
# the panva-translation effort. They are NOT activated under v1.0 and
# the matching test/scenarios/token_formats_opaque_test.go functions
# stay on t.Skip with a pointer to the superseding catalog.
#
# The v1.0 deliverable that ships ADR 0024 is exercised by the ATO-NNN
# catalog at test/scenarios/catalog/access_token_opaque.yaml; new opaque
# access-token coverage MUST land there.
feature: token_formats_opaque
prefix: TFO
title: Opaque token persistence payload (DEPRECATED — superseded by ATO)
specs:
  - RFC 6749 — OAuth 2.0
  - RFC 6750 — Bearer Token
  - RFC 7009 / 7662 — Revocation / Introspection
  - RFC 8628 — Device Authorization Grant
  - OIDC Core 1.0 §3 — AuthorizationCode / IdToken
  - RFC 7591 / 7592 — Initial / Registration access tokens
  - OIDC CIBA — Backchannel authentication request
  - RFC 8705 — `x5t#S256` confirmation
  - RFC 9449 — `jkt` / `dpopJkt` confirmation

description: |
  DEPRECATED — panva-style adapter.upsert payload contract.
  go-oidc-provider v1.0 adopts a different shape (the
  [store.OpaqueAccessToken] Go struct under ADR 0024) and does not
  exercise the rows below. See
  test/scenarios/catalog/access_token_opaque.yaml (ATO-NNN) for the
  v1.0 opaque-AT scenarios and ADR 0024 for the design.

  Per-kind contract for the payload the OP hands to adapter.upsert when
  persisting an opaque token. The body is always a 43-character
  base64url string (32 random bytes), and each token kind carries a
  fixed property set so storage layers can rely on a stable shape.

rows:
  - id: TFO-001
    severity: P0
    spec: RFC 6749 / RFC 8705 / RFC 9449
    behaviour: |
      Saving an opaque access token writes a 43-character jti and a
      payload containing accountId, aud, claims, clientId, exp,
      grantId, gty, iat, jti, kind=AccessToken, scope, sid, x5t#S256,
      jkt, sessionUid, expiresWithSession, and extra.
    status: out-of-scope
    out_of_scope_reason: "The token_formats_opaque feature is documented in its own catalog header (lines 1-25) as DEPRECATED panva/node-oidc-provider adapter.upsert payload contract that go-oidc-provider v1.0 explicitly does NOT adopt. ADR 0024 (\"Opaque access-token format opt-in\") fixes the v1.0 wire bytes at 43-character base64url and persists a Go-shaped store.OpaqueAccessToken record (no kind tag, no params blob, no expiresWithSession bit) through the store.OpaqueAccessTokenStore substore. Other token kinds (authorization code, refresh token, device code, CIBA request, initial / registration access tokens) live in their own substores with Go-shaped records exercised by their feature-specific catalogs. The v1.0 deliverable for opaque access tokens is the ATO-NNN catalog at access_token_opaque.yaml. These TFO rows are retained only as historical traceability for the panva-translation effort and should never be activated under v1.0."

  - id: TFO-002
    severity: P1
    spec: RFC 9068 §2.2.3.1
    behaviour: |
      When extra is omitted at construction, the extraTokenClaims hook
      runs during save and the resulting token instance carries the
      configurator-supplied extra values.
    status: out-of-scope
    out_of_scope_reason: "The token_formats_opaque feature is documented in its own catalog header (lines 1-25) as DEPRECATED panva/node-oidc-provider adapter.upsert payload contract that go-oidc-provider v1.0 explicitly does NOT adopt. ADR 0024 (\"Opaque access-token format opt-in\") fixes the v1.0 wire bytes at 43-character base64url and persists a Go-shaped store.OpaqueAccessToken record (no kind tag, no params blob, no expiresWithSession bit) through the store.OpaqueAccessTokenStore substore. Other token kinds (authorization code, refresh token, device code, CIBA request, initial / registration access tokens) live in their own substores with Go-shaped records exercised by their feature-specific catalogs. The v1.0 deliverable for opaque access tokens is the ATO-NNN catalog at access_token_opaque.yaml. These TFO rows are retained only as historical traceability for the panva-translation effort and should never be activated under v1.0."

