# yaml-language-server: $schema=./schema.json
feature: signatures
prefix: SIG
title: JWS signing — ID Token / JARM / UserInfo / introspection
specs:
  - RFC 7515 — JWS
  - RFC 7518 §3 — JWA (alg)
  - RFC 8037 — CFRG curves (EdDSA, Ed25519)
  - OIDC Core 1.0 §3.1.3.6 (at_hash, c_hash)
  - OIDC Core 1.0 §3.1.3.7 (id_token signing)
  - RFC 9700 §2 / FAPI 1.0 / FAPI 2.0 (alg policy)

description: |
  Algorithm selection and hash-claim semantics for JWS-signed OP
  output (id_token, JARM response, signed UserInfo, signed
  introspection). Hash-claim length tests run in the hybrid
  response_type flows that emit both at_hash and c_hash.

rows:
  - id: SIG-001
    severity: P0
    spec: OIDC Core §3.1.3.7
    behaviour: |
      When id_token_signed_response_alg=HS256, /token returns an
      id_token with three compact-JWS segments and a non-empty
      signature; the JWS header alg is HS256.
    status: out-of-scope
    out_of_scope_reason: "ES256 sole-issuance policy (002 §J.5 / line 2163: \"ES256 単一\"). HS256 issuance is not supported because the symmetric-key model violates §J.5 and §non-goals (line 2159)."
    notes: needs RP simulator + per-client alg pinning.

  - id: SIG-002
    severity: P1
    spec: OIDC Core §3.1.3.7 (id_token_hint)
    behaviour: |
      An HS256-signed id_token MUST be accepted as id_token_hint at
      /authorize?prompt=none for the same client; the flow returns
      code + state.
    status: out-of-scope
    out_of_scope_reason: "HS256 (and the broader HS* family) is intentionally not supported in v1.0: docs/plans/002-product-design.md §J.5 (line 2248) pins ES256 as the sole issuance alg, and §non-goals (line 2159) excludes the symmetric-key model. Already-OOS rows in this same feature (SIG-001 / SIG-010 / SIG-011 / SIG-012) cite the same product policy. The id_token_hint acceptance path described by SIG-002 has no caller because the OP never issues an HS256 id_token to begin with; if v1.x ever ships symmetric signing, a paired SIG-001 + SIG-002 bind can revisit this."

  - id: SIG-010
    severity: P0
    spec: OIDC Core §3.1.3.6
    behaviour: |
      For RS256 / ES256 / PS256, at_hash and c_hash are the left 128
      bits of SHA-256 (base64url, 22 chars).
    status: out-of-scope
    out_of_scope_reason: ES256-only issuance per 002 §J.5 (line 2248). RS*/PS*/ES384/ES512 are not minted by the OP; only verification-side acceptance is wider (line 2255).
    notes: needs hybrid response_type wiring.

  - id: SIG-011
    severity: P0
    spec: OIDC Core §3.1.3.6
    behaviour: |
      For RS384 / ES384 / PS384, at_hash and c_hash are the left 192
      bits of SHA-384 (base64url, 32 chars).
    status: out-of-scope
    out_of_scope_reason: ES256-only issuance per 002 §J.5 (line 2248). RS*/PS*/ES384/ES512 are not minted by the OP; only verification-side acceptance is wider (line 2255).

  - id: SIG-012
    severity: P0
    spec: OIDC Core §3.1.3.6
    behaviour: |
      For RS512 / ES512 / PS512, at_hash and c_hash are the left 256
      bits of SHA-512 (base64url, 43 chars).
    status: out-of-scope
    out_of_scope_reason: ES256-only issuance per 002 §J.5 (line 2248). RS*/PS*/ES384/ES512 are not minted by the OP; only verification-side acceptance is wider (line 2255).

  - id: SIG-013
    severity: P1
    spec: OIDC Core §3.1.3.6 + RFC 8037
    behaviour: |
      For EdDSA, at_hash and c_hash are the left 256 bits of SHA-512
      (base64url, 43 chars).
    status: out-of-scope
    out_of_scope_reason: "EdDSA / Ed25519 issuance is intentionally not supported in v1.0: docs/plans/002-product-design.md §J.5 (line 2248) pins ES256 as the sole issuance alg. The hash-claim length rules (left-256 bits of SHA-512 for both EdDSA and Ed25519 id_tokens) only apply when the OP actually mints those id_token shapes; with ES256-only issuance there is no caller. Verification-side acceptance is explicitly wider per line 2255 but that is governed by id_token_hint / userinfo verification rows in other features, not by SIG-013/014's signing-side claims."

  - id: SIG-014
    severity: P1
    spec: OIDC Core §3.1.3.6 + RFC 8037
    behaviour: |
      For Ed25519, at_hash and c_hash are the left 256 bits of
      SHA-512 (base64url, 43 chars).
    status: out-of-scope
    out_of_scope_reason: "EdDSA / Ed25519 issuance is intentionally not supported in v1.0: docs/plans/002-product-design.md §J.5 (line 2248) pins ES256 as the sole issuance alg. The hash-claim length rules (left-256 bits of SHA-512 for both EdDSA and Ed25519 id_tokens) only apply when the OP actually mints those id_token shapes; with ES256-only issuance there is no caller. Verification-side acceptance is explicitly wider per line 2255 but that is governed by id_token_hint / userinfo verification rows in other features, not by SIG-013/014's signing-side claims."

  - id: SIG-015
    severity: P2
    spec: draft-ietf-cose-dilithium
    behaviour: |
      For ML-DSA-44 / 65 / 87, at_hash and c_hash are the left 256
      bits of SHAKE256(m, 64) (base64url, 43 chars).
    status: out-of-scope
    out_of_scope_reason: |
      ML-DSA support is post-v1.0; the draft is not Final and the Go
      crypto runtime has no built-in ML-DSA primitives.

  - id: SIG-020
    severity: P0
    spec: OIDC Core §3.1.3.7 + RFC 7515
    behaviour: |
      The OP signs with the alg from the client's
      id_token_signed_response_alg and selects the matching key from
      the OP keystore (with kid in the JWS header).
    status: active

  - id: SIG-021
    severity: P1
    spec: OIDC Discovery
    behaviour: |
      Supported alg values MUST be advertised in
      id_token_signing_alg_values_supported.
    status: active
    notes: partially covered by SIG-022; expand once per-alg policy lands.

  - id: SIG-022
    severity: P0
    spec: RFC 9700 §2 / FAPI 1.0 / FAPI 2.0
    behaviour: |
      none MUST NOT appear in id_token_signing_alg_values_supported;
      RS256 is the OIDC mandatory baseline; FAPI mandates PS256 /
      ES256 / EdDSA.
    status: active
