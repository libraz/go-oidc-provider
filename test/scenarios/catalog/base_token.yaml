# yaml-language-server: $schema=./schema.json
feature: base_token
prefix: BT
title: BaseToken lifecycle and TTL
specs:
  - RFC 6749 §6 — Refresh tokens
  - RFC 6749 §10.5 — Token storage / TTL
  - OIDC Core 1.0 §3.1 — Authorization code
  - RFC 8628 — Device Authorization Grant (findByUserCode)
  - RFC 9068 — Contrast with structured JWT access tokens

description: |
  Generic lifecycle invariants for the OP's token abstraction: legacy
  structured-token rejection, expiry handling, defensive input
  robustness, consumed-flag round-trip, TTL determination across save /
  resave, save-return identity stability, and exception propagation
  through session and device-code lookups.

rows:
  - id: BT-001
    severity: P1
    spec: implementation compatibility
    behaviour: |
      A legacy structured token whose adapter record carries a stray
      jwt property is treated as unresolvable; find returns nothing
      rather than attempting to interpret the legacy envelope.
    status: out-of-scope
    out_of_scope_reason: "Every BT-NNN row in this feature describes storage adapter contract semantics — refresh-token TTL accounting, consumed-flag round-trip through Save/Find, exception propagation through Session.findByUid / DeviceCode.findByUserCode, and JS-flavoured shapes (`stray jwt property`, `non-string inputs`, `save returns jti`) that don't map onto Go's typed Store interface at all. In go-oidc-provider these guarantees live on the substore interfaces in op/store/{refresh,authcode,session,device}.go and are validated by the reusable contract harness at op/store/contract/ (which every adapter — inmem, sql, redis — runs against). The test/scenarios/ suite is intentionally black-box and wire-level: it drives /authorize, /token, /introspect, /userinfo over httptest and asserts on responses and audit events, not on internal Store call graphs. The wire-level expressions of the BT behaviours (expired refresh → /token invalid_grant; consumed refresh → invalid_grant + chain revoke; consumed code → invalid_grant) are already exercised in refresh.yaml and authorization_code.yaml under their feature-specific IDs."

