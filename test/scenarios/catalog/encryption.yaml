# yaml-language-server: $schema=./schema.json
feature: encryption
prefix: ENC
title: Encryption (JWE) for tokens, request objects and responses
specs:
  - RFC 7516 — JSON Web Encryption
  - RFC 7518 — JSON Web Algorithms (alg / enc)
  - RFC 7519 §11 — JWE-nested-JWT
  - RFC 8037 — CFRG curves
  - OIDC Core 1.0 §3.1.3.7, §10.1, §16.7
  - OIDC Discovery 1.0 §3 (*_encryption_alg/enc_values_supported)
  - RFC 9101 — JWT-Secured Authorization Request (JAR)
  - RFC 9126 — Pushed Authorization Requests (PAR)

description: |
  Token, response object and request object encryption (JWE) — covering
  symmetric vs. asymmetric algorithms, discovery surface, encrypted
  ID Token / UserInfo / Request Object payloads, key selection, and
  client_secret-derived encryption paths.

rows:
  - id: ENC-001
    severity: P0
    spec: OIDC Core §10.1 / §16.7
    behaviour: |
      Whenever any of authorization_encrypted_response_alg,
      id_token_encrypted_response_alg, introspection_encrypted_response_alg,
      request_object_encryption_alg or userinfo_encrypted_response_alg
      is set to a symmetric alg (A128GCMKW, A192GCMKW, A256GCMKW,
      A128KW, A192KW, A256KW, dir), Client.needsSecret() MUST return
      true even when token_endpoint_auth_method=none, because a public
      client cannot validly derive the encryption key.
    status: out-of-scope
    out_of_scope_reason: |
      Token, response-object, and request-object encryption (JWE,
      RFC 7516) is intentionally not implemented in v1.0. The OP
      relies on TLS for transport confidentiality; embedders that
      need claim-level confidentiality typically minimise the claim
      set or front the OP with a layer that performs JWE
      independently. Reintroducing JWE here would expand the
      key-management surface (encryption keysets, alg / enc
      negotiation, symmetric-from-secret derivation) for a feature
      with low production adoption — FAPI 2.0 does not require it
      either. Revisit if an embedder we care about needs encrypted
      ID Tokens / Request Objects and is willing to fund the
      operational cost.

  - id: ENC-002
    severity: P0
    spec: OIDC Core §16.7
    behaviour: |
      An expired client_secret combined with a symmetric alg MUST
      yield a front-channel invalid_client error
      ("client secret is expired - cannot issue an encrypted ID Token
      (<alg>)") before any token is minted.
    status: out-of-scope
    out_of_scope_reason: |
      Token, response-object, and request-object encryption (JWE,
