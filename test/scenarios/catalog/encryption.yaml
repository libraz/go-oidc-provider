# yaml-language-server: $schema=./schema.json
feature: encryption
prefix: ENC
title: Encryption (JWE) for tokens, request objects and responses
specs:
  - RFC 7516 — JSON Web Encryption
  - RFC 7517 §4.2 — use=sig / use=enc separation
  - RFC 7518 — JSON Web Algorithms (alg / enc)
  - RFC 7519 §11 — JWE-nested-JWT
  - RFC 8037 — CFRG curves
  - OIDC Core 1.0 §3.1.3.7, §10.1, §10.2, §16.7
  - OIDC Discovery 1.0 §3 (*_encryption_alg/enc_values_supported)
  - RFC 9101 — JWT-Secured Authorization Request (JAR)
  - RFC 9126 — Pushed Authorization Requests (PAR)
  - RFC 9701 — JWT Response for OAuth Token Introspection
  - FAPI 2.0 Message Signing §5.5 (JARM)

description: |
  Token, response object and request object encryption (JWE) — covering
  asymmetric algorithms (RSA-OAEP-256, ECDH-ES family) negotiated via
  per-client metadata, the discovery surface, encrypted ID Token /
  UserInfo / JARM / introspection responses, and decryption of inbound
  encrypted JAR / PAR request_object payloads.

  v0.9.1 ships an asymmetric-only, closed-allow-list profile: the OP
  rejects symmetric (alg=A*KW, dir) JWE at registration and decryption
  time, only signs with ES256, and only emits userinfo signed with
  ES256. Symmetric / HS256 / dir paths remain out-of-scope; revisit
  if an embedder needs them.

rows:
  - id: ENC-001
    severity: P0
    spec: OIDC Core §10.1 / §16.7
    behaviour: |
      Whenever any of authorization_encrypted_response_alg,
      id_token_encrypted_response_alg, introspection_encrypted_response_alg,
      request_object_encryption_alg or userinfo_encrypted_response_alg
      is set to a symmetric alg (A128GCMKW, A192GCMKW, A256GCMKW,
      A128KW, A192KW, A256KW, dir), Client.needsSecret() MUST return
      true even when token_endpoint_auth_method=none, because a public
      client cannot validly derive the encryption key.
    status: out-of-scope
    out_of_scope_reason: |
      Symmetric JWE algorithms (A*KW, dir) are not in the v0.9.1
      closed allow-list. The DCR validator rejects these alg values
      at client registration before any "needsSecret" derivation runs,
      so the public-client / client_secret-derived key path never
      activates. Revisit if an embedder needs client_secret-derived
      JWE.

  - id: ENC-002
    severity: P0
    spec: OIDC Core §16.7
    behaviour: |
      An expired client_secret combined with a symmetric alg MUST
      yield a front-channel invalid_client error
      ("client secret is expired - cannot issue an encrypted ID Token
      (<alg>)") before any token is minted.
    status: out-of-scope
    out_of_scope_reason: |
      Symmetric JWE algorithms (A*KW, dir) are not in the v0.9.1
      closed allow-list. With no client_secret-derived encryption
      path, the expired-secret branch the row asserts never fires.
      The error wording is also panva-specific and not part of our
      wire format.

  - id: ENC-010
    severity: P1
    spec: OIDC Discovery §3
    behaviour: |
      When [op.WithEncryptionKeyset] is configured the discovery
      document MUST emit the eight encryption-related arrays:
      id_token_encryption_alg_values_supported,
      id_token_encryption_enc_values_supported,
      request_object_encryption_alg_values_supported,
      request_object_encryption_enc_values_supported,
      userinfo_encryption_alg_values_supported,
      userinfo_encryption_enc_values_supported,
      authorization_encryption_alg_values_supported and
      authorization_encryption_enc_values_supported. When the option
      is omitted the same fields MUST be absent (omitempty).
    status: active

  - id: ENC-020
    severity: P0
    spec: RFC 7516 §3 / OIDC Core §10.2 / RFC 7519 §5.2
    behaviour: |
      A nested JWE-of-signed-JWT MUST be a 5-part compact serialization
      (header.cek.iv.ct.tag); the protected header MUST carry
      cty=JWT (RFC 7519 §5.2); decrypting the JWE yields a valid
      compact JWS whose ES256 signature verifies under the OP's
      published signing JWKS.
    status: active

  - id: ENC-021
    severity: P1
    spec: OIDC Core §16
    behaviour: |
      An encrypted ID Token JWE protected header MUST duplicate iss
      and aud so the RP can route decryption keys without parsing the
      payload; the values match the OP issuer and client_id.
    status: out-of-scope
    out_of_scope_reason: |
      Duplicating iss / aud onto the JWE protected header is a
      panva-specific extension. OIDC Core §16 leaves header iss / aud
      as MAY-clauses; we route by kid alone. RPs needing the
      duplicated headers can pre-process via a wrapper.

  - id: ENC-022
    severity: P0
    spec: OIDC Core §5.3.2
    behaviour: |
      An encrypted UserInfo response uses Content-Type: application/jwt,
      is a 5-part JWE, the JWE header carries iss and aud, and the
      decrypted payload has an exp claim in the future.
    status: out-of-scope
    out_of_scope_reason: |
      The wire-shape half of this row (Content-Type, 5-part JWE,
      decrypted body) is now exercised by ENC-110. The header iss /
      aud duplication remains panva-specific (see ENC-021).

  - id: ENC-023
    severity: P0
    spec: OIDC Core §16.7
    behaviour: |
      An expired client_secret combined with HS256-signed UserInfo
      MUST produce 400 invalid_client
      ("client secret is expired - cannot respond with HS256 JWT
      UserInfo response").
    status: out-of-scope
    out_of_scope_reason: |
      HS256-signed userinfo (symmetric signing) is not in the v0.9.1
      profile; the OP signs all userinfo with ES256. The
      client_secret-derived branch never activates.

  - id: ENC-024
    severity: P0
    spec: OIDC Core §16.7
    behaviour: |
      An expired client_secret combined with dir-encrypted UserInfo
      MUST produce 400 invalid_client
      ("client secret is expired - cannot respond with dir encrypted
      JWT UserInfo response").
    status: out-of-scope
    out_of_scope_reason: |
      dir / symmetric JWE not in the v0.9.1 allow-list (see ENC-001).

  - id: ENC-030
    severity: P0
    spec: RFC 9101 §6.1 / OIDC Discovery
    behaviour: |
      An /authorize request whose request_object is JWE-encrypted
      with an unsupported alg (for example RSA-OAEP-512 when only
      RSA-OAEP-256 is in the allow-list) MUST be rejected with a
      400 invalid_request_object envelope. The exact error_description
      wording is implementation-defined and not asserted. The catalog
      originally specified a redirect-with-query envelope; the v0.9.1
      wire shape is JSON 400 (writeJAREnvelopeError), which is what
      the test pins.
    status: active

  - id: ENC-031
    severity: P0
    spec: RFC 9101 §6.1
    behaviour: |
      An /authorize request whose request_object is JWE-encrypted
      with an unsupported enc (for example A192CBC-HS384, not in the
      A128GCM / A256GCM allow-list) MUST be rejected with the same
      400 invalid_request_object envelope as ENC-030 (JSON shape, not
      a redirect — see ENC-030 deviation note).
    status: active

  - id: ENC-032
    severity: P1
    spec: OIDC Core §10.1 / OIDC Discovery §3
    behaviour: |
      With [op.WithEncryptionKeyset] registered, the discovery
      document's request_object_encryption_alg_values_supported MUST
      be a subset of [op.SupportedEncryptionAlgs]; the embedder may
      narrow it via [op.WithSupportedEncryptionAlgs] but MUST NOT
      extend it. Without an encryption keyset all
      *_encryption_*_values_supported arrays MUST be absent.
    status: active

  - id: ENC-035
    severity: P0
    spec: RFC 7519 §5.2 / RFC 9101 §6.1
    behaviour: |
      A JAR / PAR request_object that nests JWE-of-JWE-of-...-of-JWS
      beyond the OP's structural depth ceiling (10 total JOSE layers,
      counting each JWE peel and the inner JWS) MUST be rejected with
      a 400 invalid_request_object envelope. The boundary is
      deliberately chosen so the existing per-layer 1 MiB plaintext
      cap and the depth cap together bound the total decrypt work an
      attacker can force per request. The wire-error class is
      collapsed onto the malformed-request-object family so an
      attacker cannot probe for the cap value via wire-code variation.
    status: active

  - id: ENC-036
    severity: P0
    spec: RFC 7591 §2 / OIDC Core §6.1
    behaviour: |
      Dynamic Client Registration MUST reject a half-set encryption
      pair on every encrypted-response family with 400
      invalid_client_metadata. Registering one of `*_encrypted_response_alg`
      / `*_encryption_alg` without the matching `_enc` (or vice versa)
      across the five families (id_token, userinfo, request_object,
      authorization, introspection) admits a configuration the OP's
      runtime encryption path will reject on the first response, so the
      validator closes the gap at registration time. Both empty is
      accepted (the client takes the unencrypted, signed-only path);
      both set to an alg/enc on the closed JOSE allow-list is accepted.
      OIDC Core §6.1 permits negotiating the missing half from the
      discovery list, but the v0.9.x OP does not implement that
      negotiation.
    status: active

  - id: ENC-040
    severity: P0
    spec: RFC 9126 + RFC 9101
    behaviour: |
      POST /par accepts a JWE-encrypted-and-signed request_object
      addressed to one of the OP's encryption JWK kids and returns
      a 201 with a request_uri; a subsequent
      /authorize?request_uri=... drives the OP to decrypt the object,
      verify the inner JWS, and emit a code redirect to the
      registered redirect_uri.
    status: active

  - id: ENC-041
    severity: P1
    spec: RFC 9101 §6.1 + per-client metadata
    behaviour: |
      When client metadata mandates a non-none request_object_signing_alg,
      PAR MUST still accept signed Request Objects matching that alg
      (including symmetric paths such as HS256).
    status: out-of-scope
    out_of_scope_reason: |
      HS256 signing is not in the v0.9.1 profile (see ENC-023).

  - id: ENC-050
    severity: P0
    spec: OIDC Core §10.1
    behaviour: |
      When id_token_encrypted_response_alg=ECDH-ES but the client JWKS
      contains no suitable EC key, the OP MUST emit a fragment redirect
      with error=invalid_client_metadata and
      error_description="no suitable encryption key found (ECDH-ES)".
    status: out-of-scope
    out_of_scope_reason: |
      The exact error code and wording on the missing-EC-key path is
      panva-specific. Our resolver surfaces ErrNoMatchingKey at id_token
      issuance time as a fail-closed 500 / token-endpoint error rather
      than a fragment redirect with invalid_client_metadata. The same
      wire-level invariant (encryption-failure does not silently
      downgrade) is asserted by ENC-141.

  - id: ENC-060
    severity: P1
    spec: OIDC Core §16.7 / RFC 7518 §4.4
    behaviour: |
      The OP accepts a Request Object encrypted with A128KW plus
      A128CBC-HS256 keyed off client_secret (HMAC-SHA-256 truncated
      to 128 bits per OIDC Core §16.7).
    status: out-of-scope
    out_of_scope_reason: |
      Symmetric JWE not in the v0.9.1 allow-list (see ENC-001).

  - id: ENC-061
    severity: P0
    spec: OIDC Core §16.7
    behaviour: |
      An expired client_secret blocks symmetric Request Object
      decryption with a redirect carrying error=invalid_request_object
      and error_description="could not decrypt the Request Object - the
      client secret used for its encryption is expired".
    status: out-of-scope
    out_of_scope_reason: |
      Symmetric JWE not in the v0.9.1 allow-list (see ENC-001); the
      client_secret-derived branch never activates.

  - id: ENC-062
    severity: P1
    spec: RFC 7516 §4.1.1
    behaviour: |
      A symmetrically encrypted ID Token JWE header carries
      alg=A128KW, iss and aud.
    status: out-of-scope
    out_of_scope_reason: |
      Symmetric JWE not in the v0.9.1 allow-list (see ENC-001).
      Header iss / aud duplication is panva-specific (see ENC-021).

  - id: ENC-070
    severity: P1
    spec: OIDC Core §16.7 / RFC 7518 §4.5
    behaviour: |
      A Request Object encrypted with alg=dir, enc=A128CBC-HS256
      derived from client_secret (HMAC-SHA-256 producing a 256-bit key
      for A128CBC-HS256 per OIDC Core §16.7) MUST be accepted.
    status: out-of-scope
    out_of_scope_reason: |
      dir JWE not in the v0.9.1 allow-list (see ENC-001).

  - id: ENC-071
    severity: P0
    spec: OIDC Core §16.7
    behaviour: |
      An expired client_secret combined with a dir-encrypted Request
      Object MUST trigger the same invalid_request_object response
      with description "could not decrypt the Request Object - the
      client secret used for its encryption is expired".
    status: out-of-scope
    out_of_scope_reason: |
      dir JWE not in the v0.9.1 allow-list (see ENC-001).

  - id: ENC-072
    severity: P1
    spec: RFC 7516 §4.1.1
    behaviour: |
      A direct-key encrypted ID Token JWE header carries alg=dir,
      enc=A128CBC-HS256, iss and aud.
    status: out-of-scope
    out_of_scope_reason: |
      dir JWE not in the v0.9.1 allow-list (see ENC-001).
      Header iss / aud duplication is panva-specific (see ENC-021).

  - id: ENC-100
    severity: P0
    spec: OIDC Core §10.2 / RFC 7519 §5.2
    behaviour: |
      When a confidential client registers
      id_token_encrypted_response_alg + id_token_encrypted_response_enc
      and the OP holds the matching public encryption key in the
      registered client JWKS, the authorization_code grant MUST emit
      the id_token field as a 5-part nested JWE (cty=JWT) addressed
      to the client's enc-use key. Decryption + inner JWS
      verification yields the same claim set the unencrypted path
      would have emitted (iss, aud, sub, exp, iat, nonce when
      requested).
    status: active

  - id: ENC-101
    severity: P0
    spec: OIDC Core §12 / RFC 6749 §6
    behaviour: |
      A refresh_token grant against the same encryption-enrolled
      client MUST emit the rotated id_token field as a JWE addressed
      to the client's enc-use key. The unencrypted-id_token branch
      MUST NOT be exercised on refresh when the client registered
      id_token_encrypted_response_alg.
    status: active

  - id: ENC-110
    severity: P0
    spec: OIDC Core §5.3.2
    behaviour: |
      When the client registers
      userinfo_encrypted_response_alg + userinfo_encrypted_response_enc
      and the request carries Accept: application/jwt, GET /userinfo
      MUST respond with Content-Type: application/jwt and a 5-part
      JWE compact serialisation. Decryption + inner JWS verification
      yields the same claim set the JSON shape would emit, plus iss
      and aud stamped onto the signed body so the RP can satisfy
      OIDC Core §5.3.2's MUST clauses.
    status: active

  - id: ENC-111
    severity: P1
    spec: OIDC Core §5.3.2
    behaviour: |
      A request whose Accept header omits application/jwt MUST
      receive the legacy JSON userinfo response (Content-Type
      application/json) even when the client registered
      userinfo_encrypted_response_alg. Encryption negotiation is
      gated on the explicit JWT-shape opt-in.
    status: active

  - id: ENC-120
    severity: P0
    spec: FAPI 2.0 Message Signing §5.5
    behaviour: |
      When the client registers
      authorization_encrypted_response_alg +
      authorization_encrypted_response_enc and uses a JARM response
      mode (jwt / query.jwt / fragment.jwt / form_post.jwt),
      /authorize success responses MUST deliver a 5-part JWE
      addressed to the client's enc-use key in the resolved JARM
      response_mode parameter ("response="). Decryption + inner JWS
      verification yields a JARM payload whose iss, aud, code and
      state match the request.
    status: active

  - id: ENC-121
    severity: P1
    spec: FAPI 2.0 Message Signing §5.5
    behaviour: |
      When a client requires encrypted JARM and the OP cannot resolve
      a compatible encryption recipient, JARM error responses MUST
      fail closed as a generic server_error redirect. The redirect
      MUST NOT contain a signed-only "response" JWT or authorization
      code; state and issuer correlation parameters remain present.
    status: active

  - id: ENC-130
    severity: P0
    spec: RFC 9701 §4
    behaviour: |
      When the client registers
      introspection_encrypted_response_alg +
      introspection_encrypted_response_enc and the
      /introspection request carries Accept:
      application/token-introspection+jwt, the response MUST be a
      5-part JWE wrapping the signed introspection JWT. Decryption +
      inner JWS verification yields the standard introspection
      claim set (active, scope, sub, exp, ...).
    status: active

  - id: ENC-140
    severity: P1
    spec: RFC 7517 §4.2
    behaviour: |
      [op.New] MUST reject configurations where a kid appears in
      both the signing keyset (use=sig) and the encryption keyset
      (use=enc). The two keysets MUST advertise disjoint kids in the
      published JWKS so an RP can route by kid alone.
    status: active

  - id: ENC-141
    severity: P0
    spec: ADR 0030 §S.5 (fail-closed)
    behaviour: |
      When the encryption-enrolled client's registered enc-use key
      cannot be resolved at id_token / userinfo / JARM /
      introspection issuance time (key rotated out, JWKS unreachable,
      alg/enc mismatch), the OP MUST fail closed: the unencrypted
      JWS form is NEVER emitted as a silent downgrade. id_token /
      userinfo / introspection paths surface the failure as a 5xx
      to the RP; the JARM success path emits a server_error redirect
      so the user is not stranded mid-flow.
    status: active
