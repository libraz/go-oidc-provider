# yaml-language-server: $schema=./schema.json
feature: client_credentials
prefix: CC
title: Client Credentials grant
specs:
  - RFC 6749 §4.4 — Client Credentials Grant
  - RFC 6749 §3.3 — Access Token Scope
  - RFC 6749 §5.1 / §5.2 — Token Response and Error Format
  - RFC 6750 — Bearer Token Usage

description: |
  Token-endpoint behaviour for the client_credentials grant: success
  shape (no Account, no Grant), scope narrowing semantics, and the
  invalid_scope error envelope.

rows:
  - id: CC-001
    severity: P0
    spec: RFC 6749 §4.4.3, §5.1
    behaviour: |
      A confidential client that authenticates and requests
      grant_type=client_credentials with an allowed scope receives 200
      with a JSON body whose keys are access_token, expires_in,
      token_type, and scope; the body MUST NOT include refresh_token or
      id_token (the cc grant has no resource owner). token_type is
      "Bearer" on the bearer-default path.
    status: active

  - id: CC-002
    severity: P1
    spec: RFC 6749 §3.3 (server may issue narrower scope)
    behaviour: |
      When the request includes a scope value not enabled for the
      client (e.g. an unknown scope alongside known ones) and policy
      treats it as unsupported, the server returns 200 with an
      AccessToken whose scope is narrowed to the supported subset; the
      response body's scope matches the issued scope and the
      client_credentials.saved/issued audit event reflects the
      narrowed value.
    status: pending

  - id: CC-003
    severity: P0
    spec: RFC 6749 §3.3 / §5.2
    behaviour: |
      When the requested scope contains a value outside the client's
      registered Scopes set, the token endpoint MUST return 400 with a
      JSON envelope whose error is invalid_scope. v1.0's
      error_description for this branch reads "requested scope exceeds
      the client's registered set" (internal/tokenendpoint/clientcred.go).
      The response MUST NOT include access_token / token_type / scope
      success-side keys.
    status: active

  - id: CC-004
    severity: P2
    spec: RFC 6749 §4.4 (no resource owner)
    behaviour: |
      On success the request context resolves Client and
      ClientCredentials entities only; no Account or Grant entity is
      bound because the grant has no resource owner.
    status: pending
