# yaml-language-server: $schema=./schema.json
feature: mtls_certificate_binding
prefix: MTLS
title: mTLS Certificate-Bound Access Tokens
specs:
  - RFC 8705 — OAuth 2.0 Mutual-TLS Client Authentication and Certificate-Bound Access Tokens
  - RFC 7662 — OAuth 2.0 Token Introspection
  - RFC 6749 — OAuth 2.0 Authorization Framework
  - RFC 8628 — Device Authorization Grant
  - OpenID CIBA Core 1.0

description: |
  Sender-constrained access tokens bound to the TLS client
  certificate (x5t#S256). Covers discovery surface, dual-binding
  rejection, resource-server presentation, x5t#S256 thumbprint
  derivation, introspection cnf surfacing, and binding semantics
  across the authorization-code, refresh, device, CIBA and
  client-credentials grants for both confidential and public clients.

rows:
  - id: MTLS-001
    severity: P1
    spec: RFC 8705 §3.3
    behaviour: |
      When the feature is enabled, /.well-known/openid-configuration
      includes tls_client_certificate_bound_access_tokens=true.
    status: active

  - id: MTLS-002
    severity: P0
    spec: RFC 8705 §3 / RFC 9449 §6
    behaviour: |
      An access token cannot carry two proof-of-possession bindings
      at once; setting both x5t#S256 and jkt thumbprints on a single
      AT MUST fail with a construction error.
    status: out-of-scope
    out_of_scope_reason: "non-spec residue: catalog asserts a 'construction error' when an access token would carry both x5t#S256 and jkt; v1.0 instead resolves the conflict at issuance by preferring DPoP over mTLS (internal/tokenendpoint/mtls.go: when a DPoP proof is present the cert lookup is skipped and the AT carries cnf.jkt only). A single token therefore never carries both members in the first place, so there is nothing to reject at construction time. The userinfo path still enforces both proofs when a token does carry both members, defensive against forged tokens; that is the v1.0 contract embedders rely on."

  - id: MTLS-003
    severity: P0
    spec: RFC 8705 §3
    behaviour: |
      A cert-bound access token presented as Bearer at /userinfo with
      no TLS client cert header is rejected with 401 invalid_token
      (cannot validate x5t#S256).
    status: active

  - id: MTLS-004
    severity: P0
    spec: RFC 8705 §3
    behaviour: |
      A cert-bound access token presented with a malformed TLS client
      cert header (e.g. non-PEM/garbage in x-ssl-client-cert) is
      rejected with 401 invalid_token.
    status: active

  - id: MTLS-005
    severity: P0
    spec: RFC 8705 §3.1
    behaviour: |
      A cert-bound access token presented at /userinfo with the same
      TLS client certificate that bound it is accepted (200) and
      resource access is permitted.
    status: active

  - id: MTLS-006
    severity: P1
    spec: RFC 8705 §3.2 / RFC 7662
    behaviour: |
      Introspection of a cert-bound access token surfaces cnf.x5t#S256
      and token_type=Bearer in the response.
    status: active

  - id: MTLS-007
    severity: P0
    spec: RFC 8705 §3
    behaviour: |
      The x5t#S256 thumbprint MUST equal base64url(SHA-256(DER(cert))).
    status: active

  - id: MTLS-008
    severity: P0
    spec: RFC 8705 §3 / RFC 8628
    behaviour: |
      A confidential client redeeming a device_code at /token with a
      TLS client cert receives an access token bound by x5t#S256;
      the refresh token is NOT sender-constrained.
    status: out-of-scope
    out_of_scope_reason: RFC 8628 device authorization grant is intentionally deferred to v1.x and not present in v1.0; mirrors the blanket OOS already applied to test/scenarios/catalog/device_code.yaml. Revisit when the device_code wave lands.

  - id: MTLS-009
    severity: P0
    spec: RFC 8705 §3
    behaviour: |
      A device_code redemption for a cert-binding-required client
      with no TLS client cert is rejected with 400 invalid_grant
      "mutual TLS client certificate not provided".
    status: out-of-scope
    out_of_scope_reason: RFC 8628 device authorization grant is intentionally deferred to v1.x and not present in v1.0; mirrors the blanket OOS already applied to test/scenarios/catalog/device_code.yaml.

  - id: MTLS-010
    severity: P0
    spec: RFC 8705 §3
    behaviour: |
      A public client (auth method none) redeeming a device_code
      with a TLS client cert receives both an access token and a
      refresh token bound by x5t#S256 (RTs MUST be sender-constrained
      for public clients).
    status: out-of-scope
    out_of_scope_reason: RFC 8628 device authorization grant is intentionally deferred to v1.x and not present in v1.0; mirrors the blanket OOS already applied to test/scenarios/catalog/device_code.yaml.

  - id: MTLS-011
    severity: P0
    spec: RFC 8705 §3 / OIDC CIBA Core
    behaviour: |
      A confidential client redeeming a CIBA grant at /token with a
      TLS client cert receives an access token bound by x5t#S256; the
      refresh token is NOT sender-constrained.
    status: out-of-scope
    out_of_scope_reason: OpenID CIBA Core 1.0 is intentionally deferred to v1.x and not present in v1.0; mirrors the blanket OOS already applied to test/scenarios/catalog/ciba.yaml. Revisit when CIBA lands.

  - id: MTLS-012
    severity: P0
    spec: RFC 8705 §3
    behaviour: |
      A CIBA grant redemption for a cert-binding-required client
      with no TLS client cert is rejected with 400 invalid_grant
      "mutual TLS client certificate not provided".
    status: out-of-scope
    out_of_scope_reason: OpenID CIBA Core 1.0 is intentionally deferred to v1.x and not present in v1.0; mirrors the blanket OOS already applied to test/scenarios/catalog/ciba.yaml.

  - id: MTLS-013
    severity: P0
    spec: RFC 8705 §3
    behaviour: |
      A public client redeeming a CIBA grant with a TLS client cert
      receives both an access token and a refresh token bound by
      x5t#S256.
    status: out-of-scope
    out_of_scope_reason: OpenID CIBA Core 1.0 is intentionally deferred to v1.x and not present in v1.0; mirrors the blanket OOS already applied to test/scenarios/catalog/ciba.yaml.

  - id: MTLS-014
    severity: P0
    spec: RFC 8705 §3 / RFC 6749 §4.1
    behaviour: |
      A confidential client redeeming an authorization_code at /token
      with a TLS client cert receives an access token bound by
      x5t#S256; the refresh token is NOT sender-constrained.
    status: out-of-scope
    out_of_scope_reason: "non-spec residue (divergent posture): the row asserts the AT is bound by x5t#S256 (true in v1.0) AND the RT is NOT sender-constrained (false in v1.0). v1.0 propagates the cert binding onto the rotated refresh-token record for confidential clients as well as public ones (internal/tokenendpoint/authcode.go:790 MTLSCertThumbprint: binding.MTLSThumbprint, with no public-vs-confidential split). Leaving the RT unbound would silently downgrade the chain on first refresh; the project chose the safer 'bind once, enforce always' posture. The AT-binding half is exercised by MTLS-007 (thumbprint encoding) and MTLS-018/-023 (issuance for public client / client_credentials); the RT-bind-too divergence is covered by internal/tokenendpoint/authcode_mtls_test.go and internal/tokenendpoint/refresh_mtls_test.go (RT thumbprint round-trip across rotation)."

  - id: MTLS-015
    severity: P0
    spec: RFC 8705 §3
    behaviour: |
      An authorization_code redemption for a cert-binding-required
      client with no TLS client cert is rejected with 400
      invalid_grant "mutual TLS client certificate not provided".
    status: out-of-scope
    out_of_scope_reason: "v1.0 has no per-client 'cert-binding-required' policy knob. RFC 8705 §3 prescribes opportunistic binding (a presented cert binds the token; an absent cert is the bearer path) and the OP follows that posture: an authorization_code redemption with no cert succeeds and yields a bearer access token. The deployment-wide hard requirement is reachable via FAPI 2.0 (op.WithProfile sets RequireSenderConstrainedTokens=true and internal/tokenendpoint/authcode.go enforceSenderConstraint then rejects a cert-less + DPoP-less redemption with 400 invalid_request 'sender-constrained access token required'); embedders that want per-client granularity layer that on at the gateway. The OP itself never rejects a cert-less request that is otherwise well-formed and outside a sender-constrained profile. Revisit when / if the OP grows a per-client mTLS-required policy surface."

  - id: MTLS-016
    severity: P0
    spec: RFC 8705 §3
    behaviour: |
      A confidential client refresh_token redemption with a TLS
      client cert issues a new access token bound by x5t#S256; the
      refresh token remains unbound.
    status: out-of-scope
    out_of_scope_reason: "non-spec residue (divergent posture): same shape as MTLS-014. The row asserts the refresh redemption mints an x5t#S256-bound AT (true) and that the RT 'remains unbound' (false in v1.0). v1.0 always inherits the cert binding onto the rotated RT record regardless of client auth method (internal/tokenendpoint/refresh.go:60 MTLSThumbprint: exchanged.MTLSCertThumbprint, with no public-vs-confidential split). RFC 8705 §3 leaves the RT-binding question implicit; the project takes the safer 'bind once, enforce always' posture. The wire-level enforcement contract is covered by MTLS-020 / MTLS-021 / MTLS-022 (public-client refresh round-trip) and the rotation white-box at internal/tokenendpoint/refresh_mtls_test.go."

  - id: MTLS-017
    severity: P0
    spec: RFC 8705 §3
    behaviour: |
      A refresh_token redemption for a cert-binding-required
      confidential client without a TLS client cert is rejected with
      400 invalid_grant "mutual TLS client certificate not provided".
    status: active

  - id: MTLS-018
    severity: P0
    spec: RFC 8705 §3
    behaviour: |
      A public client redeeming an authorization_code at /token with
      a TLS client cert receives both an access token and a refresh
      token bound by x5t#S256.
    status: active

  - id: MTLS-019
    severity: P0
    spec: RFC 8705 §3
    behaviour: |
      A public client authorization_code redemption without a TLS
      client cert is rejected with 400 invalid_grant "mutual TLS
      client certificate not provided".
    status: out-of-scope
    out_of_scope_reason: "Same v1.0-has-no-cert-binding-required-policy reason as MTLS-015. A public client's authorization_code redemption with no cert returns a bearer access token; the OP follows the opportunistic-binding posture RFC 8705 §3 prescribes. The deployment-wide hard requirement is reachable via FAPI 2.0 (RequireSenderConstrainedTokens via enforceSenderConstraint) plus a gateway policy for per-client granularity. Revisit when the OP grows a per-client mTLS-required policy surface."

  - id: MTLS-020
    severity: P0
    spec: RFC 8705 §3
    behaviour: |
      A public client refresh_token redemption with the same TLS
      client cert issues a new access token and a rotated refresh
      token both bound by x5t#S256.
    status: active

  - id: MTLS-021
    severity: P0
    spec: RFC 8705 §3
    behaviour: |
      A public client refresh_token redemption without a TLS client
      cert is rejected with 400 invalid_grant "mutual TLS client
      certificate not provided".
    status: active

  - id: MTLS-022
    severity: P0
    spec: RFC 8705 §3
    behaviour: |
      A public client refresh_token redemption with a different
      (non-binding) TLS client cert is rejected with 400
      invalid_grant "failed x5t#S256 verification".
    status: active

  - id: MTLS-023
    severity: P0
    spec: RFC 8705 §3 / RFC 6749 §4.4
    behaviour: |
      A client_credentials redemption with a TLS client cert issues
      a ClientCredentials access token bound by x5t#S256.
    status: active

  - id: MTLS-024
    severity: P0
    spec: RFC 8705 §3
    behaviour: |
      A client_credentials redemption for a cert-binding-required
      client without a TLS client cert is rejected with 400
      invalid_grant "mutual TLS client certificate not provided".
    status: out-of-scope
    out_of_scope_reason: "Same v1.0-has-no-cert-binding-required-policy reason as MTLS-015 / MTLS-019. A client_credentials redemption with no cert returns a bearer access token; the OP follows the opportunistic-binding posture RFC 8705 §3 prescribes. The deployment-wide hard requirement is reachable via FAPI 2.0 (RequireSenderConstrainedTokens via enforceSenderConstraint) plus a gateway policy for per-client granularity. Revisit when / if the OP grows a per-client mTLS-required policy surface."

  - id: MTLS-025
    severity: P2
    spec: RFC 6749 §5.2 / RFC 8705 §3
    behaviour: |
      A grant-time mTLS verification failure returns HTTP 400 with
      body {"error":"invalid_grant","error_description":"grant
      request is invalid"} and surfaces the detailed reason via the
      audit/error_detail channel.
    status: out-of-scope
    out_of_scope_reason: "non-spec residue: catalog asserts a generic 400 envelope {error: invalid_grant, error_description: 'grant request is invalid'} with the precise mismatch reason routed through a separate audit/error_detail channel. v1.0 instead writes the mismatch reason directly into error_description (internal/tokenendpoint/* emits 'failed x5t#S256 verification' or 'mutual TLS client certificate not provided' verbatim); MTLS-022 (cert mismatch) and MTLS-021 (no cert) bind that wire shape. The audit/error_detail split surface the catalog assumes is not modelled in v1.0 — there is no separate detail-only channel — so the canonical 'generic body, detail in audit' shape has nothing to assert against."
