  - id: CVE-2024-53861
    severity: P2
    source: https://github.com/advisories/GHSA-75c5-xw7c-p5pm
    threat: T-04
    status: covered
    notes: |
      PyJWT accepted an issuer that merely shared a prefix with the
      expected value, so a token minted by "https://issuer.example.com"
      satisfied an expectation of "https://issuer.example.com.evil" (and
      vice versa). The comparison shape matters here because client
      identifiers are chosen at registration time, so a non-equality
      test is one registration away from an impersonation.
      Structural property: an "iss" claim is compared as a whole string.
      TestPrivateKeyJWTVerifier_IssuerMustMatchWholly drives the
      near-miss table — prefix extension, path extension, the registered
      value embedded in a longer one, host prefix, trailing slash,
      surrounding whitespace, case folding, truncation, empty — against
      the client-assertion surface, moving iss and sub together and then
      each alone so a verifier that checks one and trusts the other is
      caught. A control asserts the exact identifier still
      authenticates. The OP-issuer surfaces (JAR audience,
      token-exchange external-issuer pin) resolve through the same
      whole-string comparison in tokens.AccessTokenVerifier.

  - id: CVE-2026-86073
    severity: P1
    source: https://github.com/advisories/GHSA-cw9w-vv67-hf73
    threat: T-04
    status: covered
    notes: |
      An RFC 8707 resource indicator supplied on a refresh_token request
      substituted the token's audience for one the original
      authorization grant never approved — a request-time value
      widening or switching what the refreshed access token could reach.
      Structural property: refresh never reads a request-supplied
      resource; the audience and the refresh record's own recorded
      resource are carried forward from the grant unconditionally.
      TestRefreshTokenIgnoresRequestSuppliedResource pins it by
      requesting a different resource on refresh and asserting both the
      issued access token's aud and the refresh record's own resource
      stay the grant's original value.
      Aliases: GHSA-p2fr-6hmx-4528.

  - id: CVE-2026-32235
    severity: P1
    source: https://nvd.nist.gov/vuln/detail/CVE-2026-32235
    threat: T-01
    status: covered
    notes: |
      Backstage auth-backend redirect-URI allowlist bypass under
      Dynamic Client Registration: a crafted redirect_uri passes the
      configured allowlist pattern yet resolves to an attacker host,
      delivering the code to the attacker. Registration records a literal
      URI rather than a pattern, and
      TestDCR_RegisteredRedirectURIIsMatchedByteExactly drives a
      dynamically registered client through the authority, path, port and
      scheme variants to pin that /authorize refuses to redirect anywhere
      but the registered string.
      TestDCR_RejectsRedirectURIShapesThatBlurTheMatch covers the
      registration half — the shapes that would have no single
      unambiguous reading are refused at registration time.

