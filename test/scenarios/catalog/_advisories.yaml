    threat: T-13
    status: covered
    notes: |
      A JWKS cache keyed only by "kid" let a kid collision across two
      registered clients resolve to the wrong client's key, sharing key
      material across tenants. Structural property: key selection is
      scoped to the client being authenticated, resolved from storage,
      before any kid is consulted — the same property already pinned
      for CVE-2026-11800 and CVE-2026-27962.
      TestPrivateKeyJWTVerifier_KeySelectionIgnoresTheAssertionsOwnHeader
      drives a colliding kid (the attacker's own and the victim's) across
      two legitimately registered clients and requires each cross-client
      resolution to fail.
      Aliases: CVE-2026-49998, CVE-2026-50202.
  - id: CVE-2026-18208
    severity: P1
    source: https://nvd.nist.gov/vuln/detail/CVE-2026-18208
    threat: T-13
    status: covered
    notes: |
      Introspection answered active=true (or otherwise leaked claims)
      for a token belonging to a client other than the caller, and
      separately for a token that had already been withdrawn.
      TestHandler_JWTAccessToken_DifferentClient pins the wrong-client
      half; TestHandler_OpaqueAccessToken_Revoked pins the withdrawn-
      token half.
      Aliases: CVE-2026-58425, GHSA-vxv2-8j6r-pcpg.
  - id: CVE-2026-53512
    severity: P1
    source: https://github.com/advisories/GHSA-pw9m-5jxm-xr6h
    threat: T-13
    status: covered
    notes: |
      A refresh_token grant was accepted with no client authentication
      at all, letting possession of the refresh token stand in for the
      confidential client's own credential.
      TestRefreshTokenGrantRejectsMissingClientAuthentication pins the
      no-credentials case; sibling tests in the same file pin the wrong-
      secret and none-auth variants of the same gate.
      Aliases: none known at scan time.
  - id: CVE-2026-16103
    severity: P1
    source: https://nvd.nist.gov/vuln/detail/CVE-2026-16103
    threat: T-13
    status: covered
    notes: |
      Token redemption skipped the subject's disabled/deleted re-check,
      letting a deprovisioned account's authorization code, refresh
      token, and earlier-issued access token keep working. Structural
      property: every redemption path re-resolves the subject through
      the Store's UserStore and refuses (tearing down the backing grant)
