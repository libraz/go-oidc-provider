  - id: CVE-2026-11800
    severity: P0
    source: https://github.com/advisories/GHSA-gqj5-2xp5-3qmp
    threat: T-05
    status: covered
    notes: |
      Keycloak JWT authorization-grant algorithm confusion (CWE-347,
      CVSS 8.1): an attacker holding any valid client credential in the
      realm forged an assertion by manipulating the "alg" header, and
      signature verification was satisfied without the registered key.
      Structural property: key selection is driven by the client being
      authenticated, resolved from storage, and the algorithm by the
      OP's closed allow-list intersected with the client's registered
      pin — no JOSE header member participates in either choice.
      TestPrivateKeyJWTVerifier_KeySelectionIgnoresTheAssertionsOwnHeader
      pins it from the position the CVE describes: a second registered
      client whose key the OP legitimately accepts tries to authenticate
      as the victim while steering selection through kid (its own and
      the victim's), an absent kid, and inline / remote key references
      (jwk, jku, x5u). A control asserts the victim's own key still
      authenticates, so the refusals are not vacuous.
      TestPrivateKeyJWTVerifier_RejectsAlgOutsideClientPin covers the
      registered-alg half.
  - id: CVE-2026-48523
    severity: P2
    source: https://github.com/advisories/GHSA-jq35-7prp-9v3f
    threat: T-05
    status: covered
    notes: |
      PyJWT: when the verification key was supplied as a key object
      carrying its own "alg" metadata, that value took precedence over
      the caller's algorithm allow-list, so a key registered for one
      algorithm verified a token signed with another. Reading a JWK's
      "alg" as policy inverts the trust relationship — the client writes
      the JWKS, so the client would be choosing how strong its own
      authentication has to be.
      Structural property: the allow-list is a closed compile-time set
      that no key member can widen; the key's declared algorithm only
      ever narrows, via the shape check and the client's registered pin.
      TestPrivateKeyJWTVerifier_RegisteredKeyCannotWidenTheAlgorithmPolicy
      registers a symmetric "oct" key declaring HS256 / HS384 / HS512
      and signs an assertion with the very bytes the JWKS publishes —
      the case that matters, since a symmetric key in a published keyset
      is a credential anyone who fetched it holds — and requires each to
      be refused.
  - id: CVE-2026-48526
    severity: P2
    source: https://github.com/advisories/GHSA-xgmm-8j9v-c9wx
    threat: T-05
    status: covered
    notes: |
      PyJWT accepted an asymmetric public JWK as the shared secret for
      an HMAC verification, letting an attacker who knows the published
      public key forge an HS256 token — the canonical algorithm
      confusion, reached through the key-resolution API rather than the
      alg header. Structural property: the algorithm is pinned to the
      resolved key, and the signing-algorithm allow-list is closed
      before any key is touched, so no symmetric branch is reachable.
      TestVerify_AlgConfusion_HSUsingECPublicKeyBytesAsSecret pins it by
      taking a published EC key's x||y bytes as an HS256 secret and
      requiring the token to fail as malformed rather than as a
      signature mismatch — the rejection happens before verification.
  - id: CVE-2026-16093
    severity: P1
    source: https://nvd.nist.gov/vuln/detail/CVE-2026-16093
    threat: T-05
    status: covered
    notes: |
      An unsigned ("none") assertion satisfied a client-authentication
      policy that required a signed JWT (private_key_jwt). Two layers
      close it: "none" (in any header casing) never parses as a usable
      signed JWS in the first place
      (TestParseSigned_CaseVariantNoneRejected), and a weaker presented
      method cannot satisfy a policy that names a stronger one even when
      it would independently authenticate the client
      (TestVerifyClient_AllowedMethodsRejectsOutOfPolicy).
      Aliases: none known at scan time.
  - id: GHSA-jc38-x7x8-2xc8
    severity: P1
    source: https://github.com/advisories/GHSA-jc38-x7x8-2xc8
    threat: T-05
    status: covered
    notes: |
      An alg taken from an unprotected / per-signature header let a
      verifier downgrade to a weaker sibling algorithm (e.g. ES512 to
      ES384) than the one the signer intended. Structural property: the
      closed allow-list ({RS256, PS256, ES256, EdDSA}) is enforced
      against the single protected header of a compact-serialised JWS;
      there is no per-signature unprotected header to read, so a
      multi-signature JSON-form JWS — the shape that would carry one —
      is refused outright before any algorithm is even considered.
      TestParseSigned_RejectsUnsupportedRegisteredAlg_NoFailOpen drives
      cryptographically valid sibling-algorithm tokens and requires the
      out-of-allow-list ones to fail; TestParseSigned_RejectsMultiSignatureForm
      pins that the JSON multi-signature form never parses.
      Aliases: CVE-2026-63761.

