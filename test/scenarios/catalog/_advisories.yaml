      authenticator — silent takeover. Structural property: any
      single-use action / enrollment credential must be atomically
      consumed on first use and rejected on replay. Pinned on the OP's
      email-delivered single-use surface by
      TestContinueVerifyReplayRejected (emailotp), which verifies a code
      once and asserts a second submission of the same code is rejected
      (ErrExpired). Recovery codes carry the same property
      (TestVerify_RejectsConsumedCode).
  - id: CVE-2026-9802
    severity: P1
    source: https://github.com/keycloak/keycloak/issues/49426
    threat: T-07
    status: covered
    notes: |
      Keycloak decided whether a rotated refresh token was stale by
      comparing it against the cluster's startup timestamp, an
      in-process value. A restart reset that timestamp, so every
      previously rotated token stopped looking stale and became
      replayable — the failure direction that matters, since the tokens
      did not become unverifiable but valid again. Structural property:
      the verdict comes from the Store's own consume record, so an
      instance that never observed the rotation reaches the same one.
      TestExchange_RotationVerdictSurvivesAProcessThatNeverSawTheRotation
      models the restart as a second Exchanger over the same store —
      which is what a restart is from this code's point of view — and
      requires the superseded token to be refused as replayed past the
      grace window, with a control proving the restarted instance still
      exchanges an unspent token.

  # --- T-08 Outbound fetch / SSRF ----------------------------------
  - id: CVE-2026-1180
    severity: P0
    source: https://access.redhat.com/security/cve/CVE-2026-1180
    threat: T-08
    status: covered
    notes: Keycloak OIDC DCR jwks_uri SSRF during private_key_jwt key resolution.
  - id: CVE-2026-48522
    severity: P1
    source: https://github.com/advisories/GHSA-993g-76c3-p5m4
    threat: T-08
    status: covered
    notes: |
      PyJWKClient handed the JWKS URI straight to the URL opener with no
      scheme restriction, so "file://", "ftp://" and "data:" values were
      fetched. Beyond the read primitive this is a forgery primitive: an
      attacker who can place a JWK Set at a path the URI names has the
      verifier adopt their signing key. Two independent gates, pinned
      separately because either alone would leave the other path open.
      At registration, jwks_uri must name an https resource —
      TestDCR_ClientMetadataIsTreatedAsAttackerInput drives it (with the
      other URI-valued members) against javascript / data / file / ftp /
      http / relative / userinfo shapes.
      At fetch, the transport carries its own scheme allow-list, so a
      value that reached storage by any other route still cannot be
      dereferenced: TestFetcher_JWKSURISchemeIsConstrainedToTheNetwork
      covers both the ordinary and the forced-refresh entry points, with
      the private-network opt-in granted so the refusal is attributable
      to the scheme rather than the SSRF deny-list.

  # --- T-09 Token / sensitive-info leak paths ----------------------
  - id: GHSA-7mqr-2v3q-v2wm
    severity: P1
    source: https://github.com/ory/fosite/security/advisories/GHSA-7mqr-2v3q-v2wm
    threat: T-09
    status: covered
    notes: |
      fosite revoke silently swallowed storage errors. The library
      keeps the wire 200 (RFC 7009 §2.2) but emits the
      "token.revoke_failed" audit event on every non-NotFound store
      fault so SOC tooling can detect the silent-failure class.
      TestHandler_RefreshToken_StoreFault_EmitsAudit pins the contract.

  - id: CVE-2026-8922
    severity: P2
    source: https://nvd.nist.gov/vuln/detail/CVE-2026-8922
    threat: T-09
    status: covered
    notes: |
      Keycloak introspection ignored the realm-level notBefore when a
      client-level notBefore was set, so a token inside the revoked
      window still introspected as active.
      TestEndToEnd_ActiveHonoursEveryRevocationInput drives the endpoint
      with each withdrawal input applied on its own — the per-token
      denylist and the grant tombstone — plus an unwithdrawn control, so
      an implementation that answers from whichever input it consults
      first fails on the row the other input owns.

  # --- T-10 Timing ---------------------------------------------------
  - id: CVE-2026-22746
    severity: P2
    source: https://spring.io/security/cve-2026-22746/
    threat: T-10
    status: covered
    notes: |
      Spring Security's DaoAuthenticationProvider took a measurably
      different amount of time when the presented principal did not
      exist than when it existed with a wrong password, because the
      expensive password hash was only computed on the second path. The
      difference enumerates accounts and, with a slow hash, is remotely
      observable. Structural property: the rejection paths that would
      otherwise return before any cryptography ran — unknown client,
      client-id mismatch, confidential client with no stored hash — run
      a fixed-cost decoy first, sized to the method (a dummy hash for
      the secret methods, a synthetic ECDSA P-256 verify for
      private_key_jwt), so an unknown client_id costs what a wrong
      credential costs. MethodNone is deliberately unpadded, since
      padding a branch with no cryptographic check would create the
      channel in the other direction.
      TestVerifyClient_PrivateKeyJWT_UnknownClient_DummyVerifyShim pins
      both structural branches; TestPrivateKeyJWTVerifier_NoKeysRunsTimingShim
      pins the resolver-side equivalent.

  # --- T-11 Open redirect on error ---------------------------------
  - id: CVE-2023-6927
    severity: P0
    source: https://nvd.nist.gov/vuln/detail/CVE-2023-6927
    threat: T-11
    status: covered
    notes: Keycloak JARM form_post.jwt open redirect.
  - id: GHSA-27gc-wj6x-9w55
    severity: P1
    source: https://github.com/keycloak/keycloak/security/advisories/GHSA-27gc-wj6x-9w55
    threat: T-11
    status: covered
    notes: |
      Keycloak error_description injection on error pages → phishing.
      Two-layer mitigation:
        - error_description values are a closed catalogue of hardcoded
          sentinels (internal/authorize/errors.go); RP-supplied bytes
          never reach the field directly.
        - On the redirect surface url.Values.Encode percent-encodes
          every value; on the form_post surface html.EscapeString
          escapes both action= and value=. Pinned by
          TestBuildRedirectError_EncodesHostileBytes_NoXSS,
          TestBuildRedirectError_StripsControlBytes, and
          TestWriteFormPost_EscapesRedirectAndJWT.
  - id: CVE-2026-44681
    severity: P1
    source: https://github.com/advisories/GHSA-r95x-qfjj-fjj2
    threat: T-11
    status: covered
    notes: |
      Authlib (alias GHSA-r95x-qfjj-fjj2): a malformed authorization
      request that selected the implicit / hybrid grant while omitting
      the openid scope was redirected to a fully attacker-chosen URL —
      an open redirect on the error path. Structural property: an error
      response may only be redirected to an already-validated redirect
      URI; an unresolved / unvalidated redirect target must render a
      first-party error page, never a redirect.
      TestAuthorize_RejectsBadRedirectURIWithJSON pins the negative leg
      (unvalidated redirect_uri → first-party 400 JSON, no redirect);
      TestAuthorize_RejectsBadResponseTypeWithRedirect pins the positive
      leg (a validated redirect_uri does carry the error back). Implicit
      / hybrid response types are additionally rejected outright
      (CVE-2024-10318, T-02), so the specific Authlib vector cannot arise.
      CVE-2026-41479 is the same defect reached through a second door —
      an unsupported response_type raised its error with the raw
      redirect_uri before the client and its registration were resolved
      — and the same two tests pin it, so it carries no row of its own.

  # --- T-12 Session fixation ---------------------------------------
  - id: GHSA-xhpr-465j-7p9q
    severity: P1
    source: https://github.com/keycloak/keycloak/security/advisories/GHSA-xhpr-465j-7p9q
    threat: T-12
    status: covered
    notes: |
      Keycloak first-login phishing via email verification step. The
      session manager exposes a Rotate primitive that issues a fresh
      ID and invalidates the old, while preserving CreatedAt so an
      attacker cannot extend lifetime by triggering rotation.
      TestManager_Rotate_IssuesFreshIDPreservingChooserGroup +
      TestManager_Rotate_PreservesCreatedAt pin both halves.

  - id: CVE-2026-7507
    severity: P1
    source: https://nvd.nist.gov/vuln/detail/CVE-2026-7507
    threat: T-12
    status: covered
    notes: |
      Keycloak OIDC-login session fixation leading to account takeover:
      the session was not rebound across the privilege transition, so a
      pre-seeded session ID survived login. Where GHSA-xhpr-465j-7p9q is
      pinned at the Manager.Rotate primitive, this is pinned at the wire
      boundary: TestInteractionPost_RotatesSessionIDAfterFreshAuthn
      drives a full authorize → interaction → terminate flow with a
      planted session cookie and asserts the terminal response issues a
      fresh session ID and deletes the old record whenever a fresh authn
      factor ran. ensureSession rotates on same-subject re-auth; a
      consent-only / chooser-only chain intentionally does not.
  - id: CVE-2025-68158
    severity: P2
    source: https://github.com/advisories/GHSA-fg6f-75jq-6523
    threat: T-12
    status: covered
    notes: |
      Authlib stored the in-flight authorization state in a shared cache
      keyed only by the state value, so the callback handler resolved it
      without checking that the browser presenting it was the one that
      started the flow. An attacker who began a flow and got the victim
      to open the callback had the victim's account linked to the
      attacker's identity in one click — no credential theft, just a
      link. The upstream defect is relying-party side; the OP owns the
      identical shape, because its interaction identifier also travels
      in the URL and is therefore linkable and forwardable.
      Structural property: the identifier is half of a pair, and the
      other half is the cookie the OP issued to one user agent.
      TestInteraction_ResolvesOnlyForTheBrowserThatStartedIt starts two
      independent flows, confirms each browser reaches its own (so the
      refusals are not a handler that resolves nothing), then crosses
      the cookie against the other flow's identifier in both directions
      and drops the cookie entirely, requiring 404 each time.

  # --- T-13 Confused deputy ----------------------------------------
  - id: CVE-2026-1486
    severity: P2
    source: https://nvd.nist.gov/vuln/detail/CVE-2026-1486
    threat: T-13
    status: covered
    notes: |
      Keycloak jwt-authorization-grant issued tokens without checking
      that the backing identity provider was enabled — a token-issuance
      authorisation gate skipped.
      TestCustomGrant_NoTokenEscapesAFailedPrecondition pins the gate on
      both sides of the handler: a client not registered for the grant
      type never reaches the handler at all, and a handler response that
      exceeds a registered limit is discarded whole. Neither rejection
      leaves an access, refresh, or ID token on the wire.
  - id: CVE-2026-9704
    severity: P1
    source: https://nvd.nist.gov/vuln/detail/CVE-2026-9704
    threat: T-13
    status: covered
    notes: |
      Keycloak's token-exchange endpoint dropped the subject_token
      parameter under some request shapes instead of rejecting the
      request, and the exchange then proceeded on the caller's own
      authority — so a client with no delegation at all obtained a token
      for an identity it could not name. The downstream gates do not
      catch this: scope and audience are checked as subsets of the
      subject token, and a request with no subject is trivially within
      its own limits.
      TestTokenExchange_DelegationParametersAreNeverSilentlyDropped
      drives the shapes where a parser's convenience would manufacture a
      well-formed request — absent, empty, repeated, and repeated with
      one empty occurrence — for both subject_token and
      subject_token_type, and asserts each is refused with no token of
      any kind on the wire. A control exchange succeeds first, so the
      refusals are not the fixture failing.

  # --- T-15 TOTP / RFC 6238 ----------------------------------------
  - id: GHSA-9r3w-4j8q-pw98
    severity: P0
    source: https://github.com/calcom/cal.com/security/advisories/GHSA-9r3w-4j8q-pw98
    threat: T-15
    status: covered
    notes: |
      cal.com TOTP bypass — providing a TOTP code skipped the password
      check entirely. Two-layer mitigation:
        - authn.TestLoginFlowTOTPRequiresPrimary pins the orchestrator
          invariant (TOTP step is unreachable until Primary completes).
        - totp.TestAuthenticator_BeginRequiresSubject /
          TestAuthenticator_ContinueRequiresSubject pin the adapter-
          side gate (TOTP rejects empty Subject).
  - id: GHSA-5jfq-x6xp-7rw2
    severity: P0
    source: https://github.com/keycloak/keycloak/security/advisories/GHSA-5jfq-x6xp-7rw2
    threat: T-15
    status: covered
    notes: |
      Keycloak two-factor authentication bypass. Same structural
      property as 9r3w — covered by the same two-layer mitigation
      (orchestrator step ordering + adapter subject-required gate).
  - id: CVE-2026-33473
    severity: P1
    source: https://github.com/go-vikunja/vikunja/security/advisories/GHSA-p747-qc5p-773r
    threat: T-15
    status: covered
    notes: |
      Vikunja verified a TOTP code against the current time step and
      stopped there, so the same code authenticated repeatedly for the
      rest of its 30-second window — anyone who observed one code (over
      a shoulder, in a phished form, in a log) could reuse it. Same
      class as CVE-2025-43798 (Liferay) and CVE-2021-43177
      (devise-two-factor). Structural property: acceptance records the
      step on the TOTP record, and any later submission resolving to
      that step or earlier is refused.
      TestVerify_ReplaysSameStepRejected pins all three legs — the code
      is accepted once, the immediate replay at the same instant fails
      as a wrong code, and a code computed at a strictly later step
      still succeeds. The replay must also leave the brute-force counter
      untouched, since otherwise a captured code becomes a lockout
      primitive against the account it was captured from.
  - id: CVE-2025-43798
    severity: P1
    source: https://nvd.nist.gov/vuln/detail/CVE-2025-43798
    threat: T-15
    status: covered
    notes: |
      Liferay DXP — a TOTP was usable multiple times during its validity
      period. Same defect and same mitigation as CVE-2026-33473; pinned
      by TestVerify_ReplaysSameStepRejected.
  - id: CVE-2021-43177
    severity: P1
    source: https://nvd.nist.gov/vuln/detail/CVE-2021-43177
    threat: T-15
    status: covered
    notes: |
      devise-two-factor — an incomplete fix for CVE-2015-7225 left a
      code redeemable for one trailing interval. The step guard is a
      floor rather than an equality test, so a code resolving to the
      last accepted step or any earlier one is refused; pinned by
      TestVerify_ReplaysSameStepRejected.

  # --- T-16 passkey / WebAuthn -------------------------------------
  - id: CVE-2026-28787
    severity: P1
    source: https://nvd.nist.gov/vuln/detail/CVE-2026-28787
    threat: T-16
    status: covered
    notes: |
      OneUptime WebAuthn: the ceremony challenge was returned to the
      client and accepted back at verification instead of being stored
      server-side, so a captured assertion replayed indefinitely (W3C
      WebAuthn L2 §13.4.3). The ceremony rides server-side interaction
      state, never a client-held value.
      TestAuthenticator_ChallengeComesOnlyFromServerHeldState pins that
      the client has no field through which to supply a challenge, that
      an absent ceremony is a hard failure rather than a fallback, and
      that every ceremony mints a fresh challenge;
      TestTickFactorScratchRoundtrip pins the single-use half — the
      ceremony slot is cleared as soon as the factor produces a result.
  - id: CVE-2026-6856
    severity: P1
    source: https://github.com/keycloak/keycloak/issues/48388
    threat: T-16
    status: covered
    notes: |
      Keycloak requested direct attestation but accepted a registration
      whose response carried packed self-attestation — no x5c chain, so
      nothing vouched for the AAGUID the authenticator claimed. The
      acceptable-AAGUID allowlist was then applied to an unauthenticated
      value, letting any software authenticator assert the AAGUID of a
      certified hardware key. Similar to CVE-2025-12150.
      The OP exhibited both halves of the class and both were fixed: the
      public PrimaryPasskey surface never requested attestation at all,
      so its allowlist matched a self-asserted AAGUID, and the verifier
      compared the AAGUID without regard to whether the attestation
      identified the model.
      TestAAGUIDAllowlistOnlyDecidesOnAVouchedAAGUID pins the repaired
      property in three parts: an allowlist is unconfigurable without
      direct conveyance, direct conveyance makes it configurable (the
      control), and only attestation types signed by a key outside the
      credential — basic_full, attca, anonca, ecdaa — may reach the
      comparison, with unrecognised types refused rather than admitted.

  # --- T-17 email-OTP -----------------------------------------------
  - id: CVE-2026-22751
    severity: P2
    source: https://spring.io/security/cve-2026-22751/
    threat: T-17
    status: covered
    notes: |
      Spring Security's JDBC one-time-token service read the token,
      decided it was unused, and deleted it in separate statements, so
      two requests arriving together both passed the check and both
      authenticated. Where CVE-2026-1035 is the same race on refresh
      tokens, this is the race on the single-use codes the OP delivers
      out of band — and mailed codes race in practice, because inboxes
      are shared and prefetched and users double-submit.
      Structural property: the check and the consume are one operation
      the store arbitrates, so the outcome of that operation is the
      verdict.
      TestContinueVerify_ConcurrentSubmissionsOfOneCodeYieldOneSuccess
      launches concurrent submissions of a single delivered code from a
      common start gate and requires exactly one to authenticate. The
      sequential half is pinned separately by
      TestContinueVerifyReplayRejected and TestVerify_RejectsConsumedCode.

  # --- T-19 DPoP (RFC 9449) ----------------------------------------
  - id: CVE-2026-54431
    severity: P1
    source: https://github.com/advisories/GHSA-3pf6-g4x4-jm46
    threat: T-19
    status: covered
    notes: |
      liboauth2 (alias GHSA-3pf6-g4x4-jm46): the DPoP verifier accepted
      a proof whose jwk header embedded private key material, violating
      RFC 9449 §4.3 step 7 ("reject such a proof"). Structural property:
      the DPoP proof's embedded jwk must be a public key only — any
      private parameter is a hard reject before signature verification.
      parseProof gates on !jwk.IsPublic(); TestVerify_RejectsPrivateKey-
      InJWKHeader pins it by minting a proof whose jwk header carries the
      private EC "d" component and asserting ErrProofMalformed.

  # --- T-21 mTLS bound token / x5t#S256 ----------------------------
  - id: CVE-2026-22747
    severity: P1
    source: https://spring.io/security/cve-2026-22747/
    threat: T-21
    status: covered
    notes: |
      Spring Security derived the username from an X.509 client
      certificate by pattern-matching the subject DN's string form, and
      certain malformed CN values — escapes and separators that survive
      the round trip to text — made the extractor read the wrong field,
      so a certificate the truststore accepts impersonates another
      subject. CVE-2026-47838 is the continuation covering the second,
      deprecated extractor. Structural property: a client is identified
      by the DER the issuer signed (RawSubject), not by the RFC 4514
      rendering, so an attribute value chosen to look like additional
      structure once printed does not become that structure.
      TestVerifyTLSClientAuth_SubjectDN_CraftedNameDoesNotCollideOnceRendered
      drives certificates whose CN or O literally contains the DN
      separators (plain, double-escaped, and whitespace-padded) against
      a matcher for the identity they render as, with a control proving
      the genuine DN still authenticates.
      TestVerifyTLSClientAuth_SubjectDN_MultiValuedMatcherDoesNotFlatten
      covers the multi-valued-RDN spelling of the same idea.
  - id: CVE-2026-47838
    severity: P1
    source: https://spring.io/security/cve-2026-47838/
    threat: T-21
    status: covered
    notes: |
      The continuation of CVE-2026-22747, covering the same DN-parsing
      defect in the second (deprecated) extractor that the original fix
      missed. The OP has one DN comparison rather than two, so the same
      test covers it:
      TestVerifyTLSClientAuth_SubjectDN_CraftedNameDoesNotCollideOnceRendered.

  # --- T-22 CIBA / device_code -------------------------------------
  - id: CVE-2026-9798
    severity: P2
    source: https://nvd.nist.gov/vuln/detail/CVE-2026-9798
    threat: T-22
    status: covered
    notes: |
      Keycloak CIBA authentication flow bypassed the brute-force account
      lockout that the interactive login enforces — an alternate authn
      path that received a separate brute-force budget. Structural
      property: every OP-side credential factor consults one shared
      per-subject cross-factor lockout.Counter with no notion of factor
      type, so no flow obtains a fresh budget.
      TestCrossFactorPivotTriggersLockout pins it (failures attributed to
      different factors accumulate against one counter to the lock
      threshold). CIBA user authentication in this library is out-of-band
      on the authentication device, so it adds no separate OP-side
      credential-verification path to bypass; CIBA's own abuse surface is
      polling, gated separately by ciba.poll_abuse.lockout.

  # --- T-23 Dynamic Client Registration / RAT ----------------------
  - id: CVE-2026-22752
    severity: P0
    source: https://spring.io/security/cve-2026-22752/
    threat: T-23
    status: covered
    notes: |
      Spring Authorization Server's DCR endpoints accepted client
      metadata fields without validating them (CVSS 9.6), reachable by
      anyone holding a valid initial access token — no administrative
      privilege. Depending on the field, the outcome was stored XSS,
      privilege escalation, or SSRF, because the registration request
      was treated as configuration rather than as attacker-controlled
      input. Structural property: registration is the one surface where
      the allowlist entry itself is supplied by an untrusted party, so
      each member earns its way into storage on its own contract.
      TestDCR_ClientMetadataIsTreatedAsAttackerInput covers the members
      the OP later dereferences (every URI-valued field against
      javascript / data / file / ftp / http / relative / userinfo
      shapes), the members that would widen the client's own authority
      (grant and response types, scope beyond the initial access token,
      auth method, signing alg), and the response contract — undefined
      members do not survive, and the registrant cannot choose its own
      registration access token.
      Display strings are free text by design, so their containment is
      at the render rather than the write:
      TestHTMLDriver_ClientDisplayNameCannotBecomeMarkup pins that a
      registered client_name cannot become markup on the consent screen.

