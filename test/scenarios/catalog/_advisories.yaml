  - id: CVE-2026-28498
    severity: P1
    source: https://nvd.nist.gov/vuln/detail/CVE-2026-28498
    threat: T-06
    status: covered
    notes: |
      Authlib (alias GHSA-m344-f55w-2m6j) at_hash / c_hash verification
      fail-opened: the internal hash check returned true when the alg
      header was unknown / unsupported instead of rejecting. Our JOSE
      allow-list {RS256, PS256, ES256, EdDSA} is closed at two layers
      (the parser's permitted-algorithm list and ParseAlgorithm), so an
      out-of-list alg is a hard reject, never a silent pass.
      TestParseSigned_RejectsUnsupportedRegisteredAlg_NoFailOpen pins it
      with cryptographically valid ES384 / RS384 / PS384 tokens (real
      signatures over a sibling algorithm — the only reason to reject is
      the algorithm policy). TestAlgorithm_IsAllowed pins the helper-
      level default-false that the fail-open inverts.

  - id: CVE-2026-29000
    severity: P0
    source: https://nvd.nist.gov/vuln/detail/CVE-2026-29000
    threat: T-06
    status: covered
    notes: |
      pac4j-jwt (CVSS 10.0): a JWE whose decrypted payload is an
      unsigned/plain JWT (alg=none inner) was treated as authenticated,
      letting an attacker holding only the recipient's public encryption
      key forge a request. Structural property: decryption confers
      confidentiality, never authentication — every decrypted plaintext
      is routed through jar.Parse -> jose.ParseSigned, whose closed
      signing-alg allow-list rejects "none" before any claim is trusted.
      TestVerify_RejectsJWEWrappedUnsignedJWT pins it by encrypting an
      alg=none inner JWT into a JWE and asserting the JAR verifier
      rejects it (ErrParse).

