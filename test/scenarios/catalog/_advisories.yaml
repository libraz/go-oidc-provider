  - id: CVE-2026-9689
    severity: P1
    source: https://nvd.nist.gov/vuln/detail/CVE-2026-9689
    threat: T-01
    status: covered
    notes: |
      Keycloak HTTP parameter pollution on the OIDC redirect URI let a
      duplicated request parameter be reflected into the authorization
      response as a duplicated response parameter. Structural property:
      the authorize parser (singleValue / singleEntry) rejects any
      single-valued parameter that appears more than once with
      ErrDuplicateParameter, before any response is built — so a polluted
      redirect_uri can never reach the response builder.
      TestParseValues_DuplicateParameter pins it (identical, conflicting,
      redirect_uri, and repeated-scope cases).
  - id: CVE-2026-12985
    severity: P2
    source: https://nvd.nist.gov/vuln/detail/CVE-2026-12985
    threat: T-01
    status: covered
    notes: |
      Dynamic client registration accepted a redirect_uri shape that
      reads as a glob, a prefix, or a bare scheme rather than a literal
      string — a registration-time input-quality gap that later lets the
      exact-match gate at /authorize be satisfied by an attacker host.
      Same defect class as CVE-2026-32235 (Backstage), one layer
      earlier: the OP registers only literal URIs, and
      TestDCR_RejectsRedirectURIShapesThatBlurTheMatch pins that a
      registration whose value has no single unambiguous reading is
      refused outright.
      Aliases: CVE-2026-67333, CVE-2026-18211.

