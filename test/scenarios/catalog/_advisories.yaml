  - id: GHSA-xhpr-465j-7p9q
    severity: P1
    source: https://github.com/keycloak/keycloak/security/advisories/GHSA-xhpr-465j-7p9q
    threat: T-12
    status: covered
    notes: |
      Keycloak first-login phishing via email verification step. The
      session manager exposes a Rotate primitive that issues a fresh
      ID and invalidates the old, while preserving CreatedAt so an
      attacker cannot extend lifetime by triggering rotation.
      TestManager_Rotate_IssuesFreshIDPreservingChooserGroup +
      TestManager_Rotate_PreservesCreatedAt pin both halves.

  - id: CVE-2026-7507
    severity: P1
    source: https://nvd.nist.gov/vuln/detail/CVE-2026-7507
    threat: T-12
    status: covered
    notes: |
      Keycloak OIDC-login session fixation leading to account takeover:
      the session was not rebound across the privilege transition, so a
      pre-seeded session ID survived login. Where GHSA-xhpr-465j-7p9q is
      pinned at the Manager.Rotate primitive, this is pinned at the wire
      boundary: TestInteractionPost_RotatesSessionIDAfterFreshAuthn
      drives a full authorize → interaction → terminate flow with a
      planted session cookie and asserts the terminal response issues a
      fresh session ID and deletes the old record whenever a fresh authn
      factor ran. ensureSession rotates on same-subject re-auth; a
      consent-only / chooser-only chain intentionally does not.
  - id: CVE-2025-68158
    severity: P2
    source: https://github.com/advisories/GHSA-fg6f-75jq-6523
    threat: T-12
    status: covered
    notes: |
      Authlib stored the in-flight authorization state in a shared cache
      keyed only by the state value, so the callback handler resolved it
      without checking that the browser presenting it was the one that
      started the flow. An attacker who began a flow and got the victim
      to open the callback had the victim's account linked to the
      attacker's identity in one click — no credential theft, just a
      link. The upstream defect is relying-party side; the OP owns the
      identical shape, because its interaction identifier also travels
      in the URL and is therefore linkable and forwardable.
      Structural property: the identifier is half of a pair, and the
      other half is the cookie the OP issued to one user agent.
      TestInteraction_ResolvesOnlyForTheBrowserThatStartedIt starts two
      independent flows, confirms each browser reaches its own (so the
      refusals are not a handler that resolves nothing), then crosses
      the cookie against the other flow's identifier in both directions
      and drops the cookie entirely, requiring 404 each time.
  - id: CVE-2026-97176
    severity: P1
    source: https://nvd.nist.gov/vuln/detail/CVE-2026-97176
    threat: T-12
    status: covered
    notes: |
      An acr step-up requirement was satisfied by a session that had
      only reached a weaker authentication level, letting a stale or
      reused session stand in for the stronger factor a policy demanded.
      TestEndToEnd_ACRStepUp pins the step-up transition itself (a
      request for a stronger acr than the session holds forces a fresh
      interaction rather than being served silently);
      TestEndToEnd_SessionReuseReportsTheLevelReached pins that every
      later response served from that session reports the level it
      actually reached, never a stronger string an earlier request drew.
      Aliases: GHSA-hp74-gm6m-2qm5, CVE-2026-55377, CVE-2026-85056.

  # --- T-13 Confused deputy ----------------------------------------
  - id: CVE-2026-1486
    severity: P2
    source: https://nvd.nist.gov/vuln/detail/CVE-2026-1486
    threat: T-13
    status: covered
    notes: |
      Keycloak jwt-authorization-grant issued tokens without checking
      that the backing identity provider was enabled — a token-issuance
      authorisation gate skipped.
      TestCustomGrant_NoTokenEscapesAFailedPrecondition pins the gate on
      both sides of the handler: a client not registered for the grant
      type never reaches the handler at all, and a handler response that
      exceeds a registered limit is discarded whole. Neither rejection
      leaves an access, refresh, or ID token on the wire.
  - id: CVE-2026-9704
    severity: P1
    source: https://nvd.nist.gov/vuln/detail/CVE-2026-9704
    threat: T-13
    status: covered
    notes: |
      Keycloak's token-exchange endpoint dropped the subject_token
      parameter under some request shapes instead of rejecting the
      request, and the exchange then proceeded on the caller's own
      authority — so a client with no delegation at all obtained a token
      for an identity it could not name. The downstream gates do not
      catch this: scope and audience are checked as subsets of the
      subject token, and a request with no subject is trivially within
      its own limits.
      TestTokenExchange_DelegationParametersAreNeverSilentlyDropped
      drives the shapes where a parser's convenience would manufacture a
      well-formed request — absent, empty, repeated, and repeated with
      one empty occurrence — for both subject_token and
      subject_token_type, and asserts each is refused with no token of
      any kind on the wire. A control exchange succeeds first, so the
      refusals are not the fixture failing.
  - id: CVE-2026-47426
