  - id: CVE-2026-28498
    severity: P1
    source: https://nvd.nist.gov/vuln/detail/CVE-2026-28498
    threat: T-06
    status: covered
    notes: |
      Authlib (alias GHSA-m344-f55w-2m6j) at_hash / c_hash verification
      fail-opened: the internal hash check returned true when the alg
      header was unknown / unsupported instead of rejecting. Our JOSE
      allow-list {RS256, PS256, ES256, EdDSA} is closed at two layers
      (the parser's permitted-algorithm list and ParseAlgorithm), so an
      out-of-list alg is a hard reject, never a silent pass.
      TestParseSigned_RejectsUnsupportedRegisteredAlg_NoFailOpen pins it
      with cryptographically valid ES384 / RS384 / PS384 tokens (real
      signatures over a sibling algorithm — the only reason to reject is
      the algorithm policy). TestAlgorithm_IsAllowed pins the helper-
      level default-false that the fail-open inverts.

  - id: CVE-2026-29000
    severity: P0
    source: https://nvd.nist.gov/vuln/detail/CVE-2026-29000
    threat: T-06
    status: covered
    notes: |
      pac4j-jwt (CVSS 10.0): a JWE whose decrypted payload is an
      unsigned/plain JWT (alg=none inner) was treated as authenticated,
      letting an attacker holding only the recipient's public encryption
      key forge a request. Structural property: decryption confers
      confidentiality, never authentication — every decrypted plaintext
      is routed through jar.Parse -> jose.ParseSigned, whose closed
      signing-alg allow-list rejects "none" before any claim is trusted.
      TestVerify_RejectsJWEWrappedUnsignedJWT pins it by encrypting an
      alg=none inner JWT into a JWE and asserting the JAR verifier
      rejects it (ErrParse).
  - id: CVE-2026-27962
    severity: P0
    source: https://github.com/advisories/GHSA-wvwj-cvrp-7pv5
    threat: T-06
    status: covered
    notes: |
      Authlib JWS JWK header injection (CVSS 9.1): with no key supplied
      by the application, deserialization fell back to the key embedded
      in the token's own "jwk" header, so an attacker signed with their
      own private key, published the matching public half in the header,
      and was accepted. RFC 7515 requires the verification key to come
      from application context. The 2026 restatement of CVE-2018-0114.
      Two layers pin it. TestParseSigned_HeaderInjection_NeverFetches
      covers the generic parse path (no key reference in a header is
      ever resolved or fetched).
      TestPrivateKeyJWTVerifier_KeySelectionIgnoresTheAssertionsOwnHeader
      covers the surface where an embedded key would be most tempting to
      honour: a client assertion carrying a jwk header is still verified
      against the keyset registered to the client being authenticated.
      DPoP is the one place an embedded jwk is honoured at all, by
      RFC 9449 §4.3 design, and it is constrained separately — the proof
      key must be public (CVE-2026-54431) and the token's cnf must match
      its thumbprint, so the embedded key authenticates nothing on its
      own.
  - id: CVE-2026-48524
    severity: P2
    source: https://github.com/advisories/GHSA-fhv5-28vv-h8m8
    threat: T-06
    status: covered
    notes: |
      PyJWKClient re-fetched the JWKS endpoint whenever a token named a
      "kid" it had not cached, so an attacker minting tokens with random
      kid values drove unbounded outbound requests at the client's JWKS
      host. Structural property: the forced-refresh path is throttled per
      URL and never consults the kid, so however many distinct unknown
      kids arrive inside one interval they cost a single round-trip.
      TestFetchFresh_BypassesFreshCacheThenThrottles pins the three
      transitions — a forced refetch does bypass a still-fresh cache
      (the rotation case the path exists for), a second one inside the
      window does not reach the network, and one past the window does
      again. TestJWKSCache_SingleflightCollapsesConcurrentFetches covers
      the concurrent shape of the same amplification.
  - id: CVE-2026-48525
    severity: P2
    source: https://github.com/advisories/GHSA-w7vc-732c-9m39
    threat: T-06
    status: covered
    notes: |
      PyJWT base64url-decoded the payload segment before deciding
      whether it was needed, so an unauthenticated caller could spend
      the server's memory on a segment that verification would have
      discarded. Alias class: CVE-2025-61920 (Authlib, oversized JOSE
      segments). Structural property: the body cap is installed at read
      time by the OP itself, from one project-wide constant, so the
      refusal happens before any segment is decoded and does not depend
      on a proxy being in front.
      TestEndpoints_OversizedJWSIsRefusedBeforeItIsDecoded drives the
      two surfaces that take a JWS from an unauthenticated caller — the
      token endpoint's client_assertion and PAR's request object — with
      a well-shaped compact JWS whose middle segment alone exceeds the
      cap, and requires a 4xx rather than a 5xx (a 5xx would mean the OP
      tried and fell over, which is the outcome the bound exists to
      prevent). TestDecodeForm_RejectsOversizeBody pins the shared
      primitive.
  - id: CVE-2025-61920
    severity: P2
    source: https://github.com/advisories/GHSA-pq5p-34cr-23v9
    threat: T-06
    status: covered
    notes: |
      Authlib — denial of service via oversized JOSE segments. Same
      defect and same mitigation as CVE-2026-48525; pinned by
      TestEndpoints_OversizedJWSIsRefusedBeforeItIsDecoded.
  - id: CVE-2025-62706
    severity: P2
    source: https://github.com/advisories/GHSA-g7f3-828f-7h7m
    threat: T-06
    status: out-of-scope
    out_of_scope_reason: |
      Authlib JWE "zip":"DEF" decompression bomb — a small ciphertext
      inflated to an arbitrarily large plaintext during decryption. The
      OP never decrypts JWE: it has no encryption keyset, publishes no
      *_encryption_alg_values_supported, and refuses an encrypted
      request object rather than unwrapping it (the one JWE-shaped input
      it recognises is rejected at parse, pinned by
      TestVerify_RejectsJWEWrappedUnsignedJWT). There is no
      decompression path to bound.

