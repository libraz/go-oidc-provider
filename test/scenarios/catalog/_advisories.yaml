# yaml-language-server: $schema=./_advisories.schema.json
schema_version: 1

description: |
  Advisory queue paired with the `// Tracks: <id>` comments scattered
  through *_test.go files. The Go source is the source of truth for
  binding (which test asserts the structural mitigation); this file
  carries the queue metadata (severity, source URL, threat category,
  status) so we can audit "what did we promise to track, and is it
  still tracked?" without scraping doc tables.

  Drift gate (run by `scripts/scenario.sh advisories --check`):
   - status=covered      → MUST appear in at least one `// Tracks:` line.
   - status=tracking     → MUST NOT appear in source yet (it's queued).
   - status=out-of-scope → out_of_scope_reason required; presence in
                           source is allowed (a tag may explain why).
   - source IDs not in this file → orphan, fail the gate.

