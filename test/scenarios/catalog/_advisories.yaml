  # --- T-16 passkey / WebAuthn -------------------------------------
  - id: CVE-2026-28787
    severity: P1
    source: https://nvd.nist.gov/vuln/detail/CVE-2026-28787
    threat: T-16
    status: tracking
    notes: |
      OneUptime WebAuthn: the ceremony challenge was returned to the
      client and accepted back at verification instead of being stored
      server-side, so a captured assertion replayed indefinitely (W3C
      WebAuthn L2 §13.4.3). Structural property: the challenge must be
      minted and held server-side, bound to the session, and consumed
      single-use; a returned-by-client challenge is never trusted. Flip
      candidate: confirm the passkey authenticator's challenge store
      pins server-side single-use; add a replay test if a gap exists.

  # --- T-19 DPoP (RFC 9449) ----------------------------------------
  - id: CVE-2026-54431
    severity: P1
    source: https://github.com/advisories/GHSA-3pf6-g4x4-jm46
    threat: T-19
    status: covered
    notes: |
      liboauth2 (alias GHSA-3pf6-g4x4-jm46): the DPoP verifier accepted
      a proof whose jwk header embedded private key material, violating
      RFC 9449 §4.3 step 7 ("reject such a proof"). Structural property:
      the DPoP proof's embedded jwk must be a public key only — any
      private parameter is a hard reject before signature verification.
      parseProof gates on !jwk.IsPublic(); TestVerify_RejectsPrivateKey-
      InJWKHeader pins it by minting a proof whose jwk header carries the
      private EC "d" component and asserting ErrProofMalformed.

