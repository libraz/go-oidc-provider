    severity: P1
    source: https://nvd.nist.gov/vuln/detail/CVE-2026-9689
    threat: T-01
    status: covered
    notes: |
      Keycloak HTTP parameter pollution on the OIDC redirect URI let a
      duplicated request parameter be reflected into the authorization
      response as a duplicated response parameter. Structural property:
      the authorize parser (singleValue / singleEntry) rejects any
      single-valued parameter that appears more than once with
      ErrDuplicateParameter, before any response is built — so a polluted
      redirect_uri can never reach the response builder.
      TestParseValues_DuplicateParameter pins it (identical, conflicting,
      redirect_uri, and repeated-scope cases).

