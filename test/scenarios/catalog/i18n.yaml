# yaml-language-server: $schema=./schema.json
feature: i18n
prefix: I18N
title: Locale resolution and SPA exposure
specs:
  - OpenID Connect Core 1.0 §3.1.2.1 — ui_locales request parameter
  - OpenID Connect Discovery 1.0 §3 — ui_locales_supported metadata
  - OP locale resolution chain — library policy, stated in this file's description
  - OP prompt envelope contract — library policy, stated in this file's description

description: |
  The OP resolves the rendered locale through a five-step priority
  chain and adopts the first step whose signal matches a registered
  locale:

    1. the op.WithPreferredLocaleStore entry for the authenticated
       subject
    2. the RP's ui_locales request parameter
    3. the __Host-oidc_locale cookie
    4. the Accept-Language header
    5. op.WithDefaultLocale, defaulting to "en"

  The resolver never returns an unregistered tag. The same chain
  governs SPA prompts, e-mail templates and the SSR shell alike.

  The prompt envelope contract stamps the outcome onto every rendered
  interaction prompt: `locale` (the resolved tag), `ui_locales_hint`
  (the RP's ui_locales list, split but otherwise verbatim) and
  `locales_available` (the registered locales, equal to discovery's
  ui_locales_supported). All three are omitted when empty, so an SPA
  written against an OP without i18n keeps working. SPAs use the
  envelope to set <html lang> and pick bundles without re-running the
  chain.

  Rows pin both the chain ordering and the envelope shape; covered
  tests live under test/scenarios/i18n_test.go and the integration
  probe in internal/authorizeendpoint/interaction_locale_test.go.

rows:
  - id: I18N-001
    severity: P0
    spec: OP locale resolution chain (step 1 — PreferredLocaleStore)
    behaviour: |
      When op.WithPreferredLocaleStore returns a registered locale
      for the authenticated subject, the OP MUST resolve to that
      locale even when the request also carries ui_locales / cookie /
      Accept-Language with a different value.
    status: active

  - id: I18N-002
    severity: P0
    spec: OIDC Core §3.1.2.1 / OP locale resolution chain (step 2 — ui_locales)
    behaviour: |
      When the request carries an OIDC ui_locales parameter, the OP
      MUST honour the first registered locale in the list, ignoring
      cookie / Accept-Language. The list order is preserved.
    status: active

  - id: I18N-003
    severity: P0
    spec: OP locale resolution chain (step 3 — __Host-oidc_locale cookie)
    behaviour: |
      When the request carries the __Host-oidc_locale cookie and no
      ui_locales parameter, the OP MUST honour the cookie value
      ahead of Accept-Language and the default locale.
    status: active

  - id: I18N-004
    severity: P0
    spec: OP locale resolution chain (step 4 — Accept-Language)
    behaviour: |
      Accept-Language is consulted only when no higher-priority
      signal matches a registered locale. The OP MUST honour
      q-value-descending order and fall back to the language
      sub-tag when the full tag is unregistered (e.g. "ja-JP" hits
      a registered "ja" bundle).
    status: active

  - id: I18N-005
    severity: P0
    spec: OP locale resolution chain (step 5 — default locale)
    behaviour: |
      When no signal in the chain matches a registered locale, the
      OP MUST fall back to op.WithDefaultLocale (or "en" when the
      option is not supplied). The fall-back is deterministic — the
      resolver never returns an unregistered tag.
    status: active

  - id: I18N-010
    severity: P0
    spec: OP prompt envelope contract
    behaviour: |
      The interaction prompt envelope MUST carry the OP-resolved
      locale on the `locale` JSON field so SPAs can select bundles
      and stamp <html lang> without re-running the chain.
    status: active

  - id: I18N-011
    severity: P1
    spec: OP prompt envelope contract
    behaviour: |
      When the RP supplied a ui_locales parameter, the OP MUST echo
      the parsed list back to the SPA on `ui_locales_hint` in
      caller-supplied order so SPAs that override the resolver can
      consult the RP's hint directly.
    status: active

  - id: I18N-012
    severity: P1
    spec: OIDC Discovery §3 / OP prompt envelope contract
    behaviour: |
      The interaction prompt envelope MUST list every registered
      locale on `locales_available` so SPAs can build a language
      picker without re-fetching /.well-known/openid-configuration.
      The list MUST equal the discovery `ui_locales_supported`
      value.
    status: active

  - id: I18N-013
    severity: P1
    spec: OP prompt envelope contract
    behaviour: |
      The locale envelope fields (`locale` / `ui_locales_hint` /
      `locales_available`) MUST be omitted from the wire when the
      OP was constructed without a resolver, preserving backward
      compatibility with SPAs that pre-date the fields.
    status: active

  - id: I18N-020
    severity: P1
    spec: OP locale switch UX — SPA-selected locale persisted in __Host-oidc_locale
    behaviour: |
      The cookie write endpoint POST /oidc/session/locale persists
      the SPA-selected locale into the __Host-oidc_locale cookie
      (1y MaxAge, Lax, __Host- prefix) so subsequent authorize hits
      pick it up at chain step 3.
    status: out-of-scope
    out_of_scope_reason: "Cookie write endpoint POST /oidc/session/locale is deferred to a follow-up plan — the catalog row's own notes record this. v1.0's locale resolver reads __Host-oidc_locale at chain step 3 (covered by I18N-003) but the OP exposes no public route to write it; SPAs that want to persist a user-selected locale wire their own POST endpoint that sets the cookie with the matching __Host- prefix attributes. The wire seam to assert ('OP-supplied write route persists with 1y MaxAge / Lax / __Host-') does not exist in v1.0."
    notes: deferred to follow-up plan; resolver currently reads the cookie but no write endpoint exists.

  - id: I18N-030
    severity: P1
    spec: OP bundle exposure — SPA fetches the OP's own translations
    behaviour: |
      The OP serves resolved locale bundle JSON at GET /oidc/i18n/{locale}
      so SPAs can fetch the same translations the OP would render
      server-side, avoiding two-tier translation drift.
    status: out-of-scope
    out_of_scope_reason: "Bundle JSON endpoint GET /oidc/i18n/{locale} is deferred to a follow-up plan — the catalog row's own notes record this. v1.0 ships locale resolution and stamps the resolved tag on the prompt envelope (I18N-010..013) but does not expose a public bundle-fetch route; embedder SPAs ship their own translation bundles in the meantime. There is no v1.0 wire seam to assert against."
    notes: deferred to follow-up plan; embedder SPAs ship their own bundles in the meantime.
