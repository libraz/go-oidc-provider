# yaml-language-server: $schema=./schema.json
feature: interaction
prefix: ITX
title: Interaction state machine and /auth/resume
specs:
  - OIDC Core 1.0 §3.1.2.1 (`prompt`)
  - OIDC Core 1.0 §3.1.2.6 (Authentication Error Response)
  - OIDC Core 1.0 §3.2.1
  - OIDC Core 1.0 §15 (Implementation Considerations — interaction)
  - OIDC RP-Initiated Logout 1.0
  - RFC 6749 §4.1, §4.1.2.1 (`access_denied`)
  - RFC 9700 (BCP 240) §4 (CSRF / session integrity)

description: |
  End-user interaction (login / consent / custom prompts) and the
  `/auth/resume` continuation. Covers cookie-bound interaction
  sessions, default `prompt=login` synthesis, consent flow, abort,
  resume cookies and remember semantics, custom interaction failures,
  and requestable / unrequestable extension prompts.

rows:
  - id: ITX-001
    severity: P0
    spec: OIDC Core §15
    behaviour: |
      A GET against an interaction URL without the `_interaction`
      cookie MUST return 400 with the `SessionNotFound` error envelope
      `{name: 'SessionNotFound', error_description: 'interaction
      session id cookie not found'}`.
    status: out-of-scope
    out_of_scope_reason: "Panva-specific 'SessionNotFound' JSON envelope (name + error_description shape) is not v1.0 wire. v1.0's serveInteractionGet (internal/authorizeendpoint/interaction.go) returns 404 when the __Host-oidc_interaction cookie is missing — surfacing 'session known to OP' as 400 vs 404 would let an unauthenticated client probe live UIDs. The 404 closure is the correct v1.0 default; ITX-040 covers the user-facing cancel observable instead."

  - id: ITX-002
    severity: P0
    spec: OIDC Core §15
    behaviour: |
      A GET against an interaction URL whose `_interaction` cookie is
      present but the corresponding interaction record was deleted
      MUST return 400 `SessionNotFound` with description
      "interaction session not found".
    status: out-of-scope
    out_of_scope_reason: "Same panva 'SessionNotFound' envelope as ITX-001. v1.0 returns 404 (http.NotFound) when verifyInteractionCookie fails or loadInteraction returns store.ErrNotFound — the wire deliberately collapses 'cookie missing' and 'record gone' into one 404 to avoid the same UID-existence oracle ITX-001 documents."

  - id: ITX-010
    severity: P0
    spec: OIDC Core §3.1.2.1
    behaviour: |
      An unauthenticated user hitting
      `/auth?response_type=code&scope=openid` MUST be 303 redirected
      to the interaction URL. The rendered HTML form has
      `action="{issuer}{interaction_url}"`, a hidden input
      `prompt=login`, and a Sign-in label.
    status: out-of-scope
    out_of_scope_reason: "Panva-specific HTML form rendering with hidden 'prompt=login' input and Sign-in label. v1.0's default Driver (interaction.JSONDriver) returns a JSON Prompt envelope ({type, data, inputs[], state_ref, csrf_token}); embedders ship their own SSR/HTML driver via op.WithInteraction. The 303-to-interaction-URL hop is observable and verified end-to-end by ITX-012 (RunCodeFlow); the panva HTML form shape is not v1.0 wire."

  - id: ITX-011
    severity: P0
    spec: OWASP XSS guidance
    behaviour: |
      Authorization request parameters echoed into the debug section
      of the rendered interaction page MUST be HTML-escaped. For
      example `state=<img src=x onerror=alert(1)>` MUST appear as
      `&lt;img src=x ...&gt;` and never as raw markup.
    status: out-of-scope
    out_of_scope_reason: "Panva renders RP-supplied authorize parameters (state, login_hint, etc.) into a 'debug section' of the SSR interaction page; OWASP XSS guidance applies because the values are HTML-escaped. v1.0's default JSONDriver does not echo authorize parameters into the prompt envelope — the SPA reads its own URL/cookie state, and the orchestrator only stamps Prompt.Type / Inputs / StateRef / CSRFToken / Locale. Without an HTML echo surface there is nothing to XSS-escape; embedders that ship an SSR driver own escaping in their template layer."

  - id: ITX-012
    severity: P0
    spec: OIDC Core §15
    behaviour: |
      Posting `prompt=login` plus `login=<accountId>` to the
      interaction URL MUST 303 back to the auth URL. Following that
      auth URL MUST 303 to the client redirect URI.
    status: active

  - id: ITX-013
    severity: P0
    spec: input contract
    behaviour: |
      Posting `login=""` (empty string) MUST flow through to auth
      resume, where resume MUST surface `server_error` with
      `TypeError "accountId must be a non-empty string, got: string"`.
      Defensive validation lives in the OP, not in the embedder UI.
    status: out-of-scope
    out_of_scope_reason: "Panva surfaces a literal 'TypeError accountId must be a non-empty string, got: string' through the resume flow when login.accountId is empty. v1.0 has no /auth/resume endpoint and no panva 'login.accountId' field — testkit.SubjectAuthenticator.Continue returns ErrSubjectMissing on empty subject, which the orchestrator translates into a generic 500 server_error JSON envelope ('orchestrator failed'); the panva TypeError text is not part of v1.0's error catalog."

  - id: ITX-020
    severity: P0
    spec: OIDC Core §3.1.2.1
    behaviour: |
      An authenticated user with `prompt=consent` MUST be shown a
      consent form whose hidden input is `prompt=consent` and whose
      submit label reads Authorize.
    status: out-of-scope
    out_of_scope_reason: "Panva renders an HTML consent form with hidden 'prompt=consent' input and Authorize submit label. v1.0's default JSONDriver returns a JSON envelope {type: 'consent.scope', data: {Scopes: [...]}, inputs: [{name: approved_scopes, ...}], state_ref, csrf_token}; the wire-observable consent-completion path is bound by ITX-023 (RunCodeFlow drives consent approval and asserts the final RP redirect carries code+state). The panva HTML form shape does not exist in v1.0."

  - id: ITX-021
    severity: P0
    spec: OIDC Core §15
    behaviour: |
      If the underlying authentication session was destroyed between
      consent render and POST, the OP MUST return 400 `text/html`
      with a body matching `/session not found/`.
    status: out-of-scope
    out_of_scope_reason: "Panva-specific 'session destroyed between consent render and POST' failure path that returns 400 text/html matching /session not found/. v1.0's interaction lifecycle does not expose a separate render-vs-POST authentication-session check — the session is established at terminateInteraction, not before consent POST. The /interaction record gone branch returns 404 (ITX-002 OOS); 'authentication session destroyed mid-flow' is a panva render-then-revoke wire that v1.0 does not have."

  - id: ITX-022
    severity: P0
    spec: OIDC Core §15 / RFC 9700
    behaviour: |
      If the authentication session's `accountId` (principal) changed
      between consent render and POST, the OP MUST return 400
      `text/html` matching `/session principal changed/`.
    status: out-of-scope
    out_of_scope_reason: "Panva 'session principal changed between consent render and POST' surface returning /session principal changed/ HTML. v1.0 has no separate consent-render vs consent-POST principal-comparison step — the orchestrator does not load and re-validate the authentication session subject between those two interaction ticks. The principal-mismatch path that does exist (chooser-driven session switch) is wired through interaction.chooser PromptData and bound under chooser scenarios, not this panva mid-flow check."

  - id: ITX-023
    severity: P0
    spec: OIDC Core §15
    behaviour: |
      A successful consent POST MUST 303 back to the auth URL, which
      then completes the flow with a 303 to the client redirect URI.
    status: active

  - id: ITX-024
    severity: P0
    spec: OIDC Core §15 / RFC 9700
    behaviour: |
      After a valid consent POST, if the authentication session was
      destroyed before resume executes, the OP MUST return 400
      `text/html` matching
      `/interaction session and authentication session mismatch/`.
    status: out-of-scope
    out_of_scope_reason: "Panva 'interaction session and authentication session mismatch' text/html error after consent POST when the auth session is destroyed before resume runs. v1.0 has no /auth/resume endpoint — terminateInteraction (internal/authorizeendpoint/interaction.go) runs in the same handler as the consent POST, calling sessions.Manager.Issue/Switch/AddAccount synchronously. There is no resume gap and no panva 'mismatch' error string."

  - id: ITX-025
    severity: P0
    spec: OIDC Core §15
    behaviour: |
      After a valid consent POST, if a *new* login (different
      session) happens before resume, the OP MUST return the same
      `interaction session and authentication session mismatch`
      error as ITX-024.
    status: out-of-scope
    out_of_scope_reason: "Same panva resume-mismatch wire as ITX-024 but with a fresh login between consent POST and /auth/resume. v1.0 has no resume endpoint and runs terminateInteraction synchronously; a parallel new login cannot interleave between consent POST and code emission on the same handler. The 'mismatch' text is not part of v1.0's error catalog."

  - id: ITX-030
    severity: P1
    spec: OIDC Core §3.1.2.1 / extension policy
    behaviour: |
      If a persisted Interaction record carries a `prompt.name` that
      is not registered (e.g. tampering), a GET against the
      interaction URL MUST return 501 Not Implemented.
    status: pending

  - id: ITX-040
    severity: P0
    spec: RFC 6749 §4.1.2.1
    behaviour: |
      A GET against `{interaction_url}/abort` MUST 303 redirect; the
      subsequent return to `/auth/...` resumes with
      `error=access_denied`,
      `error_description="End-User aborted interaction"`, and the
      original `state` round-tripped.
    status: active

  - id: ITX-050
    severity: P0
    spec: OIDC Core §15
    behaviour: |
      `/auth/resume` without the `_interaction_resume` cookie MUST
      return 400 with a rendered error matching
      `/authorization request has expired/`.
    status: out-of-scope
    out_of_scope_reason: "Panva /auth/resume endpoint with _interaction_resume cookie. v1.0 has no resume route — the orchestrator condenses the consent/login POST and redirect-back-to-RP into one terminateInteraction call. Without a /auth/resume there is no 'authorization request has expired' rendered error and no _interaction_resume cookie. The closest v1.0 surface (interaction record gone) returns 404 (ITX-002 OOS)."

  - id: ITX-051
    severity: P0
    spec: OIDC Core §15
    behaviour: |
      `/auth/resume` with the `_interaction_resume` cookie present
      but no resolvable Interaction record MUST return 400 with a
      rendered error matching `/interaction session not found/`.
    status: out-of-scope
    out_of_scope_reason: "Same panva /auth/resume + _interaction_resume cookie shape as ITX-050. v1.0 has no resume endpoint; the rendered 'interaction session not found' text does not exist in v1.0's error catalog. Missing-record on the /interaction surface returns 404 (covered by ITX-002 OOS)."

  - id: ITX-052
    severity: P0
    spec: OIDC Core §15
    behaviour: |
      A newly established login result with no `remember` flag MUST
      yield a permanent session cookie (the `expires` attribute is
      set). `getSession()` MUST be non-`transient`.
    status: out-of-scope
    out_of_scope_reason: "Panva-specific 'remember' flag on the login result that toggles permanent vs transient session cookie semantics. v1.0 has no 'remember' input — sessions.Manager.Issue always emits a __Host-oidc_session cookie with the configured TTL, and the embedder's interaction.Driver does not negotiate remember-me at the orchestrator boundary. Add-remember-flag would require a public Authenticator.RememberMe() extension which is not in v1.0's API."

  - id: ITX-053
    severity: P0
    spec: OIDC Core §15
    behaviour: |
      A login result with `remember: true` MUST yield the same
      permanent cookie behaviour as ITX-052.
    status: out-of-scope
    out_of_scope_reason: "Same panva 'remember: true' flag as ITX-052. v1.0 has no remember-me concept on the orchestrator wire; cookie expiry is determined by the configured session TTL, not a per-login boolean."

  - id: ITX-054
    severity: P0
    spec: OIDC Core §15
    behaviour: |
      A login result with `remember: false` MUST yield a transient
      `_session` cookie (no `expires` attribute) and the session
      MUST be reported as `transient`.
    status: out-of-scope
    out_of_scope_reason: "Panva 'remember: false' branch yielding a transient session cookie (no Expires) plus a getSession().transient flag. v1.0 has no remember-me input and no 'transient' session marker — sessions.Manager treats every Issue as a single shape, with cookie TTL set by the embedder via op.WithSessionTTL."

  - id: ITX-055
    severity: P0
    spec: OIDC Core §3.2.1 / OIDC RP-Initiated Logout
    behaviour: |
      When the resume's login result yields an `accountId` different
      from the existing session subject, the OP MUST render an
      auto-submitting logout form
      (`<form method="post" action=".../session/end/confirm">`).
      After the user confirms with the XSRF secret, the next
      `/auth/resume` MUST succeed and 303 to the client.
    status: out-of-scope
    out_of_scope_reason: Panva auto-submitting logout form rendered at /session/end/confirm with an XSRF secret as the bridge between an account-switch login result and the next /auth/resume. v1.0 has no /session/end/confirm route (end_session is a single-shot POST guarded by __Host-oidc_logout_csrf — see end_session.yaml ES-016 OOS) and the account-switch path runs through interaction.chooser PromptData, not an HTML auto-submit form. The wire-observable account chooser is bound under chooser scenarios; the panva auto-logout-form sequencing is not v1.0 wire.

  - id: ITX-060
    severity: P1
    spec: extension API
    behaviour: |
      A custom interaction failure with `prompt=none` MUST 303
      redirect carrying `error=<custom>`,
      `error_description=<custom>`, and `state`.
    status: pending

  - id: ITX-061
    severity: P1
    spec: extension API
    behaviour: |
      A custom interactive failure MUST resume into another
      interaction round-trip (e.g.
      `validateInteraction('login', 'reason_foo')`).
    status: pending

  - id: ITX-062
    severity: P0
    spec: OIDC Core §3.1.2.6
    behaviour: |
      A resume carrying `error: 'access_denied'` (no description)
      MUST 303 with `error=access_denied` and `state` preserved.
    status: out-of-scope
    out_of_scope_reason: "Panva resume API where the embedder hands back {error: access_denied} (no description) through finishInteraction. v1.0 has no resume callback API — the wire-observable user-cancel path is DELETE on /oidc/interaction/{uid} which redirects with error=access_denied and a stable description ('user aborted the interaction'). ITX-040 covers that observable; the panva 'resume carrying error without description' API does not exist in v1.0."

  - id: ITX-063
    severity: P0
    spec: OIDC Core §3.1.2.6
    behaviour: |
      A resume carrying both `error: 'access_denied'` and
      `error_description: '...'` MUST 303 with both fields set.
    status: out-of-scope
    out_of_scope_reason: "Same panva resume callback API as ITX-062 but with both error and error_description. v1.0 has no embedder-hands-error-back API — error redirects originate inside the orchestrator (DELETE -> access_denied + 'user aborted the interaction'; risk denial -> access_denied + 'risk policy denied the request'; etc.). The state-and-error-description round-trip property is bound by ITX-065."

  - id: ITX-064
    severity: P1
    spec: OIDC Core §3.1.2.6
    behaviour: |
      A resume carrying a custom (non-standard) error code MUST 303
      and round-trip the custom `error` and `error_description`
      verbatim.
    status: pending

  - id: ITX-065
    severity: P0
    spec: OIDC Core §3.1.2.6
    behaviour: |
      When the original auth request carried `state`, error
      redirects MUST round-trip it.
    status: active

  - id: ITX-070
    severity: P1
    spec: extension API
    behaviour: |
      An RP requesting a registered `prompt=custom` whose interaction
      is unresolved MUST 303 to the interaction redirect (e.g.
      `validateInteraction('custom', 'custom_prompt')`).
    status: pending

  - id: ITX-071
    severity: P1
    spec: extension API
    behaviour: |
      When OP-side conditions trigger an "unrequestable" prompt that
      the RP cannot ask for but the OP injects, the initial `/auth`
      MUST 303 to the interaction (e.g.
      `validateInteraction('unrequestable', 'un_foo')`).
    status: pending

  - id: ITX-072
    severity: P0
    spec: extension API
    behaviour: |
      An unsatisfied unrequestable prompt at resume time MUST 303
      back to interaction. The loop continues until the prompt is
      satisfied or an external abort intervenes.
    status: out-of-scope
    out_of_scope_reason: "Panva resume-loop semantic: an unsatisfied unrequestable prompt at /auth/resume time triggers another 303 back to /interaction. v1.0 has no /auth/resume endpoint and no 'unrequestable' prompt registration API at the public boundary — the orchestrator's loop is internal to a single dispatchTick and re-prompts the SPA with a fresh JSON envelope, not a 303 to a separate resume route. The looping observable (multi-step authenticator chain) is covered by mfa scenarios and the chain.go internal tests; the panva resume-redirect shape is not v1.0 wire."
