# yaml-language-server: $schema=./schema.json
feature: client_id_uri
prefix: CIDU
title: Client ID as URI
specs:
  - RFC 7591 §3 — Client Information Response (registration_client_uri)
  - RFC 7592 — Dynamic Client Registration Management Protocol
  - RFC 3986 §2.1 — Percent-Encoding
  - RFC 6749 §2.2 — client_id character set

description: |
  URL construction and path-encoding rules for the registration
  management endpoint when the DCR-issued client_id contains
  characters that are not URL-safe (`:`, `/`, `?`, etc.). Covers URL
  encoding, lifecycle round-trips, and character-set policy.

rows:
  - id: CIDU-01
    severity: P0
    spec: RFC 3986 §2.1 / RFC 7592 §1.2
    behaviour: |
      The terminal segment of registration_client_uri is constructed
      with encodeURIComponent semantics so that ":", "/", "?", "#",
      "%", "&", "=", and "+" are all percent-encoded.
    status: out-of-scope
    out_of_scope_reason: "v1.0 mints client_ids via base64.RawURLEncoding (URL-safe [A-Za-z0-9_-]); no character ever needs percent-encoding. internal/registrationendpoint.newOpaqueID hard-wires a base64url-encoded 16-byte identifier. The OP does not expose a configuration knob for URL-form client_ids. The 'encodeURIComponent semantics' contract is a vendor-ism imported wholesale; not part of v1.0 surface."

  - id: CIDU-02
    severity: P0
    spec: RFC 7592 §3
    behaviour: |
      The constructed URL MUST NOT carry a query string; everything
      after "?" is empty.
    status: out-of-scope
    out_of_scope_reason: "v1.0 mints client_ids via base64.RawURLEncoding; no '?' character ever appears so the 'no query string' contract holds trivially. The 'no query string' framing assumes a vendor-specific configurable URL-form client_id. internal/registrationendpoint.registrationClientURI simply concatenates issuer+prefix+registerPath+'/'+clientID; no query is ever attached."

  - id: CIDU-03
    severity: P0
    spec: RFC 7592 §3
    behaviour: |
      GET /reg/<encoded> is accepted; the OP decodes the path segment
      internally before looking up the client.
    status: out-of-scope
    out_of_scope_reason: "v1.0 mints URL-safe base64url client_ids, so the encoded vs decoded path-segment dichotomy never arises. The handler routes via http.ServeMux 'GET /reg/{client_id}' (registrationendpoint/handler.go) — go's mux passes the raw segment through with no decoding step. There is no 'encoded path' for v1.0 to decode."

  - id: CIDU-04
    severity: P0
    spec: RFC 7592 §2.2
    behaviour: |
      PUT /reg/<encoded> is accepted on the same encoding contract;
      the request body's client_id MUST equal the decoded path value.
    status: out-of-scope
    out_of_scope_reason: "Same as CIDU-03: v1.0 client_ids are base64url-safe, no encoded path segment ever exists. PUT /reg/{client_id} parity with the decoded path is exercised by the existing registration_management_test.go RM-* coverage — the URL-encoding axis the row tests is collapsed in v1.0."

  - id: CIDU-05
    severity: P0
    spec: RFC 7592 §2.3
    behaviour: |
      DELETE /reg/<encoded> is accepted on the same encoding contract.
    status: out-of-scope
    out_of_scope_reason: "Same as CIDU-03/CIDU-04: v1.0 client_ids are URL-safe base64url; the 'encoded path' axis collapses. DELETE /reg/{client_id} round-trip is exercised by existing RM coverage."

  - id: CIDU-LC-01
    severity: P0
    spec: RFC 7591 §3 / RFC 7592 §2
    behaviour: |
      The URL produced in the DCR response carries the client_id, and
      the subsequent GET / PUT / DELETE round-trip against it
      succeeds end-to-end.
    status: out-of-scope
    out_of_scope_reason: Full DCR lifecycle round-trip is covered by registration_management_test.go RM-LC rows; the URL-encoding axis the CIDU-LC contract layers on top collapses to a no-op in v1.0 because client_ids are URL-safe base64url. The lifecycle aspect is covered, the encoding aspect is non-applicable.

  - id: CIDU-LC-02
    severity: P0
    spec: RFC 7592 §2.2
    behaviour: |
      The registration_client_uri regenerated on PUT obeys the same
      encoding rules.
    status: out-of-scope
    out_of_scope_reason: "PUT regenerates registration_client_uri through the same internal/registrationendpoint.registrationClientURI helper the register path uses; encoding parity holds trivially because the helper is identical and v1.0's client_ids never contain non-URL-safe characters."

  - id: CIDU-LC-03
    severity: P1
    spec: draft CIMD §4
    behaviour: |
      When the OP issues client_id values in URL form, it MUST be
      possible to distinguish them from CIMD URLs (CIMD points at an
      external URL, while CIDU stays under the OP's own base path);
      use a flag or a dedicated base path prefix.
    status: out-of-scope
    out_of_scope_reason: Client ID Metadata Document (CIMD) is intentionally not implemented in v1.0 (catalog feature client_id_metadata_document has 0 active rows). Without CIMD there is no second URL form to disambiguate against; the contrast the row tests does not exist.

  - id: CIDU-CHR-01
    severity: P0
    spec: RFC 6749 Appendix A.1
    behaviour: |
      client_id values are restricted to VSCHAR (%x20-%x7E); control
      characters and non-ASCII code points are forbidden.
    status: out-of-scope
    out_of_scope_reason: "v1.0 does not accept user-supplied client_ids. The OP itself mints every client_id via newOpaqueID(16) (registrationendpoint/secret.go) producing base64url-no-pad strings drawn from [A-Za-z0-9_-]; every issued client_id satisfies VSCHAR by construction. The 'enforcement' contract collapses because the OP never reads an external client_id at registration time."

  - id: CIDU-CHR-02
    severity: P1
    spec: OP configuration
    behaviour: |
      Only when URL-form client_id values are accepted MAY ":" and
      "/" appear in client_id; the OP setting clientIdValidation
      otherwise constrains the character set.
    status: out-of-scope
    out_of_scope_reason: "v1.0 does not accept user-supplied client_ids and has no clientIdValidation knob. URL-form client_ids are unsupported (CIDU-01..05 OOS), so the conditional ':' / '/' carve-out the row contemplates does not apply."

  - id: CIDU-CHR-03
    severity: P1
    spec: RFC 7231 §7.1.2
    behaviour: |
      When a percent-encoded path is written back into a Location
      header, the same encoding rules apply.
    status: out-of-scope
    out_of_scope_reason: "v1.0 DCR responses do NOT issue a Location header — the success envelope is a 201 JSON body containing registration_client_uri (per RFC 7591 §3, RFC 7592 §3). registrationendpoint/register.go writes the body via JSON encoder and never sets w.Header().Set(\"Location\", ...). The 'Location header same encoding' contract has no surface to test against."
