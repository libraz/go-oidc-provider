  - id: DEV-007
    severity: P0
    spec: RFC 8628 §3.2
    behaviour: |
      A well-formed device authorization request (with scope, extra,
      claims, PKCE) returns 200 application/json whose body has
      exactly the keys device_code, user_code, verification_uri,
      verification_uri_complete, expires_in.
      verification_uri_complete equals
      "${verification_uri}?user_code=${user_code}", verification_uri
      ends with /device, and expires_in is approximately 600 seconds.
    status: out-of-scope
    out_of_scope_reason: "RFC 8628 device authorization grant is intentionally deferred to v1.x and not present in v1.0. internal/tokenendpoint/handler.go dispatches only authorization_code, refresh_token, and client_credentials; every other grant_type (including urn:ietf:params:oauth:grant-type:device_code) returns 400 unsupported_grant_type per internal/tokenendpoint/doc.go. op/grant/grant.go documents the DeviceCode constant as \"Implemented in v1.x; the constant exists so option signatures are stable across releases\", op/feature/feature.go ships no DeviceCode flag, and docs/plans/002-product-design.md §v1.x lists \"device_code grant (RFC 8628)\" as a post-v1.0 addition. The catalog text was inherited from a vendor-specific reference and asserts behaviour (device_authorization endpoint, /device verification UI, user_code/device_code persistence, authorization_pending/expired_token errors) that no v1.0 code path implements. Revisit when the device_code wave lands."

