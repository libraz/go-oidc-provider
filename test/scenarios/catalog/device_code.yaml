# yaml-language-server: $schema=./schema.json
feature: device_code
prefix: DEV
title: Device Authorization Grant
specs:
  - RFC 8628 — OAuth 2.0 Device Authorization Grant
  - RFC 6749 §5.1 / §5.2 — Token response and error format
  - OpenID Connect Core 1.0 §11 (Offline Access), §3.1.3
  - RFC 8414 — Discovery (device_authorization_endpoint)
  - RFC 8252 — OAuth 2.0 for Native Apps
  - OWASP XSS / CSRF prevention guidance

description: |
  RFC 8628 device authorization endpoint (POST /device/auth), the
  device-code grant at the token endpoint, the user-facing verification
  flow (GET/POST /device), and the interaction-resume path
  (GET /device/:uid). Covers content-type and parameter validation,
  client authentication, response shape, persistence, expiry/replay
  semantics, charset/mask configuration, and CSRF/XSS hardening of the
  verification UI.

rows:
  - id: DEV-001
    severity: P1
    spec: RFC 8628 §3.1 / RFC 6749 §3.2
    behaviour: |
      POST /device/auth with a body whose Content-Type is not
      application/x-www-form-urlencoded returns 400 invalid_request
      with the description "only application/x-www-form-urlencoded
      content-type bodies are supported on POST /device/auth" and
      emits a device_authorization.error audit event.
    status: out-of-scope
    out_of_scope_reason: "RFC 8628 device authorization grant is intentionally deferred to v1.x and not present in v1.0. internal/tokenendpoint/handler.go dispatches only authorization_code, refresh_token, and client_credentials; every other grant_type (including urn:ietf:params:oauth:grant-type:device_code) returns 400 unsupported_grant_type per internal/tokenendpoint/doc.go. op/grant/grant.go documents the DeviceCode constant as \"Implemented in v1.x; the constant exists so option signatures are stable across releases\", op/feature/feature.go ships no DeviceCode flag, and docs/plans/002-product-design.md §v1.x lists \"device_code grant (RFC 8628)\" as a post-v1.0 addition. The catalog text was inherited from a vendor-specific reference and asserts behaviour (device_authorization endpoint, /device verification UI, user_code/device_code persistence, authorization_pending/expired_token errors) that no v1.0 code path implements. Revisit when the device_code wave lands."

