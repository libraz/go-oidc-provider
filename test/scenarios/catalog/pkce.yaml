# yaml-language-server: $schema=./schema.json
feature: pkce
prefix: PKCE
title: Proof Key for Code Exchange (PKCE)
specs:
  - RFC 7636 — Proof Key for Code Exchange by OAuth Public Clients
  - RFC 6749 §4.1 — Authorization Code Grant
  - OpenID Connect Core 1.0 §3.1
  - OAuth 2.1 §4.1.1
  - RFC 8252 — OAuth 2.0 for Native Apps

description: |
  PKCE parameter validation at /authorize and the verifier-versus-
  challenge match at the token endpoint. Covers code_challenge and
  code_verifier ABNF, supported method whitelist, public-client
  enforcement policy, and authorization-time error preservation of
  state.

rows:
  - id: PKCE-001
    severity: P0
    spec: RFC 7636 §4.3
    behaviour: |
      An authorization request that includes code_challenge_method
      but omits code_challenge redirects with error=invalid_request
      and error_description "code_challenge must be provided with
      code_challenge_method"; state is preserved.
    status: pending

  - id: PKCE-002
    severity: P0
    spec: RFC 7636 §4.2
    behaviour: |
      A code_challenge shorter than 43 characters causes a redirect
      error invalid_request with description "code_challenge must be
      a string with a minimum length of 43 characters".
    status: pending

  - id: PKCE-003
    severity: P0
    spec: RFC 7636 §4.2
    behaviour: |
      A code_challenge longer than 128 characters causes a redirect
      error invalid_request with description "code_challenge must be
      a string with a maximum length of 128 characters".
    status: pending

  - id: PKCE-004
    severity: P0
    spec: RFC 7636 §4.2
    behaviour: |
      A code_challenge containing characters outside the unreserved
      set (e.g. "&") causes a redirect error invalid_request with
      description "code_challenge contains invalid characters".
    status: pending

  - id: PKCE-005
    severity: P0
    spec: RFC 7636 §4.3
    behaviour: |
      A code_challenge_method value that is not in the supported set
      (e.g. "bar") causes a redirect error invalid_request with
      description "not supported value of code_challenge_method".
    status: pending

  - id: PKCE-006
    severity: P0
    spec: RFC 7636 §4.3 / OAuth 2.1 §4.1.1
    behaviour: |
      When server policy disables plain, an authorization request
      that specifies code_challenge_method=plain redirects with
      error=invalid_request indicating the unsupported method.
    status: pending

  - id: PKCE-007
    severity: P0
    spec: RFC 7636 §4.4.1 / OAuth 2.1
    behaviour: |
      A public client using response_type=code without
      code_challenge or code_challenge_method redirects with
      error=invalid_request and description "Authorization Server
      policy requires PKCE to be used for this request".
    status: pending

  - id: PKCE-008
    severity: P0
    spec: RFC 7636 §4.4.1 / OIDC Core §3.3
    behaviour: |
      A public client using response_type="code id_token" without
      PKCE produces a fragment-encoded redirect error with
      error=invalid_request and description "Authorization Server
      policy requires PKCE to be used for this request"; state is
      preserved.
    status: out-of-scope
    out_of_scope_reason: "Implicit / hybrid response_type is intentionally not supported. docs/plans/002-product-design.md §\"Out-of-scope\" (line 2167) records the policy: \"Bearer token の URL fragment 露出 — implicit を持たないため自動的に不在.\" Only response_type=code is advertised."

  - id: PKCE-009
    severity: P1
    spec: RFC 7636 §4.4.1 / OIDC Core §3.2
    behaviour: |
      For an implicit-only flow with response_type=id_token, PKCE is
      not in effect: the request succeeds and the response carries
      id_token and state in the fragment.
    status: out-of-scope
    out_of_scope_reason: "Implicit / hybrid response_type is intentionally not supported. docs/plans/002-product-design.md §\"Out-of-scope\" (line 2167) records the policy: \"Bearer token の URL fragment 露出 — implicit を持たないため自動的に不在.\" Only response_type=code is advertised."

  - id: PKCE-010
    severity: P0
    spec: RFC 7636 §4.4
    behaviour: |
      A successful response_type=code request with PKCE parameters
      persists codeChallenge and codeChallengeMethod on the issued
      authorization code exactly as sent.
    status: pending

  - id: PKCE-011
    severity: P0
    spec: RFC 7636 §4.6
    behaviour: |
      An authorization_code grant whose code_verifier produces the
      stored code_challenge under SHA-256 base64url (method S256)
      returns 200 with tokens issued.
    status: pending

  - id: PKCE-012
    severity: P0
    spec: RFC 7636 §4.6
    behaviour: |
      An authorization_code grant for a code with a stored
      codeChallenge but no code_verifier in the token request is
      rejected with 400 invalid_grant.
    status: pending

  - id: PKCE-013
    severity: P0
    spec: RFC 7636 §4.6
    behaviour: |
      An authorization_code grant whose code_verifier does not hash
      to the stored code_challenge (method S256) is rejected with
      400 invalid_grant.
    status: pending

  - id: PKCE-014
    severity: P0
    spec: RFC 7636 §4.1
    behaviour: |
      A code_verifier shorter than 43 characters is rejected with
      400 invalid_request and description "code_verifier must be a
      string with a minimum length of 43 characters".
    status: pending

  - id: PKCE-015
    severity: P0
    spec: RFC 7636 §4.1
    behaviour: |
      A code_verifier longer than 128 characters is rejected with
      400 invalid_request and description "code_verifier must be a
      string with a maximum length of 128 characters".
    status: pending

  - id: PKCE-016
    severity: P0
    spec: RFC 7636 §4.1
    behaviour: |
      A code_verifier containing characters outside the unreserved
      set (e.g. "&") is rejected with 400 invalid_request and
      description "code_verifier contains invalid characters".
    status: pending

  - id: PKCE-017
    severity: P2
    spec: RFC 6749 §4.1.2.1
    behaviour: |
      Any authorization-time PKCE error redirects back to the client
      with the state parameter retained alongside error and
      error_description.
    status: pending
