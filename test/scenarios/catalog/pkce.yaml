# yaml-language-server: $schema=./schema.json
feature: pkce
prefix: PKCE
title: Proof Key for Code Exchange (PKCE)
specs:
  - RFC 7636 — Proof Key for Code Exchange by OAuth Public Clients
  - RFC 6749 §4.1 — Authorization Code Grant
  - OpenID Connect Core 1.0 §3.1
  - OAuth 2.1 §4.1.1
  - RFC 8252 — OAuth 2.0 for Native Apps

description: |
  PKCE parameter validation at /authorize and the verifier-versus-
  challenge match at the token endpoint. Covers code_challenge and
  code_verifier ABNF, supported method whitelist, public-client
  enforcement policy, and authorization-time error preservation of
  state.

rows:
  - id: PKCE-001
    severity: P0
    spec: RFC 7636 §4.3
    behaviour: |
      An authorization request that includes code_challenge_method
      but omits code_challenge redirects with error=invalid_request
      and an error_description naming the missing code_challenge
      ("code_challenge is required"); state is preserved on the
      callback URL.
    status: out-of-scope
    out_of_scope_reason: "OP semantics: for a confidential client under the default OIDC posture PKCE is opt-in, so an empty code_challenge is treated as opting out of PKCE for the request and the method parameter is silently ignored. RFC 7636 §4.3 only requires a redirect error when the server REQUIRES PKCE; the OP requires it for public / native clients unconditionally (exercised by PKCE-007, authorize-side) and otherwise per the active profile (FAPI 2.0). Format checks are exercised by PKCE-002..006."

  - id: PKCE-002
    severity: P0
    spec: RFC 7636 §4.2
    behaviour: |
      A code_challenge shorter than 43 characters causes a redirect
      error invalid_request with an error_description that flags
      the malformed challenge ("code_challenge format is invalid").
      The OP only accepts S256, whose output is exactly 43
      base64url-no-pad characters; any other length is malformed.
    status: active

  - id: PKCE-003
    severity: P0
    spec: RFC 7636 §4.2
    behaviour: |
      A code_challenge longer than 128 characters causes a redirect
      error invalid_request with an error_description that flags
      the malformed challenge ("code_challenge format is invalid").
      The OP only accepts S256 (43 base64url-no-pad chars); any
      other length is malformed.
    status: active

  - id: PKCE-004
    severity: P0
    spec: RFC 7636 §4.2
    behaviour: |
      A code_challenge containing characters outside the base64url
      alphabet (e.g. "&") causes a redirect error invalid_request
      with an error_description that flags the malformed challenge
      ("code_challenge format is invalid").
    status: active

  - id: PKCE-005
    severity: P0
    spec: RFC 7636 §4.3
    behaviour: |
      A code_challenge_method value that is not in the supported set
      (e.g. "bar") causes a redirect error invalid_request with an
      error_description that names the required method
      ("code_challenge_method must be S256"). The OP only accepts
      S256.
    status: active

  - id: PKCE-006
    severity: P0
    spec: RFC 7636 §4.3 / OAuth 2.1 §4.1.1
    behaviour: |
      The OP rejects code_challenge_method=plain unconditionally
      (FAPI 2.0 / OAuth 2.1 / RFC 9700 forbid plain; project policy
      pins "S256 only"). The redirect carries error=invalid_request
      with an error_description naming the required method
      ("code_challenge_method must be S256"); state is preserved.
    status: active

  - id: PKCE-007
    severity: P0
    spec: RFC 9700 §2.1.1 / OAuth 2.1 §4.1.1
    behaviour: |
      A public client that omits code_challenge is rejected at
      /authorize with an invalid_request authorization-response error
      ("code_challenge is required"): PKCE is mandatory for public and
      native clients regardless of the active profile, so the OP never
      issues a non-PKCE code to them. No authorization code is emitted.
      The token endpoint retains a PKCE downgrade guard as defense in
      depth, but a public client can no longer reach it through a normal
      authorize round-trip.
    status: active

  - id: PKCE-008
    severity: P0
    spec: RFC 7636 §4.4.1 / OIDC Core §3.3
    behaviour: |
      A public client using response_type="code id_token" without
      PKCE produces a fragment-encoded redirect error with
      error=invalid_request and description "Authorization Server
      policy requires PKCE to be used for this request"; state is
      preserved.
    status: out-of-scope
    out_of_scope_reason: "Implicit / hybrid response_type is intentionally not supported: returning a bearer token in the URL fragment leaks it through browser history and Referer, and OAuth 2.1 / RFC 9700 §2.1.2 drop the implicit grant for that reason. Only response_type=code is advertised."

  - id: PKCE-009
    severity: P1
    spec: RFC 7636 §4.4.1 / OIDC Core §3.2
    behaviour: |
      For an implicit-only flow with response_type=id_token, PKCE is
      not in effect: the request succeeds and the response carries
      id_token and state in the fragment.
    status: out-of-scope
    out_of_scope_reason: "Implicit / hybrid response_type is intentionally not supported: returning a bearer token in the URL fragment leaks it through browser history and Referer, and OAuth 2.1 / RFC 9700 §2.1.2 drop the implicit grant for that reason. Only response_type=code is advertised."

  - id: PKCE-010
    severity: P0
    spec: RFC 7636 §4.4
    behaviour: |
      A successful response_type=code request with PKCE parameters
      persists codeChallenge and codeChallengeMethod on the issued
      authorization code exactly as sent.
    status: out-of-scope
    out_of_scope_reason: "Internal storage shape is not observable through the public surface. Persistence is exercised end-to-end by PKCE-011 (matching verifier succeeds) and PKCE-013 (mismatched verifier rejected with invalid_grant): both round-trips would fail if the OP did not persist the challenge / method onto the authorization code. Asserting on the stored field directly is a contract-test concern, not a wire-level scenario."

  - id: PKCE-011
    severity: P0
    spec: RFC 7636 §4.6
    behaviour: |
      An authorization_code grant whose code_verifier produces the
      stored code_challenge under SHA-256 base64url (method S256)
      returns 200 with tokens issued.
    status: active

  - id: PKCE-012
    severity: P0
    spec: RFC 7636 §4.6
    behaviour: |
      An authorization_code grant for a code with a stored
      codeChallenge but no code_verifier in the token request is
      rejected with 400 invalid_grant.
    status: active

  - id: PKCE-013
    severity: P0
    spec: RFC 7636 §4.6
    behaviour: |
      An authorization_code grant whose code_verifier does not hash
      to the stored code_challenge (method S256) is rejected with
      400 invalid_grant.
    status: active

  - id: PKCE-014
    severity: P0
    spec: RFC 7636 §4.1
    behaviour: |
      A code_verifier shorter than 43 characters is rejected at
      /token with 400 invalid_grant and an error_description that
      flags PKCE verification ("PKCE verification failed"). Token
      endpoint PKCE failures collapse to invalid_grant per RFC
      7636 §4.6, regardless of whether the underlying cause was a
      format violation or a hash mismatch.
    status: active

  - id: PKCE-015
    severity: P0
    spec: RFC 7636 §4.1
    behaviour: |
      A code_verifier longer than 128 characters is rejected at
      /token with 400 invalid_grant and an error_description that
      flags PKCE verification ("PKCE verification failed"). Token
      endpoint PKCE failures collapse to invalid_grant per RFC
      7636 §4.6.
    status: active

  - id: PKCE-016
    severity: P0
    spec: RFC 7636 §4.1
    behaviour: |
      A code_verifier containing characters outside the unreserved
      set (e.g. "&") is rejected at /token with 400 invalid_grant
      and an error_description that flags PKCE verification ("PKCE
      verification failed"). Token endpoint PKCE failures collapse
      to invalid_grant per RFC 7636 §4.6.
    status: active

  - id: PKCE-017
    severity: P2
    spec: RFC 6749 §4.1.2.1
    behaviour: |
      Any authorization-time PKCE error redirects back to the client
      with the state parameter retained alongside error and
      error_description.
    status: out-of-scope
    out_of_scope_reason: "Subsumed by per-error rows. PKCE-002..006 each redirect-error row asserts state preservation explicitly (the OP echoes the request's state on every redirect-safe authorize error). A standalone scenario row would duplicate that coverage without adding spec ground."

  - id: PKCE-018
    severity: P0
    spec: OAuth 2.1 §4.1.1
    behaviour: |
      Under the OAuth 2.1 baseline security profile, an authorization
      request from a confidential client that omits code_challenge
      redirects with error=invalid_request and an error_description
      naming the missing code_challenge. The same request succeeds
      when no security profile is declared, because plain OpenID
      Connect Core 1.0 leaves PKCE optional for confidential clients.
    status: active
