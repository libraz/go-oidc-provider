# yaml-language-server: $schema=./schema.json
feature: client_auth
prefix: CA
title: Client Authentication
specs:
  - RFC 6749 §2.3 — Client Authentication (client_secret_basic / client_secret_post / none)
  - RFC 6749 Appendix B — application/x-www-form-urlencoded encoding for client credentials
  - RFC 7521 — Assertion Framework (client_assertion / client_assertion_type)
  - RFC 7523 — JWT Profile for Client Authentication and Authorization Grants
  - RFC 8705 §2 — OAuth 2.0 Mutual-TLS Client Authentication (PKI and self-signed)
  - RFC 7591 — Dynamic Client Registration (auth method metadata)
  - OIDC Core 1.0 §9 — Client Authentication
  - draft-ietf-oauth-attestation-based-client-auth — attest_jwt_client_auth
  - IANA OAuth Token Endpoint Authentication Methods registry

description: |
  Client authentication behaviours accepted by the OP at token-bearing
  endpoints (/token, /token/introspection, /token/revocation, /par,
  /ciba, /device_authorization, /reg). The catalog cites only RFC and
  OIDC normative text; implementation-specific behaviours are not
  asserted here.

rows:
  - id: CA-COMMON-01
    severity: P0
    spec: RFC 6749 §5.2
    behaviour: |
      When no client authentication mechanism is provided at all, the
      token endpoint returns 401 invalid_client with an
      error_description equivalent to "client authentication
      required". Per RFC 6749 §5.2 the "no client authentication
      included" condition maps to invalid_client; the OP collapses it
      onto a single response shape so the timing channel does not
      leak whether the client_id was known.
    status: active

  - id: CA-COMMON-02
    severity: P0
    spec: RFC 6749 §5.2
    behaviour: |
      When the supplied client_id is unknown, the OP returns
      401 invalid_client.
    status: active

  - id: CA-COMMON-03
    severity: P0
    spec: RFC 6749 §2.3
    behaviour: |
      Presenting two authentication mechanisms simultaneously
      (Basic + body credentials, Basic + assertion, or body + assertion)
      MUST return 400 invalid_request with an "only one mechanism"
      style description.
    status: active

  - id: CA-COMMON-04
    severity: P0
    spec: RFC 6749 §2.3 / OIDC Core §9
    behaviour: |
      Authenticating with a method that differs from the client's
      registered token_endpoint_auth_method MUST return
      401 invalid_client. The OP intentionally collapses the response
      onto the generic "client authentication failed" shape so the
      error code does not reveal which auth method the client is
      registered for.
    status: active

  - id: CA-COMMON-05
    severity: P0
    spec: RFC 6749 §2.3.1 / §5.2
    behaviour: |
      When the body's client_id disagrees with the client_id derived
      from the Authorization header or from the assertion's iss/sub,
      the OP returns 401 invalid_client. The mismatch is collapsed
      onto the generic authentication-failed shape so the timing
      channel does not leak which channel held the canonical id.
    status: active

  - id: CA-COMMON-06
    severity: P1
    spec: RFC 6749 §5.2
    behaviour: |
      On authentication failure, the WWW-Authenticate header is
      attached only when the request used HTTP Basic; for any other
      mechanism the OP MUST NOT emit a Basic challenge.

  - id: CA-COMMON-07
    severity: P2
    spec: OIDC Core §3.1.3.4
    behaviour: |
      Error responses preserve the no-store family of cache-control
      headers required for token-bearing responses.

  - id: CA-NONE-01
    severity: P0
    spec: RFC 6749 §2.3
    behaviour: |
      A client registered with token_endpoint_auth_method=none
      authenticates successfully by sending only client_id in the
      request body.
    status: active

  - id: CA-NONE-02
    severity: P0
    spec: RFC 6749 §2.3
    behaviour: |
      A client registered with token_endpoint_auth_method=none that
      attaches a client_secret (in either the Authorization header or
      the body) MUST be rejected with 401 invalid_client. The OP
      collapses the response onto the generic
      "client authentication failed" shape so the error code does not
      reveal that the rejection was driven by a method mismatch.
    status: active

  - id: CA-NONE-03
    severity: P1
    spec: RFC 6749 §2.1
    behaviour: |
      none clients MUST NOT be permitted to use grant flows reserved
      for confidential clients; none is a public-client-only
      authentication.

  - id: CA-BASIC-01
    severity: P0
    spec: RFC 6749 §2.3.1
    behaviour: |
      The OP accepts a well-formed
      Authorization: Basic <base64(client_id:secret)> header.
    status: active

  - id: CA-BASIC-02
    severity: P1
    spec: RFC 6749 §2.3.1
    behaviour: |
      When client_id is also sent in the body alongside the Basic
      header, the request is accepted iff the two values match.

  - id: CA-BASIC-03
    severity: P2
    spec: RFC 6749 §2.3
    behaviour: |
      A client registered with token_endpoint_auth_method=
      client_secret_post MAY be accepted via Basic only when the OP is
      configured in cross-method compatibility mode; the default is to
      require the registered method.

  - id: CA-BASIC-04
    severity: P0
    spec: RFC 6749 Appendix B
    behaviour: |
      Per RFC 6749 Appendix B, client_id and client_secret MUST be
      application/x-www-form-urlencoded before being joined with ":"
      and base64-encoded. Credentials containing %, &, +, and space
      MUST authenticate successfully under that encoding.

  - id: CA-BASIC-05
    severity: P0
    spec: RFC 6749 §2.3.1 / §5.2
    behaviour: |
      When the body's client_id differs from the client_id in the
      Basic header, the OP returns 401 invalid_client (not 400
      invalid_request). The mismatch is collapsed onto the generic
      authentication-failed shape so the timing channel does not leak
      which channel held the canonical id; this mirrors CA-COMMON-05
      for the Basic-only case.
    status: active

  - id: CA-BASIC-06
    severity: P0
    spec: RFC 6749 §2.3.1 / §5.2 / Appendix B
    behaviour: |
      A Basic header that fails base64 decoding or lacks the ":"
      separator is treated as if no client authentication were
      provided, which RFC 6749 §5.2 lists under invalid_client; the OP
      returns 401 invalid_client with the generic
      "client authentication required" shape so the response does not
      leak whether the malformed header was a typo or a probe.
    status: active

  - id: CA-BASIC-07
    severity: P0
    spec: RFC 6749 §2.3.1 / §5.2 / RFC 7235
    behaviour: |
      An Authorization header that uses a scheme other than Basic
      (e.g. Bearer) is treated as if no client authentication were
      provided per RFC 6749 §5.2; the OP returns 401 invalid_client
      with the generic "client authentication required" shape. The
      response intentionally does not echo the offending scheme so a
      caller probing for accepted schemes learns nothing.
    status: active

  - id: CA-BASIC-08
    severity: P0
    spec: RFC 6749 §2.3.1 / §5.2
    behaviour: |
      When the Basic header carries an empty client_secret (i.e. the
      base64 payload is "client_id:" with nothing after the colon),
      the OP runs the verifier against an empty secret, which fails
      length-constant comparison, and returns 401 invalid_client with
      the generic "client authentication failed" shape.
    status: active

  - id: CA-BASIC-09
    severity: P0
    spec: RFC 6749 §5.2
    behaviour: |
      A Basic-authenticated request whose client_secret does not match
      the registered hash yields 401 invalid_client with the generic
      "client authentication failed" description. The wire shape is
      identical to the unknown-client and method-mismatch responses
      so the comparison itself does not become an oracle; the
      length-constant secret compare is the timing-side counterpart.
    status: active

  - id: CA-BASIC-10
    severity: P0
    spec: RFC 7591 §2 / OIDC Core §9
    behaviour: |
      When the client's client_secret_expires_at is in the past, the
      OP returns 400 invalid_client with description
      "secret is expired".

  - id: CA-POST-01
    severity: P0
    spec: RFC 6749 §2.3.1
    behaviour: |
      The OP accepts an application/x-www-form-urlencoded body that
      carries both client_id and client_secret as parameters.
    status: active

  - id: CA-POST-02
    severity: P1
    spec: RFC 7230
    behaviour: |
      Bodies sent with Transfer-Encoding: chunked MUST be accepted;
      the OP MUST NOT require Content-Length.

  - id: CA-POST-03
    severity: P0
    spec: RFC 6749 §5.2
    behaviour: |
      A mismatching client_secret yields 401 invalid_client with event
      detail "invalid secret".
    status: active

  - id: CA-POST-04
    severity: P0
    spec: RFC 6749 §2.3.1 / §5.2
    behaviour: |
      A body that carries client_id but an empty client_secret never
      triggers the MethodSecretPost path (the parser treats the empty
      value as "no body secret"), so the request lands on MethodNone
      with the body client_id. The verifier then rejects because the
      client is registered confidential, and the OP returns
      401 invalid_client with the generic
      "client authentication failed" shape so the response does not
      reveal that the rejection was driven by a method mismatch.
    status: active

  - id: CA-POST-05
    severity: P0
    spec: RFC 7591 §2
    behaviour: |
      When client_secret_expires_at is in the past, the OP returns
      400 invalid_client with description "secret is expired".

  - id: CA-POST-06
    severity: P2
    spec: RFC 6749 §2.3
    behaviour: |
      A client registered with
      token_endpoint_auth_method=client_secret_basic that submits
      credentials in the body MUST be rejected by the strict default;
      compatibility mode MAY accept either form when explicitly
      enabled.

  - id: CA-CSJWT-01
    severity: P0
    spec: RFC 7521 §4.2
    behaviour: |
      client_assertion_type is required and MUST equal
      urn:ietf:params:oauth:client-assertion-type:jwt-bearer; missing
      values are rejected with 400 invalid_request.
    status: out-of-scope
    out_of_scope_reason: |
      client_secret_jwt is intentionally not supported.
      docs/plans/002-product-design.md §"Out-of-scope" (line 2159)
      records the policy: shared-secret JWT auth (HS256/384/512)
      broadens the blast radius of a leaked secret without offering
      anything private_key_jwt does not, and is incompatible with the
      §J.5 ES256 single-policy. Only private_key_jwt and the
      secret-derived client_secret_basic / client_secret_post are
      accepted.

  - id: CA-CSJWT-02
    severity: P0
    spec: RFC 7521 §4.2
    behaviour: |
      A client_assertion_type value other than the JWT bearer URN MUST
      be rejected with 400 invalid_request.
    status: out-of-scope
    out_of_scope_reason: |
      client_secret_jwt is intentionally not supported.
      docs/plans/002-product-design.md §"Out-of-scope" (line 2159)
      records the policy: shared-secret JWT auth (HS256/384/512)
      broadens the blast radius of a leaked secret without offering
      anything private_key_jwt does not, and is incompatible with the
      §J.5 ES256 single-policy. Only private_key_jwt and the
      secret-derived client_secret_basic / client_secret_post are
      accepted.

  - id: CA-CSJWT-03
    severity: P0
    spec: RFC 7521 §4.2
    behaviour: |
      A missing client_assertion or one that is not a syntactically
      valid JWT MUST be rejected with 400 invalid_request and
      description "invalid client_assertion format".
    status: out-of-scope
    out_of_scope_reason: |
      client_secret_jwt is intentionally not supported.
      docs/plans/002-product-design.md §"Out-of-scope" (line 2159)
      records the policy: shared-secret JWT auth (HS256/384/512)
      broadens the blast radius of a leaked secret without offering
      anything private_key_jwt does not, and is incompatible with the
      §J.5 ES256 single-policy. Only private_key_jwt and the
      secret-derived client_secret_basic / client_secret_post are
      accepted.

  - id: CA-CSJWT-04
    severity: P0
    spec: RFC 7523 §2.2 / OIDC Core §9
    behaviour: |
      The assertion MUST be signed with HS256, HS384, or HS512; the
      HMAC key is derived from the client's client_secret.
    status: out-of-scope
    out_of_scope_reason: |
      client_secret_jwt is intentionally not supported.
      docs/plans/002-product-design.md §"Out-of-scope" (line 2159)
      records the policy: shared-secret JWT auth (HS256/384/512)
      broadens the blast radius of a leaked secret without offering
      anything private_key_jwt does not, and is incompatible with the
      §J.5 ES256 single-policy. Only private_key_jwt and the
      secret-derived client_secret_basic / client_secret_post are
      accepted.

  - id: CA-CSJWT-05
    severity: P0
    spec: RFC 7523 §3
    behaviour: |
      The assertion's required claims are iss, sub, aud, jti, and exp.
      Each missing claim MUST yield 401 invalid_client with a distinct
      error_detail recorded per claim.
    status: out-of-scope
    out_of_scope_reason: |
      client_secret_jwt is intentionally not supported.
      docs/plans/002-product-design.md §"Out-of-scope" (line 2159)
      records the policy: shared-secret JWT auth (HS256/384/512)
      broadens the blast radius of a leaked secret without offering
      anything private_key_jwt does not, and is incompatible with the
      §J.5 ES256 single-policy. Only private_key_jwt and the
      secret-derived client_secret_basic / client_secret_post are
      accepted.

  - id: CA-CSJWT-06
    severity: P0
    spec: RFC 7523 §3
    behaviour: |
      iss MUST equal client_id; mismatch yields 401 invalid_client
      with detail "iss must be the client_id".
    status: out-of-scope
    out_of_scope_reason: |
      client_secret_jwt is intentionally not supported.
      docs/plans/002-product-design.md §"Out-of-scope" (line 2159)
      records the policy: shared-secret JWT auth (HS256/384/512)
      broadens the blast radius of a leaked secret without offering
      anything private_key_jwt does not, and is incompatible with the
      §J.5 ES256 single-policy. Only private_key_jwt and the
      secret-derived client_secret_basic / client_secret_post are
      accepted.

  - id: CA-CSJWT-07
    severity: P0
    spec: RFC 7523 §3
    behaviour: |
      sub MUST equal client_id; mismatch yields 401 invalid_client.
    status: out-of-scope
    out_of_scope_reason: |
      client_secret_jwt is intentionally not supported.
      docs/plans/002-product-design.md §"Out-of-scope" (line 2159)
      records the policy: shared-secret JWT auth (HS256/384/512)
      broadens the blast radius of a leaked secret without offering
      anything private_key_jwt does not, and is incompatible with the
      §J.5 ES256 single-policy. Only private_key_jwt and the
      secret-derived client_secret_basic / client_secret_post are
      accepted.

  - id: CA-CSJWT-08
    severity: P0
    spec: RFC 7523 §3 / OIDC Core §9
    behaviour: |
      aud MUST be one of: the issuer URL, an array containing the
      issuer URL, the absolute URL of the targeted endpoint, or an
      array of absolute endpoint URLs. The same assertion form may be
      reused by the same client at any of those endpoints.
    status: out-of-scope
    out_of_scope_reason: |
      client_secret_jwt is intentionally not supported.
      docs/plans/002-product-design.md §"Out-of-scope" (line 2159)
      records the policy: shared-secret JWT auth (HS256/384/512)
      broadens the blast radius of a leaked secret without offering
      anything private_key_jwt does not, and is incompatible with the
      §J.5 ES256 single-policy. Only private_key_jwt and the
      secret-derived client_secret_basic / client_secret_post are
      accepted.

  - id: CA-CSJWT-09
    severity: P0
    spec: RFC 7523 §3
    behaviour: |
      jti is single-use; presenting the same jti a second time MUST
      yield 401 invalid_client with description
      "client assertion tokens must only be used once". The OP retains
      jti at least until the assertion's exp.
    notes: |
      Replay defence. Multi-node deployments require a shared jti
      store, otherwise replay across nodes is undetectable.
    status: out-of-scope
    out_of_scope_reason: |
      client_secret_jwt is intentionally not supported.
      docs/plans/002-product-design.md §"Out-of-scope" (line 2159)
      records the policy: shared-secret JWT auth (HS256/384/512)
      broadens the blast radius of a leaked secret without offering
      anything private_key_jwt does not, and is incompatible with the
      §J.5 ES256 single-policy. Only private_key_jwt and the
      secret-derived client_secret_basic / client_secret_post are
      accepted.

  - id: CA-CSJWT-10
    severity: P0
    spec: RFC 7523 §3
    behaviour: |
      An exp in the past (including a negative expiresIn) yields
      401 invalid_client with description "jwt expired".
    status: out-of-scope
    out_of_scope_reason: |
      client_secret_jwt is intentionally not supported.
      docs/plans/002-product-design.md §"Out-of-scope" (line 2159)
      records the policy: shared-secret JWT auth (HS256/384/512)
      broadens the blast radius of a leaked secret without offering
      anything private_key_jwt does not, and is incompatible with the
      §J.5 ES256 single-policy. Only private_key_jwt and the
      secret-derived client_secret_basic / client_secret_post are
      accepted.

  - id: CA-CSJWT-11
    severity: P0
    spec: RFC 7523 §3 / RFC 7519 §4.1
    behaviour: |
      A clockTolerance MAY be configured by the OP to absorb clock
      skew on iat/nbf/exp; values within the configured tolerance are
      accepted, values outside are rejected. The default tolerance
      MUST be zero so the OP never accepts skew unless an embedder
      explicitly opts in.
    notes: |
      Default-zero clockTolerance with an enforced upper bound (e.g.
      60s) is required to prevent a misconfiguration from silently
      widening the acceptance window.
    status: out-of-scope
    out_of_scope_reason: |
      client_secret_jwt is intentionally not supported.
      docs/plans/002-product-design.md §"Out-of-scope" (line 2159)
      records the policy: shared-secret JWT auth (HS256/384/512)
      broadens the blast radius of a leaked secret without offering
      anything private_key_jwt does not, and is incompatible with the
      §J.5 ES256 single-policy. Only private_key_jwt and the
      secret-derived client_secret_basic / client_secret_post are
      accepted.

  - id: CA-CSJWT-12
    severity: P0
    spec: RFC 7521 §4.2
    behaviour: |
      A mismatch between the body's client_id and the assertion's
      iss/sub yields 400 invalid_request with description
      "client_id mismatch".
    status: out-of-scope
    out_of_scope_reason: |
      client_secret_jwt is intentionally not supported.
      docs/plans/002-product-design.md §"Out-of-scope" (line 2159)
      records the policy: shared-secret JWT auth (HS256/384/512)
      broadens the blast radius of a leaked secret without offering
      anything private_key_jwt does not, and is incompatible with the
      §J.5 ES256 single-policy. Only private_key_jwt and the
      secret-derived client_secret_basic / client_secret_post are
      accepted.

  - id: CA-CSJWT-13
    severity: P0
    spec: RFC 7521 §4.2
    behaviour: |
      Submitting an Authorization: Basic header alongside a
      client_assertion yields 400 invalid_request with description
      "only one mechanism".
    status: out-of-scope
    out_of_scope_reason: |
      client_secret_jwt is intentionally not supported.
      docs/plans/002-product-design.md §"Out-of-scope" (line 2159)
      records the policy: shared-secret JWT auth (HS256/384/512)
      broadens the blast radius of a leaked secret without offering
      anything private_key_jwt does not, and is incompatible with the
      §J.5 ES256 single-policy. Only private_key_jwt and the
      secret-derived client_secret_basic / client_secret_post are
      accepted.

  - id: CA-CSJWT-14
    severity: P0
    spec: OIDC Core §9 / RFC 7523 §3
    behaviour: |
      When the client has registered token_endpoint_auth_signing_alg,
      an assertion using a different alg MUST be rejected with
      401 invalid_client and detail "alg mismatch".
    status: out-of-scope
    out_of_scope_reason: |
      client_secret_jwt is intentionally not supported.
      docs/plans/002-product-design.md §"Out-of-scope" (line 2159)
      records the policy: shared-secret JWT auth (HS256/384/512)
      broadens the blast radius of a leaked secret without offering
      anything private_key_jwt does not, and is incompatible with the
      §J.5 ES256 single-policy. Only private_key_jwt and the
      secret-derived client_secret_basic / client_secret_post are
      accepted.

  - id: CA-CSJWT-15
    severity: P0
    spec: OIDC Discovery §3
    behaviour: |
      When the client has not registered a signing alg, only algs
      published in the OP's
      token_endpoint_auth_signing_alg_values_supported are accepted;
      none is never accepted.
    status: out-of-scope
    out_of_scope_reason: |
      client_secret_jwt is intentionally not supported.
      docs/plans/002-product-design.md §"Out-of-scope" (line 2159)
      records the policy: shared-secret JWT auth (HS256/384/512)
      broadens the blast radius of a leaked secret without offering
      anything private_key_jwt does not, and is incompatible with the
      §J.5 ES256 single-policy. Only private_key_jwt and the
      secret-derived client_secret_basic / client_secret_post are
      accepted.

  - id: CA-CSJWT-16
    severity: P0
    spec: RFC 7591 §2
    behaviour: |
      An expired client_secret_expires_at yields 400 invalid_client
      with description "secret used for the client_assertion is
      expired".
    status: out-of-scope
    out_of_scope_reason: |
      client_secret_jwt is intentionally not supported.
      docs/plans/002-product-design.md §"Out-of-scope" (line 2159)
      records the policy: shared-secret JWT auth (HS256/384/512)
      broadens the blast radius of a leaked secret without offering
      anything private_key_jwt does not, and is incompatible with the
      §J.5 ES256 single-policy. Only private_key_jwt and the
      secret-derived client_secret_basic / client_secret_post are
      accepted.

  - id: CA-CSJWT-17
    severity: P0
    spec: RFC 6749 §2.3
    behaviour: |
      A client whose registered method is none MUST NOT authenticate
      via client_assertion; the request yields 401 invalid_client with
      description "method mismatch", even when the assertion is
      otherwise valid (matching jti, etc.).
    status: out-of-scope
    out_of_scope_reason: |
      client_secret_jwt is intentionally not supported.
      docs/plans/002-product-design.md §"Out-of-scope" (line 2159)
      records the policy: shared-secret JWT auth (HS256/384/512)
      broadens the blast radius of a leaked secret without offering
      anything private_key_jwt does not, and is incompatible with the
      §J.5 ES256 single-policy. Only private_key_jwt and the
      secret-derived client_secret_basic / client_secret_post are
      accepted.

  - id: CA-CSJWT-18
    severity: P1
    spec: OIDC Core §16.19
    behaviour: |
      A client that registers id_token_signed_response_alg=HS* or
      userinfo_signed_response_alg=HS* MUST possess a client_secret;
      registration without one is rejected.
    status: out-of-scope
    out_of_scope_reason: |
      client_secret_jwt and HS-signed responses are intentionally not
      supported. docs/plans/002-product-design.md §"Out-of-scope"
      (line 2159) excludes shared-secret JWT auth, and §J.5
      (line 2163: "ES256 単一") excludes HS*/RS*/PS* signing. The OP
      advertises only id_token_signing_alg_values_supported=["ES256"]
      and rejects clients registering id_token_signed_response_alg=HS*
      / userinfo_signed_response_alg=HS* upstream of this row.

  - id: CA-PKJWT-01
    severity: P0
    spec: RFC 7523 §3 / OIDC Core §9
    behaviour: |
      Assertions signed with RS256, PS256, ES256, or EdDSA are accepted
      (the JOSE allow-list at internal/jose/jose.go's
      allowedV4Algorithms). HS* algorithms MUST be rejected for
      private_key_jwt: the parser refuses the alg before any key
      resolution runs, so even a successfully-forged HS256 assertion
      collapses onto the canonical 401 invalid_client
      "client authentication failed" wire shape per §5.2 — no detail
      is leaked about why the alg was rejected.
    status: active

  - id: CA-PKJWT-02
    severity: P0
    spec: RFC 7523 §3
    behaviour: |
      Required claims iss, sub, aud, jti, and exp are enforced by
      validateAssertionClaims (internal/clientauth/assertion.go). Each
      missing claim collapses onto ErrAssertionMalformed which the
      HTTP layer maps to the canonical 401 invalid_client
      "client authentication failed" template — the wire shape is
      uniform across the five drop variants so a probe cannot
      enumerate which claim was missing.
    status: active

  - id: CA-PKJWT-03
    severity: P0
    spec: RFC 7523 §3
    behaviour: |
      iss == sub == client_id; any other combination yields
      401 invalid_client with the canonical
      "client authentication failed" description. The wire shape
      mirrors CA-PKJWT-02 — claim-mismatch and missing-claim cases
      collapse onto the same template.
    status: active

  - id: CA-PKJWT-04
    severity: P0
    spec: RFC 7523 §3 / OIDC Core §9 / FAPI 2.0 §5.2.2
    behaviour: |
      aud is accepted when it matches the absolute token endpoint URL
      or the issuer URL — either as a string or inside a JSON array.
      The verifier wires AuxAudiences = {issuer, PAR endpoint} so
      OIDC Core §9 (aud == token endpoint) and FAPI 2.0 §5.2.2
      (aud == issuer) clients both authenticate against one OP. Any
      other aud value yields 401 invalid_client with the canonical
      "client authentication failed" description.
    status: active

  - id: CA-PKJWT-05
    severity: P0
    spec: OIDC Core §10 / RFC 7517
    behaviour: |
      The client's verification key is sourced from its registered
      inline JWKs (store.Client.JWKs). When the registered JWK Set is
      present, the verifier iterates every entry in the set and
      accepts the first key whose Verify succeeds; an assertion
      signed with a keypair that is not in the set yields 401
      invalid_client with the canonical "client authentication failed"
      description. JWKsURI fetching is documented as a follow-up in
      internal/clientauth/store_jwks.go and not yet exercised by this
      row.
    status: active

  - id: CA-PKJWT-06
    severity: P0
    spec: RFC 7515 §4.1.4
    behaviour: |
      The OP does NOT use the JWS "kid" header to filter the
      registered JWKS — verifySignature
      (internal/clientauth/assertion.go:153) iterates every key in the
      set and accepts the first one whose Verify succeeds. So
      "kid mismatch" only manifests when both the kid AND the
      underlying key material map to no registered entry; the
      verifier rejects with the canonical 401 invalid_client
      "client authentication failed" description. The response
      MUST NOT echo "no matching key" — that wording would let a
      probe of kid values enumerate the registered key set, which is
      the §5.2 oracle-resistance property the catalog pins.
    status: active

  - id: CA-PKJWT-07
    severity: P0
    spec: RFC 7523 §3
    behaviour: |
      jti is single-use through the assertion's exp; replay yields
      401 invalid_client with the canonical
      "client authentication failed" description (the OP maps
      store.ErrAlreadyConsumed to ErrAssertionReplayed which the HTTP
      layer collapses onto the generic template). This is the
      primary replay defence and requires OP-side storage.
    notes: |
      Multi-node OPs MUST share the jti store, otherwise replay
      across nodes is undetectable.
    status: active

  - id: CA-PKJWT-08
    severity: P0
    spec: RFC 7523 §3 / RFC 7519 §4.1.4
    behaviour: |
      iat / nbf / exp comparisons tolerate small clock skew via
      PrivateKeyJWTVerifier.Leeway. The implementation defaults to
      60 seconds when zero is passed (assertion.go:118-120), so an
      assertion whose iat lands far outside the 60-second window —
      e.g. 5 minutes in the future — is rejected with 401
      invalid_client. v0.x does not expose a public knob to widen
      the leeway; the verifier swap point is the
      [op.Provider]'s public store override.
    notes: |
      The 60-second default mirrors the JAR / id_token verifier
      leeway and the OFCS ofcs-clock-skew test envelope.
    status: active

  - id: CA-PKJWT-09
    severity: P0
    spec: OIDC Core §9
    behaviour: |
      v0.x [store.Client] does not carry a per-client
      TokenEndpointAuthSigningAlg field. Per-client alg pinning is
      therefore implicit: a client whose registered JWK Set only
      contains EC P-256 keys cannot authenticate with an RS256 / PS256
      / EdDSA signature because no registered key would verify, and
      a foreign keypair of the same alg fails for the same reason
      (signature does not verify against any registered key). Both
      reject paths surface the canonical 401 invalid_client
      "client authentication failed" wire shape.
    notes: |
      Explicit per-client TokenEndpointAuthSigningAlg pinning lands
      when the store record is extended; this row's wording will
      tighten then.
    status: active

  - id: CA-PKJWT-10
    severity: P0
    spec: OIDC Discovery §3
    behaviour: |
      The OP advertises
      token_endpoint_auth_signing_alg_values_supported = [RS256,
      PS256, ES256, EdDSA] (internal/discovery/build.go:349) and the
      JOSE parser
      (internal/jose/jose.go's allowedV4Algorithms) enforces the
      same list. An assertion outside the list — HS256 is the
      canonical example — is rejected at parse time with the
      canonical 401 invalid_client "client authentication failed"
      wire shape; no description echoes the offending alg so a
      probe cannot enumerate the allow-list.
    status: active

  - id: CA-PKJWT-11
    severity: P0
    spec: RFC 7518 §6.4
    behaviour: |
      Symmetric (kty=oct) keys MUST NEVER be honoured for
      private_key_jwt verification — even when the client has
      registered an inline oct JWK and the assertion is signed
      with that key's material. The JOSE allow-list rejects HS*
      before any key resolution runs, so the registered oct key is
      never consulted; the OP returns the canonical 401
      invalid_client "client authentication failed" wire shape.
    status: active

  - id: CA-MTLS-PKI-01
    severity: P0
    spec: RFC 8705 §2.1
    behaviour: |
      The OP retrieves the proxy-supplied client certificate and
      treats CA validation success (equivalent to certificateAuthorized
      returning true) as a precondition for authentication.

  - id: CA-MTLS-PKI-02
    severity: P0
    spec: RFC 8705 §2.1.2
    behaviour: |
      A client may register exactly one of tls_client_auth_subject_dn,
      tls_client_auth_san_dns, tls_client_auth_san_uri,
      tls_client_auth_san_ip, or tls_client_auth_san_email; declaring
      more than one yields invalid_client_metadata.

  - id: CA-MTLS-PKI-03
    severity: P0
    spec: RFC 8705 §2.1
    behaviour: |
      The registered metadata value MUST exactly match the
      corresponding SAN/Subject DN field in the presented certificate;
      mismatch yields 401 invalid_client.

  - id: CA-MTLS-PKI-04
    severity: P0
    spec: RFC 8705 §2.1
    behaviour: |
      When no client certificate is forwarded by the proxy, the OP
      returns 401 invalid_client.

  - id: CA-MTLS-PKI-05
    severity: P0
    spec: RFC 8705 §2.1
    behaviour: |
      When proxy-side TLS validation failed (e.g. the
      x-ssl-client-verify header is not SUCCESS), the OP returns
      401 invalid_client.

  - id: CA-MTLS-PKI-06
    severity: P0
    spec: RFC 8705 §2.1.2 / RFC 4514 / RFC 5280 §4.1.2.4
    behaviour: |
      tls_client_auth_subject_dn comparison normalises both values to
      RFC 4514 LDAP DN canonical form before comparing; OpenSSL-style
      ("/CN=...") and RFC 4514 forms ("CN=...,O=..."), attribute
      order, quoting, escaping, and case-insensitive OID aliases
      (e.g. E vs EmailAddress) MUST resolve to equal canonical forms.
      Implementations decode ASN.1 DER and re-encode canonically
      before byte comparison.
    notes: |
      Naive byte comparison is unsafe; canonicalisation is mandatory.

  - id: CA-MTLS-PKI-07
    severity: P0
    spec: RFC 8705 §2.1.2 / RFC 5280 §4.2.1.6
    behaviour: |
      tls_client_auth_san_dns comparison distinguishes IDN A-labels
      from U-labels and matches ASCII case-insensitively per DNS
      rules.

  - id: CA-MTLS-PKI-08
    severity: P0
    spec: RFC 8705 §2.1.2
    behaviour: |
      tls_client_auth_san_uri MUST be exact-match including path,
      query, and fragment.

  - id: CA-MTLS-PKI-09
    severity: P1
    spec: RFC 8705 §2.1.2 / RFC 5952
    behaviour: |
      tls_client_auth_san_ip comparison normalises IPv4 / IPv6
      strings (e.g. RFC 5952 IPv6 compression) before comparing.

  - id: CA-MTLS-PKI-10
    severity: P1
    spec: RFC 5280 §4.2.1.6 / RFC 5321 §2.4
    behaviour: |
      tls_client_auth_san_email follows rfc822Name case rules:
      local-part is case-sensitive, domain is case-insensitive.

  - id: CA-MTLS-PKI-11
    severity: P1
    spec: RFC 8705 §2
    behaviour: |
      The OP exposes embedder hooks getCertificate(ctx) and
      certificateAuthorized(ctx) so certificate retrieval and trust
      anchoring stay framework-agnostic.

  - id: CA-MTLS-PKI-12
    severity: P1
    spec: RFC 8705 §5
    behaviour: |
      When mTLS is enabled, discovery advertises
      mtls_endpoint_aliases.

  - id: CA-MTLS-SS-01
    severity: P0
    spec: RFC 8705 §2.2
    behaviour: |
      Authentication succeeds when the SHA-256 thumbprint of the
      presented client certificate matches a registered JWK's
      x5t#S256 (or the thumbprint computed from that JWK's public
      key) in the client's jwks or jwks_uri.

  - id: CA-MTLS-SS-02
    severity: P0
    spec: OIDC Core §10.1.1
    behaviour: |
      When the cached jwks_uri document is stale, the OP refetches
      and re-verifies before failing.

  - id: CA-MTLS-SS-03
    severity: P0
    spec: RFC 8705 §2.2
    behaviour: |
      Certificates carrying RSA, EC (P-256, P-384, P-521), or Ed25519
      keys MUST be accepted.

  - id: CA-MTLS-SS-04
    severity: P0
    spec: RFC 8705 §2.2
    behaviour: |
      When no key in the registered jwks matches the certificate
      thumbprint, the OP returns 401 invalid_client.

  - id: CA-MTLS-SS-05
    severity: P0
    spec: RFC 8705 §2.2
    behaviour: |
      When the certificate cannot be obtained from the proxy, the OP
      returns 401 invalid_client.

  - id: CA-MTLS-SS-06
    severity: P1
    spec: RFC 8705 §2.2
    behaviour: |
      tls_client_auth_* metadata fields MUST NOT be combined with
      self_signed_tls_client_auth registration; mixed registration
      yields invalid_client_metadata.

  - id: CA-ATT-01
    severity: P0
    spec: draft-ietf-oauth-attestation-based-client-auth §4
    behaviour: |
      The request MUST carry both the OAuth-Client-Attestation header
      (the attestation JWT) and the OAuth-Client-Attestation-PoP
      header (the PoP JWT).
    status: out-of-scope
    out_of_scope_reason: |
      Attestation-based client authentication
      (draft-ietf-oauth-attestation-based-client-auth) is intentionally
      not implemented in v1.0. The spec is an IETF draft, has no entry
      in docs/plans/002-product-design.md, and duplicates the threat
      model already covered by private_key_jwt for the in-scope use
      cases. Revisit when the draft is promoted to RFC and embedder
      demand surfaces.

  - id: CA-ATT-02
    severity: P0
    spec: draft-ietf-oauth-attestation-based-client-auth §4
    behaviour: |
      The attestation JWT MUST carry typ=oauth-client-attestation+jwt
      and the PoP MUST carry typ=oauth-client-attestation-pop+jwt;
      mismatched typ values yield 401 invalid_client.
    status: out-of-scope
    out_of_scope_reason: |
      Attestation-based client authentication
      (draft-ietf-oauth-attestation-based-client-auth) is intentionally
      not implemented in v1.0. The spec is an IETF draft, has no entry
