  - id: CA-DISC-01
    severity: P0
    spec: OIDC Discovery §3
    behaviour: |
      Only authentication methods that are actually enabled are
      published in token_endpoint_auth_methods_supported. The default
      v1.0 list is client_secret_basic, client_secret_post, and
      private_key_jwt; client_secret_jwt and attestation-based methods
      are intentionally absent (both are out-of-scope per
      docs/plans/002-product-design.md line 2159).

  - id: CA-DISC-02
    severity: P0
    spec: OIDC Discovery §3
    behaviour: |
      token_endpoint_auth_signing_alg_values_supported is published
      whenever an assertion-bearing client authentication method is
      enabled. v1.0 supports private_key_jwt only (client_secret_jwt
      is out-of-scope per docs/plans/002-product-design.md line
      2159), so the field is published whenever private_key_jwt
      remains in token_endpoint_auth_methods_supported.

  - id: CA-DISC-03
    severity: P0
    spec: OIDC Core §9
    behaviour: |
      When client_secret_jwt is enabled, only HMAC algs (HS256,
      HS384, HS512) appear in
      token_endpoint_auth_signing_alg_values_supported. When HMAC is
      excluded from enabledJWA, client_secret_jwt itself is disabled.
    status: out-of-scope
    out_of_scope_reason: |
      client_secret_jwt is intentionally not supported.
      docs/plans/002-product-design.md §"Out-of-scope" (line 2159)
      records the policy: shared-secret JWT auth (HS256/384/512)
      broadens the blast radius of a leaked secret without offering
      anything private_key_jwt does not, and is incompatible with the
      §J.5 ES256 single-policy. Only private_key_jwt and the
      secret-derived client_secret_basic / client_secret_post are
      accepted, so the HMAC-only alg advertisement this row describes
      never appears on the wire.

  - id: CA-DISC-04
    severity: P0
    spec: OIDC Core §9
    behaviour: |
      When private_key_jwt is enabled, only asymmetric algs (RS, PS,
      ES, EdDSA) are published in
      token_endpoint_auth_signing_alg_values_supported; HMAC algs
      (HS256/384/512) MUST NOT appear because client_secret_jwt is
      out-of-scope per docs/plans/002-product-design.md line 2159.

  - id: CA-DISC-05
    severity: P1
    spec: OIDC Discovery §3
    behaviour: |
      When both client_secret_jwt and private_key_jwt are enabled,
      the union of HMAC and asymmetric algs is published.
    status: out-of-scope
    out_of_scope_reason: |
      client_secret_jwt is intentionally not supported.
      docs/plans/002-product-design.md §"Out-of-scope" (line 2159)
      records the policy: shared-secret JWT auth (HS256/384/512)
      broadens the blast radius of a leaked secret without offering
      anything private_key_jwt does not, and is incompatible with the
      §J.5 ES256 single-policy. With csjwt out of the picture there
      is no "union of HMAC and asymmetric algs" wire shape to assert;
      the asymmetric-only advertisement is covered by CA-DISC-04.

  - id: CA-DISC-06
    severity: P1
    spec: RFC 7009 §4.1 / RFC 7662 §2
    behaviour: |
      revocation_endpoint_auth_methods_supported and
      introspection_endpoint_auth_methods_supported are published in
      parity with the token endpoint.

  - id: CA-DISC-07
    severity: P1
    spec: RFC 8705 §5
    behaviour: |
      mtls_endpoint_aliases is published only when mTLS is enabled,
      so the cert-binding endpoint family is advertised separately.

  - id: CA-ERR-01
    severity: P0
    spec: RFC 6749 §5.2
    behaviour: |
      Client authentication failure returns error=invalid_client with
      HTTP 401. WWW-Authenticate=Basic is emitted only when the
      failed mechanism was Basic; form-based authentication failures
      return 401 without a WWW-Authenticate header.

  - id: CA-ERR-02
    severity: P1
    spec: RFC 6749 §5.2
    behaviour: |
      error_description MUST be a short message that does not leak
      internal state; OP-internal detail stays in the error_detail
      log surface.

  - id: CA-ERR-03
    severity: P0
    spec: RFC 6749 §10.4
    behaviour: |
      Response timing for invalid secrets and unknown clients MUST be
      equalised (length-constant compare and a shared error path) to
      prevent timing oracles.

  - id: CA-ERR-04
    severity: P1
    spec: OWASP ASVS V2
    behaviour: |
      Authentication-flow rate limiting (per-IP / per-client_id
      consecutive failure throttling) belongs to the OP; general HTTP
      rate limiting is delegated to the embedder's reverse proxy or
      gateway.
    status: out-of-scope
    out_of_scope_reason: |
      The OP only ships authentication-flow (user-login) brute-force
      gating in v1.0; client-authentication-flow throttling is not
      implemented. CLAUDE.md "ライブラリ性の核" pins the rate-limit
      scope: "OP は authentication-flow brute-force gate のみ"
      ("the OP owns the authentication-flow brute-force gate only").
      No op/store.Client field tracks consecutive failure counters,
      no internal rate-limiter sits on the token endpoint's
      client-authentication path, and no embedder demand has surfaced
      to justify the bookkeeping. Revisiting requires both a demand
      signal from an embedder and a design ADR (the policy choice
      between per-IP vs per-client_id, the lockout window, and the
      rate-limit-bypass override are non-trivial).

  - id: CA-ERR-05
    severity: P1
    spec: RFC 8417
    behaviour: |
      An audit event client_authn.failure is emitted on every
      failure (carrying method, reason, and client_id only when the
      client_id is known).
