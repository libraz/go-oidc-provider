  - id: CA-ATT-05
    severity: P1
    spec: draft-ietf-oauth-attestation-based-client-auth §4.2
    behaviour: |
      When PoP aud is an array it MUST contain exactly one element,
      and the value MUST equal the OP's issuer.
    status: out-of-scope
    out_of_scope_reason: |
      Attestation-based client authentication
      (draft-ietf-oauth-attestation-based-client-auth) is intentionally
