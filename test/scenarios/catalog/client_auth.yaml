  - id: CA-ATT-04
    severity: P0
    spec: draft-ietf-oauth-attestation-based-client-auth §4.2
    behaviour: |
      The PoP requires iss (client_id), aud (issuer), jti, and
      challenge (a value previously issued by the OP). exp is
      RECOMMENDED.
    status: out-of-scope
    out_of_scope_reason: |
      Attestation-based client authentication
      (draft-ietf-oauth-attestation-based-client-auth) is intentionally
      not implemented in v1.0. The spec is an IETF draft, has no entry
      in docs/plans/002-product-design.md, and duplicates the threat
