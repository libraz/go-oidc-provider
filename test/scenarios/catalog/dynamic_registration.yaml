# yaml-language-server: $schema=./schema.json
feature: dynamic_registration
prefix: DCR
title: Dynamic Client Registration
specs:
  - RFC 7591 — OAuth 2.0 Dynamic Client Registration Protocol
  - OpenID Connect Dynamic Client Registration 1.0
  - RFC 6749 §2 — Client Types
  - RFC 8414 §2 — Authorization Server Metadata (registration_endpoint)

description: |
  Client metadata registration lifecycle exposed via POST /reg. Covers
  endpoint behaviour, default values, client_secret issuance rules,
  Initial Access Token (IAT) handling, Registration Access Token (RAT)
  issuance, ctx.oidc.entities population, coexistence with static
  clients, GET /reg/:id retrieval, metadata validation, and error
  shape.

rows:
  - id: DCR-EP-01
    severity: P0
    spec: RFC 7591 §3.2
    behaviour: |
      A successful POST /reg returns 201 Created with the registered
      client metadata as a JSON body and Cache-Control: no-store.
    status: active

  - id: DCR-EP-02
    severity: P0
    spec: RFC 7591 §2
    behaviour: |
      Only application/json is accepted as the request Content-Type.
      Other media types (e.g. application/x-www-form-urlencoded) are
      rejected with 400 invalid_request.
    status: active

  - id: DCR-EP-03
    severity: P0
    spec: OIDC DCR §2
    behaviour: |
      A request missing redirect_uris is rejected with 400
      invalid_redirect_uri ("redirect_uris is mandatory property"),
      because OIDC requires it.
    status: active

  - id: DCR-EP-04
    severity: P0
    spec: RFC 7591 §3.2.2
    behaviour: |
      Invalid enum values (e.g. an unknown grant_type) are rejected
      with 400 invalid_client_metadata and a description naming the
      offending field.
    status: active

  - id: DCR-EP-05
    severity: P1
    spec: RFC 7591
    behaviour: |
      Valid input causes the OP to call Adapter.upsert("Client", id,
      payload) exactly once. Duplicate upserts are detectable in tests.
    status: pending

  - id: DCR-EP-06
    severity: P1
    spec: OP audit
    behaviour: |
      A registration_create.success audit event is emitted exactly
      once per successful registration.
    status: pending

  - id: DCR-DEF-01
    severity: P0
    spec: OIDC DCR §2
    behaviour: |
      When application_type is omitted, the OP defaults it to "web".
    status: active

  - id: DCR-DEF-02
    severity: P0
    spec: OIDC DCR §2
    behaviour: |
      When id_token_signed_response_alg is omitted, the OP defaults it
      to "RS256".
    status: out-of-scope
    out_of_scope_reason: "v1.0 ships ES256-only id_token signing (internal/registrationendpoint/metadata.go validateIDTokenAlg accepts only ES256, defaultIDTokenAlg = ES256). RS256 is not on the v1.0 surface — it would be rejected with invalid_client_metadata, not silently defaulted. The 'defaults to RS256' contract is non-spec residue."

  - id: DCR-DEF-03
    severity: P0
    spec: OIDC DCR §2
    behaviour: |
      When token_endpoint_auth_method is omitted, the OP defaults it
      to "client_secret_basic".
    status: active

  - id: DCR-DEF-04
    severity: P1
    spec: OIDC DCR §2
    behaviour: |
      When require_auth_time is omitted, the OP defaults it to false.
    status: pending

  - id: DCR-DEF-05
    severity: P0
    spec: OIDC DCR §2
    behaviour: |
      When grant_types is omitted, the OP defaults it to
      ["authorization_code"].
    status: active

  - id: DCR-DEF-06
    severity: P0
    spec: OIDC DCR §2
    behaviour: |
      When response_types is omitted, the OP defaults it to ["code"].
    status: active

  - id: DCR-DEF-07
    severity: P0
    spec: RFC 7591 §3
    behaviour: |
      The OP generates client_id; the value MUST be unique and MUST
      NOT collide with any existing client.
    status: active

  - id: DCR-DEF-08
    severity: P0
    spec: RFC 7591 §3.2.1
    behaviour: |
      A response containing client_secret_expires_at: 0 means the
      secret never expires.
    status: active

  - id: DCR-DEF-09
    severity: P1
    spec: RFC 7591 §3.2.1
    behaviour: |
      client_id_issued_at carries the Unix epoch timestamp of
      registration.
    status: pending

  - id: DCR-SEC-01
    severity: P0
    spec: OIDC DCR §2
    behaviour: |
      When token_endpoint_auth_method=none and the client does not
      request any HMAC alg, no client_secret is issued and the field
      itself is omitted from the response.
    status: active

  - id: DCR-SEC-02
    severity: P0
    spec: RFC 7591 §2
    behaviour: |
      In the DCR-SEC-01 case, even if the request body carries
      client_secret or client_secret_expires_at the OP MUST ignore
      them and never persist them to the store.
    status: active

  - id: DCR-SEC-03
    severity: P0
    spec: OIDC Core §16.19
    behaviour: |
      When id_token_signed_response_alg requests an HS* algorithm, the
      OP issues a client_secret because an HMAC key is required.
    status: out-of-scope
    out_of_scope_reason: "v1.0 enforces id_token_signed_response_alg = ES256 only (internal/registrationendpoint/metadata.go validateIDTokenAlg). HS-family algorithms are rejected with invalid_client_metadata before reaching any client_secret-issuance branch; the 'HS* alg forces a secret' coupling has no v1.0 wire path. The contract is non-spec residue (its OP supported HS256/HS384/HS512 for clients and minted secrets to back the HMAC key)."

  - id: DCR-SEC-04
    severity: P0
    spec: OIDC Core §16.19
    behaviour: |
      When userinfo_signed_response_alg or request_object_signing_alg
      requests an HS* algorithm, the OP issues a client_secret on the
      same grounds as DCR-SEC-03.
    status: out-of-scope
    out_of_scope_reason: "Same root cause as DCR-SEC-03: v1.0 rejects HS* algorithms across the JWA surface. userinfo_signed_response_alg is not exposed in op.ClientMetadata or registrationendpoint.ClientMetadata, and request_object_signing_alg is gated by validateRequestObjectSigningAlg to {RS256, PS256, ES256, EdDSA} — HS variants never reach the secret-issuance fork. The 'HS forces secret' contract is non-spec residue."

  - id: DCR-SEC-05
    severity: P0
    spec: OIDC DCR §2
    behaviour: |
      When token_endpoint_auth_method is client_secret_basic,
      client_secret_post, or client_secret_jwt, the OP issues a
      client_secret.
    status: active

  - id: DCR-SEC-06
    severity: P0
    spec: NIST SP 800-63B / OWASP
    behaviour: |
      Generated client_secret values MUST carry at least 256 bits of
      entropy and MUST be drawn from crypto/rand only; math/rand is
      forbidden.
    status: active

  - id: DCR-SEC-07
    severity: P1
    spec: OWASP ASVS V8
    behaviour: |
      A client_secret MUST NOT appear in plaintext in OP caches or
      logs; the value is masked through its String() method.
    status: pending

  - id: DCR-IAT-01
    severity: P0
    spec: RFC 7591 §3
    behaviour: |
      With OP setting initialAccessToken set to a fixed string, the
      client MUST present it via Authorization: Bearer <token>; an
      access_token field in the request body is not honoured.
    status: out-of-scope
    out_of_scope_reason: "non-spec residue: 'initialAccessToken set to a fixed string' is an upstream's adminRegistration shortcut (a single hard-coded string in OP config grants registration). v1.0 has no fixed-string IAT mode — every IAT is adapter-managed via Provider.IssueInitialAccessToken (op/registration.go:453); RegistrationOption has no string-shaped IAT field. The wire shape this row asserts is not exercisable at v1.0's surface."

  - id: DCR-IAT-02
    severity: P0
    spec: RFC 7591 §3
    behaviour: |
      With OP setting initialAccessToken set to true, the OP requires
      adapter-managed Initial Access Token entities (model
      InitialAccessToken).
    status: out-of-scope
    out_of_scope_reason: "non-spec residue: 'initialAccessToken set to true' is an upstream's toggle that enables adapter-managed IATs; v1.0 has no such toggle — calling op.WithDynamicRegistration always wires adapter-managed IATs via store.InitialAccessTokenStore. There is no 'string vs bool' configuration switch to test against; the boolean-toggle row has no v1.0 wire equivalent (the adapter-managed path itself is exercised by DCR-IAT-04 / DCR-IAT-07)."

  - id: DCR-IAT-03
    severity: P1
    spec: RFC 7591 §3
    behaviour: |
      The OP exposes an API to mint IAT entities
      (new InitialAccessToken({expiresIn?, policies?}).save()); when
      expiresIn is absent the IAT never expires.
    status: pending

  - id: DCR-IAT-04
    severity: P0
    spec: RFC 6750 §3.1 / RFC 7591 §3
    behaviour: |
      A missing or invalid IAT yields 401 invalid_token with
      description "no access token provided" or "invalid token
      provided".
    status: active

  - id: DCR-IAT-05
    severity: P1
    spec: RFC 7591 §3
    behaviour: |
      When IAT validation succeeds, the OP attaches the IAT entity to
      ctx.oidc.entities.InitialAccessToken so downstream policies can
      reference it.
    status: pending

  - id: DCR-IAT-06
    severity: P1
    spec: OWASP / RFC 7591 §5.2
    behaviour: |
      Public DCR (initialAccessToken undefined) is a supported mode
      but discouraged in production deployments.
    status: pending

  - id: DCR-IAT-07
    severity: P0
    spec: RFC 6750 §3.1
    behaviour: |
      A manipulated IAT (e.g. truncated tail) yields 401
      invalid_token.
    status: active

  - id: DCR-RAT-01
    severity: P0
    spec: RFC 7592 §3
    behaviour: |
      By default, the OP issues a Registration Access Token and
      returns registration_access_token together with
      registration_client_uri in the response.
    status: active

  - id: DCR-RAT-02
    severity: P1
    spec: RFC 7592 §3
    behaviour: |
      OP setting issueRegistrationAccessToken=false (or a function
      returning false) suppresses RAT issuance; the response omits
      both registration_access_token and registration_client_uri.
    status: pending

  - id: DCR-RAT-03
    severity: P1
    spec: OP configuration
    behaviour: |
      OP setting issueRegistrationAccessToken=true (or a function
      returning true) issues a RAT, equivalent to DCR-RAT-01.
    status: pending

  - id: DCR-RAT-04
    severity: P0
    spec: RFC 7592 §2
    behaviour: |
      A RAT is bound to its issuing client_id; using it under another
      client_id yields 401 (covered in detail by the registration
      management catalog).
    status: active

  - id: DCR-CTX-01
    severity: P1
    spec: OP design
    behaviour: |
      On success, ctx.oidc.entities contains Client and (when issued)
      RegistrationAccessToken.
    status: pending

  - id: DCR-CTX-02
    severity: P1
    spec: OP design
    behaviour: |
      When IAT is in use, ctx.oidc.entities also includes
      InitialAccessToken.
    status: pending

  - id: DCR-CTX-03
    severity: P2
    spec: OP design
    behaviour: |
      When RAT issuance is suppressed, ctx.oidc.entities does not
      include RegistrationAccessToken.
    status: pending

  - id: DCR-STATIC-01
    severity: P0
    spec: OP design
    behaviour: |
      Adapter.find("Client", id) returns static and DCR-issued records
      indistinguishably; the only difference between them is their
      metadata.
    status: active

  - id: DCR-STATIC-02
    severity: P0
    spec: RFC 7592 §2
    behaviour: |
      Static clients never receive a RAT; read, update, and delete
      against them is rejected (see RM-01-FORBID in the registration
      management catalog).
    status: active

  - id: DCR-GET-01
    severity: P0
    spec: RFC 7592 §2.1
    behaviour: |
      GET /reg/:id requires the RAT to be presented via Authorization:
      Bearer; passing access_token in the query string is not
      accepted.
    status: active

  - id: DCR-GET-02
    severity: P0
    spec: RFC 7592 §2.1
    behaviour: |
      The 200 response carries every non-secret metadata field;
      client_secret is included only when the registered authentication
      method requires it.
    status: active

  - id: DCR-GET-03
    severity: P1
    spec: RFC 7592 §2.1
    behaviour: |
      The response sets Cache-Control: no-store.
    status: pending

  - id: DCR-GET-04
    severity: P0
    spec: RFC 7592 §2 / security hardening
    behaviour: |
      Presenting a RAT bound to a different client_id yields 401, the
      mis-used RAT is destroyed automatically, and the OP emits a
      registration_access_token.destroyed event.
    status: out-of-scope
    out_of_scope_reason: "non-spec residue: an upstream's RFC 7592 hardening auto-destroys the mis-used RAT and emits a 'registration_access_token.destroyed' event on cross-client replay. v1.0's verifyRAT (internal/registrationendpoint/rat.go) only emits dcr.rat.invalid and returns 401; it deliberately does NOT cascade-delete the RAT (auto-destroy on first detection is itself a DoS vector — an attacker who learns a valid RAT could replay it cross-client to nuke the legitimate owner's RAT). The auto-destroy + named-event contract is vendor-specific and intentionally not implemented; the 401 wire shape is exercised by DCR-RAT-04."

  - id: DCR-GET-05
    severity: P0
    spec: RFC 6750 §3.1
    behaviour: |
      A manipulated RAT yields 401 invalid_token.
    status: active

  - id: DCR-GET-06
    severity: P0
    spec: RFC 7592 §2.1
    behaviour: |
      Accessing a static client's record (even with an adapter-minted
      RAT) yields 403 invalid_request with description "client does
      not have permission to read its record".
    status: out-of-scope
    out_of_scope_reason: "non-spec residue: an upstream returns 403 invalid_request 'client does not have permission to read its record' when a static client's record is read with an adapter-minted RAT, distinguishing 'wrong-shape client' from 'wrong RAT'. v1.0's verifyRAT folds the static-client case into the same 401 invalid_token 'registration access token is invalid' response as every other RAT-validation failure (defence in depth: enumeration must not distinguish 'static client exists but is not RFC 7592 manageable' from 'RAT does not match'). The 403 + wording the row asserts is vendor-specific; v1.0 returns 401 with a stable description as the security-hardened equivalent."

  - id: DCR-VAL-01
    severity: P0
    spec: RFC 6749 §3.1.2 / OIDC DCR §2
    behaviour: |
      redirect_uris MUST be an array with at least one entry; each
      value MUST be a registrable URI (no fragment, etc.).
    status: active

  - id: DCR-VAL-02
    severity: P0
    spec: OIDC Core §2
    behaviour: |
      For application_type=web, every redirect_uri MUST use https.
      For application_type=native, only loopback http and custom URI
      schemes are allowed.
    status: active

  - id: DCR-VAL-03
    severity: P0
    spec: RFC 7591 §2 / RFC 7592 §2
    behaviour: |
      grant_types values MUST be members of the OP's supported set;
      unsupported values are rejected with 400 invalid_client_metadata.
    status: active

  - id: DCR-VAL-04
    severity: P0
    spec: OIDC Core §3
    behaviour: |
      response_types MUST be consistent with grant_types
      (authorization_code <-> code, implicit <-> id_token / token,
      hybrid <-> code id_token, etc.).
    status: out-of-scope
    out_of_scope_reason: "v1.0's WithDynamicRegistration AllowedResponseTypes accepts only {'code'} (op/registration.go validateRegistrationOption); any other value is rejected at construction time. AllowedGrantTypes accepts only {authorization_code, refresh_token} via registrationGrantAllowed. The grant/response_type consistency rule (validateGrantResponseTypeConsistency) cannot be exercised through the public surface — every input combination that would trip the consistency rule (implicit / hybrid / token-only response_types) is rejected earlier by the AllowedResponseTypes whitelist with the same invalid_client_metadata code. No public seam to drive the consistency-rule branch."

  - id: DCR-VAL-05
    severity: P0
    spec: OIDC Core §16.5
    behaviour: |
      jwks and jwks_uri MUST NOT be supplied simultaneously.
    status: active

  - id: DCR-VAL-06
    severity: P0
    spec: OIDC Core §8.1
    behaviour: |
      sector_identifier_uri MUST use https, MUST return a JSON array,
      and the array MUST contain every entry from redirect_uris.
    status: active

  - id: DCR-VAL-07
    severity: P0
    spec: OIDC Core §8.1
    behaviour: |
      For subject_type=pairwise without sector_identifier_uri, all
      redirect_uris MUST share the same host.
    status: out-of-scope
    out_of_scope_reason: "v1.0 does not yet implement op.WithPairwiseSubject (op/op.go:757 hard-codes PairwiseEnabled = false). Every subject_type=pairwise registration is rejected at validateSubjectType with invalid_client_metadata 'subject_type pairwise requires WithPairwiseSubject'; the per-host homogeneity rule (validatePairwiseMetadata) is unreachable through public configuration. Re-bind once WithPairwiseSubject ships."

  - id: DCR-VAL-08
    severity: P0
    spec: RFC 8705 §2.1.2
    behaviour: |
      tls_client_auth_* fields are only meaningful with
      token_endpoint_auth_method=tls_client_auth, and exactly one of
      them MUST be supplied.
    status: out-of-scope
    out_of_scope_reason: v1.0 does not implement RFC 8705 tls_client_auth / self_signed_tls_client_auth; validateAuthMethod (internal/registrationendpoint/metadata.go) admits only client_secret_basic, client_secret_post, private_key_jwt, and none. tls_client_auth_subject_dn / _san_dns / _san_uri / _san_ip / _san_email metadata fields are not on op.ClientMetadata. The exclusivity rule the row asserts has no v1.0 wire to validate against.

  - id: DCR-VAL-09
    severity: P0
    spec: OIDC Core §16
    behaviour: |
      Encryption-related alg fields (e.g.
      id_token_encrypted_response_alg) MUST be members of the OP's
      enabledJWA set.
    status: out-of-scope
    out_of_scope_reason: "v1.0 does not expose id_token_encrypted_response_alg / userinfo_encrypted_response_alg / request_object_encryption_alg metadata fields — op.ClientMetadata and registrationendpoint.ClientMetadata carry no encryption alg fields, and the JOSE pipeline (internal/jose) does not implement encrypted-response shaping. The 'encryption-related alg fields bounded by enabledJWA' rule has no v1.0 wire path; encryption negotiation itself is OOS pending the JWE encrypter surface."

  - id: DCR-VAL-10
    severity: P1
    spec: OIDC Core §2
    behaviour: |
      default_max_age MUST be a non-negative integer.
    status: pending

  - id: DCR-VAL-11
    severity: P1
    spec: OIDC Core §6
    behaviour: |
      request_object_signing_alg=none is rejected when the OP does
      not support it.
    status: pending

  - id: DCR-ERR-01
    severity: P0
    spec: RFC 7591 §3.2.2
    behaviour: |
      Error codes are limited to invalid_redirect_uri,
      invalid_client_metadata, invalid_request, and invalid_token; no
      other code is emitted.
    status: active

  - id: DCR-ERR-02
    severity: P1
    spec: RFC 6749 §5.2 / RFC 6750 §3
    behaviour: |
      Error responses do not carry WWW-Authenticate, except for the
      Bearer-scheme variant emitted on IAT/RAT validation failure.
    status: pending

  - id: DCR-ERR-03
    severity: P1
    spec: OWASP ASVS V8
    behaviour: |
      Error responses do not leak OP-internal detail.
    status: pending
