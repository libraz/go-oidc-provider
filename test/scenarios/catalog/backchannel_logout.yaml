# yaml-language-server: $schema=./schema.json
feature: backchannel_logout
prefix: BCL
title: Back-Channel Logout
specs:
  - OIDC Back-Channel Logout 1.0
  - OIDC Core 1.0 §2 (ID Token), §3.1.3.6 (`sub` claim)
  - OIDC Discovery 1.0 (`backchannel_logout_supported`, `backchannel_logout_session_supported`)
  - OIDC Front-Channel Logout 1.0 / Session Management 1.0 (`sid` provenance)
  - RFC 8417 (Security Event Token, SET)
  - RFC 7519 (JWT)
  - RFC 7515 (JWS)

description: |
  Back-channel logout token issuance, delivery semantics, discovery
  metadata, and the current sub-only capability contract. Includes
  fan-out behaviour for global and targeted logout; RP-specific `sid`
  propagation remains out of scope until lineage is persisted.

rows:
  - id: BCL-001
    severity: P0
    spec: OIDC BCL §2.4, §2.5 / RFC 8417 §2.2
    behaviour: |
      When the OP issues a logout token to a client registered with
      `backchannel_logout_uri` and `backchannel_logout_session_required=true`,
      it POSTs `application/x-www-form-urlencoded` body
      `logout_token=<JWS>` to the URI. The JOSE header carries
      `typ=logout+jwt` and the payload claims set is exactly
      `{sub, events, iat, exp, aud, iss, jti, sid}` with `events`
      equal to `{ "http://schemas.openid.net/event/backchannel-logout": {} }`,
      `aud` equal to the client_id, `sub` matching the account, and
      `sid` matching the authorization session id.
    status: out-of-scope
    out_of_scope_reason: "The current grant model has no RP-specific SID lineage. Static and dynamic registration reject backchannel_logout_session_required=true, discovery advertises session support as false, and the coordinator emits sub-only Logout Tokens."

  - id: BCL-002
    severity: P1
    spec: OIDC BCL §2.4
    behaviour: |
      When the target client does not require sid
      (`backchannel_logout_session_required` is not true), the issued
      logout token MUST omit the `sid` claim. The payload claim set is
      exactly `{sub, events, iat, exp, aud, iss, jti}` and still
      carries the back-channel logout event identifier.
    status: active

  - id: BCL-003
    severity: P0
    spec: OIDC BCL §2.7
    behaviour: |
      When the RP responds to the logout token POST with a non-2xx
      status (e.g. 500), the OP MUST surface the delivery failure via
      audit event or error result so operators can detect, retry, or
      alarm. Per-RP error state is observable.
    status: active

  - id: BCL-004
    severity: P1
    spec: OIDC BCL §3 / OIDC Discovery §3
    behaviour: |
      When BCL is enabled, GET `/.well-known/openid-configuration`
      includes `end_session_endpoint`,
      `backchannel_logout_supported=true`, and
      `backchannel_logout_session_supported=false`.
    status: active

  - id: BCL-005
    severity: P1
    spec: OIDC BCL §2.1 / OIDC Front-Channel Logout §3
    behaviour: |
      When the authorization endpoint issues an ID Token
      (`response_type=code id_token`, scope includes `openid offline_access`,
      `prompt=consent`) for a BCL-enabled client, the issued ID Token
      payload MUST contain a string `sid` claim.
    status: out-of-scope
    out_of_scope_reason: v1.0 has no RP-specific SID lineage; ID Tokens and coordinator-issued Logout Tokens omit sid.

  - id: BCL-006
    severity: P1
    spec: OIDC BCL §2.1
    behaviour: |
      When the token endpoint issues an ID Token via
      `grant_type=authorization_code` for a BCL-enabled client, the
      issued ID Token payload MUST contain a string `sid` claim.
    status: out-of-scope
    out_of_scope_reason: v1.0 has no RP-specific SID lineage; ID Tokens and coordinator-issued Logout Tokens omit sid.

  - id: BCL-007
    severity: P1
    spec: OIDC BCL §2.1
    behaviour: |
      When the token endpoint issues an ID Token via
      `grant_type=refresh_token` for a BCL-enabled client, the issued
      ID Token payload MUST contain a string `sid` claim.
    status: out-of-scope
    out_of_scope_reason: v1.0 has no RP-specific SID lineage; ID Tokens and coordinator-issued Logout Tokens omit sid.

  - id: BCL-008
    severity: P0
    spec: OIDC BCL §2.6, §2.7
    behaviour: |
      When RP-initiated end_session is confirmed with full-logout
      intent and the session has multiple authorized clients, the OP
      fans out logout token POSTs to every visited client that
      registered a `backchannel_logout_uri`. Each call carries the
      per-client `sid` and the same `sub`, and per-client success and
      failure outcomes are observable independently.
    status: out-of-scope
    out_of_scope_reason: "The grant model cannot recover a per-client SID, so BCL-008's per-client sid requirement is deliberately unsupported. Two-RP sub-only fan-out is covered by internal/backchannel."

  - id: BCL-009
    severity: P1
    spec: OIDC BCL §2.6
    behaviour: |
      When RP-initiated end_session is confirmed without the
      global-logout flag, the OP MUST trigger logout token delivery
      only for the initiating client. Other co-resident clients MUST
      NOT be contacted.
    status: out-of-scope
    out_of_scope_reason: v1.0 /end_session always fans out to every BCL-registered client of the terminating subject; per-client targeted logout is not exposed on the public API.

  - id: BCL-010
    severity: P2
    spec: OIDC BCL §2.4
    behaviour: |
      During global logout, clients that have not registered a
      `backchannel_logout_uri` MUST be skipped: no delivery is
      attempted to them while other BCL-capable clients still receive
      their logout tokens.
    status: active
