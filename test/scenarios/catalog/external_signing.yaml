  - id: ESK-031
    severity: P0
    spec: RFC 6749 §5.2
    behaviour: |
      An external signer permission denial (for example KMS IAM)
      MUST surface as server_error and the OP MUST NOT leak the
      backend error message to the client.
    status: out-of-scope
