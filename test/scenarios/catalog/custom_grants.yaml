# yaml-language-server: $schema=./schema.json
feature: custom_grants
prefix: CG
title: Custom token-endpoint grants
specs:
  - RFC 6749 §4.5 — Extension Grants
  - RFC 6749 §3.2 — Token Endpoint (parameter validation)
  - RFC 6749 §5.2 — Error Response (invalid_request)
  - RFC 8693 — OAuth 2.0 Token Exchange (audience/resource as repeatable parameters; informative)

description: |
  Embedder-registered grant types at the token endpoint via a
  registerGrantType(name, handler, paramNames) hook. Covers
  registration-time options, the default duplicate-parameter rule from
  RFC 6749 §3.2, the dupes-allowed exemption list (e.g. for
  RFC 8693 audience/resource), the carve-out that grant_type itself
  can never be exempted, client opt-in via registered grant_types, and
  the entity-resolution contract on the request context.

rows:
  - id: CG-001
    severity: P1
    spec: RFC 6749 §4.5
    behaviour: |
      The provider MUST expose a registerGrantType(name, handler,
      paramNames) hook; once called, the grant_type MUST appear in
      the supported grant types registry.
    status: active

  - id: CG-002
    severity: P2
    spec: RFC 6749 §4.5
    behaviour: |
      Calling registerGrantType without a paramNames argument MUST
      succeed.
    status: active

  - id: CG-003
    severity: P2
    spec: RFC 6749 §4.5
    behaviour: |
      registerGrantType MUST accept both null and a single-string
      paramNames specification; in both cases the grant type is
      registered.
    status: active

  - id: CG-004
    severity: P0
    spec: RFC 6749 §3.2 (parameters MUST NOT be duplicated)
    behaviour: |
      For a client allowed to use a custom grant, a request whose
      body duplicates a registered parameter (e.g.
      name=John&name=FooBar) MUST be rejected with 400 invalid_request
      and the description "'name' parameter must not be provided
      twice".
    status: active

  - id: CG-005
    severity: P1
    spec: RFC 6749 §3.2 / RFC 8693
    behaviour: |
      When a grant is registered with an explicit dupes-allowed list
      including a parameter, the request MUST succeed with 200 OK
      and the handler MUST receive that parameter as an array of all
      submitted values, preserving order.
    status: active

  - id: CG-006
    severity: P1
    spec: RFC 6749 §3.2
    behaviour: |
      When a grant declares two parameters but exempts only one, a
      request that duplicates the non-exempt parameter MUST be
      rejected with 400 invalid_request and the description
      "'<other>' parameter must not be provided twice".
    status: active

  - id: CG-007
    severity: P0
    spec: RFC 6749 §3.2
    behaviour: |
      grant_type itself MUST NEVER be exempted from the duplication
      rule; a duplicated grant_type MUST be rejected with 400
      invalid_request and the description "'grant_type' parameter
      must not be provided twice", regardless of any exemption
      configuration.
    status: active

  - id: CG-008
    severity: P1
    spec: RFC 6749 §4.5 / RFC 7591 §2
    behaviour: |
      A registered custom grant invoked by a client whose metadata
      grant_types includes it MUST execute the handler and return
      200 OK with a body matching the handler's ctx.body.
    status: active

  - id: CG-009
    severity: P2
    spec: RFC 6749 §4.5
    behaviour: |
      When the custom grant request reaches the handler,
      ctx.oidc.entities MUST resolve the Client only; Account and
      token entities MUST NOT be present unless the handler creates
      them.
    status: out-of-scope
    out_of_scope_reason: "The 'ctx.oidc.entities' Account/Session/AccessToken graph is an upstream-specific middleware shape this library does not adopt; the projected handler surface (op.CustomGrantRequest with Client + Subject + Form + DPoP/MTLS) carries only the values the handler is expected to read, so there is no ambient entity bag for the row's negative assertion to gate against."

  - id: CG-010
    severity: P1
    spec: RFC 6749 §6 / RFC 9700 §2.2.2
    behaviour: |
      A custom grant whose handler sets
      CustomGrantResponse.IssueRefreshToken MUST cause the OP — not the
      handler — to mint and persist a refresh token through its own
      refresh-token store, sharing the access token's grant identity so
      the credential rides the standard rotation / replay-cascade
      lineage (the refresh token is an authorization-server-issued
      credential per RFC 6749 §6). The issued refresh token MUST be
      exchangeable at the token endpoint. Issuance is gated on the
      client being registered for the refresh_token grant; when it is
      not, the request still succeeds (200) with the refresh token
      silently dropped. The built-in token-exchange handler rides the
      same path.
    status: active
