# yaml-language-server: $schema=./schema.json
feature: pairwise
prefix: PW
title: Pairwise Pseudonymous Identifier
specs:
  - OIDC Core 1.0 §8 (Subject Identifier Types)
  - OIDC Core 1.0 §8.1 (Pairwise Identifier Algorithm)
  - OIDC Core 1.0 §8.2 (Sector Identifier Validation)
  - OIDC Core 1.0 §3.1.2.1, §5.3, §5.5.1, §16
  - OIDC Dynamic Client Registration 1.0 §2 (subject_type, sector_identifier_uri)
  - OIDC CIBA Core 1.0 §11
  - OIDC Device Authorization 1.0 §6
  - RFC 7662 (OAuth 2.0 Token Introspection)

description: |
  Subject identifier types: public vs pairwise. Covers sector
  identifier resolution (with and without sector_identifier_uri),
  CIBA / Device-flow specific jwks_uri rules, the deterministic
  pairwise sub generation algorithm, and projection of the
  resulting sub through id_token, userinfo, and introspection.

rows:
  - id: PW-01
    severity: P0
    spec: OIDC Core §8
    behaviour: |
      Discovery's subject_types_supported MUST enumerate every
      identifier type the implementation actually supports
      (including at least public).
    status: active

  - id: PW-02
    severity: P0
    spec: OIDC Core §8
    behaviour: |
      When client metadata omits subject_type, the OP falls back to
      its default (public).
    status: active

  - id: PW-03
    severity: P0
    spec: OIDC Core §8
    behaviour: |
      A client requesting subject_type=pairwise registration is
      rejected with a metadata error when the OP's pairwise feature
      is disabled.
    status: active

  - id: PW-04
    severity: P0
    spec: Dynamic Client Registration §2
    behaviour: |
      When the OP does not implement pairwise at all, registering
      subject_type=pairwise yields invalid_client_metadata.
    status: active

  - id: PW-10
    severity: P0
    spec: OIDC Core §8.1
    behaviour: |
      When sector_identifier_uri is absent and all redirect_uris
      share a single host, the OP adopts that host as the sector
      identifier.
    status: active

  - id: PW-11
    severity: P0
    spec: OIDC Core §8.1
    behaviour: |
      When redirect_uris span multiple hosts and
      sector_identifier_uri is absent, the OP rejects registration
      ("sector_identifier_uri is mandatory property").
    status: active

  - id: PW-12
    severity: P1
    spec: OIDC Core §8.1
    behaviour: |
      Multiple redirect_uris that differ only by path on a shared
      host pass the single-host check; only the host has to match.
    status: active

  - id: PW-13
    severity: P1
    spec: OIDC Core §8.1
    behaviour: |
      Clients without redirect_uris (CIBA, device flow) using
      pairwise rely on jwks_uri as the sole basis for the sector
      identifier (see PW-30 series).
    status: out-of-scope
    out_of_scope_reason: "Pairwise sector resolution for clients without redirect_uris (CIBA / Device flow) depends on PW-30..PW-32 which are themselves OOS until the OP grows CIBA / Device-flow handlers. PW-13 cannot stand alone: when the dependent flows ship, this row should flip back to pending and bind alongside them."

  - id: PW-20
    severity: P0
    spec: OIDC Core §8.1
    behaviour: |
      sector_identifier_uri MUST use the HTTPS scheme; other
      schemes are rejected ("sector_identifier_uri must be a https
      uri").
    status: active

  - id: PW-21
    severity: P0
    spec: OIDC Core §8.1
    behaviour: |
      At registration time the OP fetches sector_identifier_uri and
      retrieves a JSON array of redirect_uris.
    status: out-of-scope
    out_of_scope_reason: The sector_identifier_uri fetch wire path is exhaustively covered at the resolver-internal level by internal/sector/resolver_test.go (status / JSON shape / subset / cache / SSRF / redirect / hash) and at the registration validator wrapper level by internal/registrationendpoint/sector_identifier_test.go. The wire-flow scenario binding additionally requires the OP-level http.Client used by the resolver to trust an httptest TLS certificate; the op surface does not expose a WithSectorHTTPClient option (the symmetric WithBackchannelLogoutHTTPClient exists for BCL because BCL pushes outbound to the RP, while sector_identifier_uri is pulled from the RP, and adding the option for tests alone would constitute a test-only public-API leak). PW-20 (the URL-parse https-only check) binds at the wire level because it short-circuits before any HTTP I/O. When the OP grows a public sector-resolver injection point — most likely as a side effect of an embedder asking for it — these rows should flip back to pending and bind alongside the new option.

  - id: PW-22
    severity: P0
    spec: OIDC Core §8.1
    behaviour: |
      A non-200 response status from sector_identifier_uri (500 /
      201 / 302 / etc.) fails registration ("unexpected
      sector_identifier_uri response status code").
    status: out-of-scope
    out_of_scope_reason: The sector_identifier_uri fetch wire path is exhaustively covered at the resolver-internal level by internal/sector/resolver_test.go (status / JSON shape / subset / cache / SSRF / redirect / hash) and at the registration validator wrapper level by internal/registrationendpoint/sector_identifier_test.go. The wire-flow scenario binding additionally requires the OP-level http.Client used by the resolver to trust an httptest TLS certificate; the op surface does not expose a WithSectorHTTPClient option (the symmetric WithBackchannelLogoutHTTPClient exists for BCL because BCL pushes outbound to the RP, while sector_identifier_uri is pulled from the RP, and adding the option for tests alone would constitute a test-only public-API leak). PW-20 (the URL-parse https-only check) binds at the wire level because it short-circuits before any HTTP I/O. When the OP grows a public sector-resolver injection point — most likely as a side effect of an embedder asking for it — these rows should flip back to pending and bind alongside the new option.

  - id: PW-23
    severity: P0
    spec: OIDC Core §8.1
    behaviour: |
      A response that is not parseable as JSON fails registration
      ("failed to parse sector_identifier_uri JSON response").
    status: out-of-scope
    out_of_scope_reason: The sector_identifier_uri fetch wire path is exhaustively covered at the resolver-internal level by internal/sector/resolver_test.go (status / JSON shape / subset / cache / SSRF / redirect / hash) and at the registration validator wrapper level by internal/registrationendpoint/sector_identifier_test.go. The wire-flow scenario binding additionally requires the OP-level http.Client used by the resolver to trust an httptest TLS certificate; the op surface does not expose a WithSectorHTTPClient option (the symmetric WithBackchannelLogoutHTTPClient exists for BCL because BCL pushes outbound to the RP, while sector_identifier_uri is pulled from the RP, and adding the option for tests alone would constitute a test-only public-API leak). PW-20 (the URL-parse https-only check) binds at the wire level because it short-circuits before any HTTP I/O. When the OP grows a public sector-resolver injection point — most likely as a side effect of an embedder asking for it — these rows should flip back to pending and bind alongside the new option.

  - id: PW-24
    severity: P0
    spec: OIDC Core §8.1
    behaviour: |
      A response whose top-level shape is not a JSON array (string,
      object, etc.) fails registration ("sector_identifier_uri must
      return single JSON array").
    status: out-of-scope
    out_of_scope_reason: The sector_identifier_uri fetch wire path is exhaustively covered at the resolver-internal level by internal/sector/resolver_test.go (status / JSON shape / subset / cache / SSRF / redirect / hash) and at the registration validator wrapper level by internal/registrationendpoint/sector_identifier_test.go. The wire-flow scenario binding additionally requires the OP-level http.Client used by the resolver to trust an httptest TLS certificate; the op surface does not expose a WithSectorHTTPClient option (the symmetric WithBackchannelLogoutHTTPClient exists for BCL because BCL pushes outbound to the RP, while sector_identifier_uri is pulled from the RP, and adding the option for tests alone would constitute a test-only public-API leak). PW-20 (the URL-parse https-only check) binds at the wire level because it short-circuits before any HTTP I/O. When the OP grows a public sector-resolver injection point — most likely as a side effect of an embedder asking for it — these rows should flip back to pending and bind alongside the new option.

  - id: PW-25
    severity: P0
    spec: OIDC Core §8.1
    behaviour: |
      Registration fails when the response array does not contain
      every redirect_uri the client registered ("all registered
      redirect_uris must be included").
    status: out-of-scope
    out_of_scope_reason: The sector_identifier_uri fetch wire path is exhaustively covered at the resolver-internal level by internal/sector/resolver_test.go (status / JSON shape / subset / cache / SSRF / redirect / hash) and at the registration validator wrapper level by internal/registrationendpoint/sector_identifier_test.go. The wire-flow scenario binding additionally requires the OP-level http.Client used by the resolver to trust an httptest TLS certificate; the op surface does not expose a WithSectorHTTPClient option (the symmetric WithBackchannelLogoutHTTPClient exists for BCL because BCL pushes outbound to the RP, while sector_identifier_uri is pulled from the RP, and adding the option for tests alone would constitute a test-only public-API leak). PW-20 (the URL-parse https-only check) binds at the wire level because it short-circuits before any HTTP I/O. When the OP grows a public sector-resolver injection point — most likely as a side effect of an embedder asking for it — these rows should flip back to pending and bind alongside the new option.

  - id: PW-26
    severity: P1
    spec: OIDC Core §8.1
    behaviour: |
      A subject_type=public client that supplies
      sector_identifier_uri still has its host recorded so that a
      later switch to pairwise (or audit) has the value already.
    status: out-of-scope
    out_of_scope_reason: The sector_identifier_uri fetch wire path is exhaustively covered at the resolver-internal level by internal/sector/resolver_test.go (status / JSON shape / subset / cache / SSRF / redirect / hash) and at the registration validator wrapper level by internal/registrationendpoint/sector_identifier_test.go. The wire-flow scenario binding additionally requires the OP-level http.Client used by the resolver to trust an httptest TLS certificate; the op surface does not expose a WithSectorHTTPClient option (the symmetric WithBackchannelLogoutHTTPClient exists for BCL because BCL pushes outbound to the RP, while sector_identifier_uri is pulled from the RP, and adding the option for tests alone would constitute a test-only public-API leak). PW-20 (the URL-parse https-only check) binds at the wire level because it short-circuits before any HTTP I/O. When the OP grows a public sector-resolver injection point — most likely as a side effect of an embedder asking for it — these rows should flip back to pending and bind alongside the new option.

  - id: PW-27
    severity: P1
    spec: OIDC Core §8.1
    behaviour: |
      The sector identifier is derived from the URL host
      (lowercased); port and path are discarded.
    status: out-of-scope
    out_of_scope_reason: The sector_identifier_uri fetch wire path is exhaustively covered at the resolver-internal level by internal/sector/resolver_test.go (status / JSON shape / subset / cache / SSRF / redirect / hash) and at the registration validator wrapper level by internal/registrationendpoint/sector_identifier_test.go. The wire-flow scenario binding additionally requires the OP-level http.Client used by the resolver to trust an httptest TLS certificate; the op surface does not expose a WithSectorHTTPClient option (the symmetric WithBackchannelLogoutHTTPClient exists for BCL because BCL pushes outbound to the RP, while sector_identifier_uri is pulled from the RP, and adding the option for tests alone would constitute a test-only public-API leak). PW-20 (the URL-parse https-only check) binds at the wire level because it short-circuits before any HTTP I/O. When the OP grows a public sector-resolver injection point — most likely as a side effect of an embedder asking for it — these rows should flip back to pending and bind alongside the new option.

  - id: PW-30
    severity: P0
    spec: OIDC CIBA §11
    behaviour: |
      A CIBA client using pairwise with sector_identifier_uri MUST
      have its jwks_uri included in the response array
      ("client's jwks_uri must be included").
    status: out-of-scope
    out_of_scope_reason: "The blocker is the sector-document fetch, not CIBA. CIBA ships (internal/cibaendpoint) and pairwise issuance is wired end to end, but this row asserts a REGISTRATION-time rule: the client's sector_identifier_uri must list its jwks_uri. Driving it black-box needs the OP's sector resolver to trust an httptest TLS certificate, and the op surface exposes no WithSectorHTTPClient seam to install one — the same blocker that keeps PW-21..PW-27 out of scope. The rule is covered at the resolver level by internal/sector/resolver_test.go. Bind alongside PW-21..PW-27 when a sector-resolver injection point lands. Separately, the pairwise restriction CIBA does enforce is narrower than 'no pairwise CIBA clients': internal/cibaendpoint refuses an id_token_hint from a subject_type=pairwise client, because a pairwise sub names an end user only inside that client's sector; login_hint and login_hint_token stay open to pairwise clients."

  - id: PW-31
    severity: P0
    spec: OIDC Device §6
    behaviour: |
      A Device-flow client using pairwise with
      sector_identifier_uri MUST have its jwks_uri included in the
      response array.
    status: out-of-scope
    out_of_scope_reason: Same sector-document fetch blocker as PW-30. The device authorization grant ships (internal/devicecodeendpoint), so the row is no longer waiting on a handler; it is waiting on a way to drive the registration-time sector_identifier_uri fetch from a black-box scenario, which needs the WithSectorHTTPClient seam the op surface does not expose (see PW-21..PW-27). The rule is covered at the resolver level by internal/sector/resolver_test.go.

  - id: PW-32
    severity: P1
    spec: OIDC Core §8.1
    behaviour: |
      Because CIBA and Device flow clients lack redirect_uris, the
      jwks_uri serves as the safe sector-binding anchor (consistent
      with the spec's intent for those client types).
    status: out-of-scope
    out_of_scope_reason: "Same sector-document fetch blocker as PW-30 / PW-31, and a restatement of PW-13 from the CIBA / device-flow side: a client with no redirect_uris anchors its sector on jwks_uri. Both handlers now ship, so the gap is only the missing WithSectorHTTPClient seam that would let a scenario serve the sector document over TLS the resolver trusts (see PW-21..PW-27). Resolver-level coverage lives in internal/sector/resolver_test.go."

  - id: PW-40
    severity: P0
    spec: OIDC Core §8.1
    behaviour: |
      The pairwise sub is a deterministic function of
      (sector_identifier, local_account_id, salt); the same triple
      always produces the same sub.
    status: active

  - id: PW-41
    severity: P0
    spec: OIDC Core §8.1
    behaviour: |
      The salt is an OP-managed secret supplied by the embedder; it
      MUST be treated as sensitive because reusing the same salt
      across environments makes pairwise subs predictable.
    status: out-of-scope
    out_of_scope_reason: "Not wire-observable. The OP never emits the salt, and 'treat it as sensitive' / 'reusing it across environments makes subs predictable' are operational guidance for the embedder's runbook rather than a property any OP response could carry or withhold. The one construction-time guard that does exist is the 32-byte minimum op.WithPairwiseSubject enforces (op.ErrPairwiseSaltTooShort), which is a different assertion from this row's. The observable consequence of the salt being a hash input — change it and every pairwise sub changes with it — is bound by PW-60."

  - id: PW-42
    severity: P0
    spec: OIDC Core §8.1
    behaviour: |
      A typical concrete algorithm is
      SHA-256(sector_identifier || local_id || salt) truncated to
      16 bytes and rendered as a UUIDv5-shaped 128-bit value; the
      spec does not mandate one specific shape.
    status: out-of-scope
    out_of_scope_reason: "Non-normative, and not this OP's shape. The row itself says the spec mandates no particular form ('a typical concrete algorithm', 'the spec does not mandate one specific shape'), and the concrete form it names is not what the OP emits: op/subject.Pairwise hashes salt:sector:userID with SHA-256 and base64url-encodes the FULL 32-byte digest (43 characters), with no truncation to 16 bytes and no UUIDv5 rendering. Binding the row as written would assert a wire shape the OP does not produce; binding the OP's shape instead would freeze an internal choice OIDC Core 1.0 §8.1 deliberately leaves to the OP. The properties that actually constrain the derivation are bound elsewhere: determinism by PW-40, per-sector separation by PW-43 / PW-44, and the length bound by PW-46."

  - id: PW-43
    severity: P0
    spec: OIDC Core §8.1
    behaviour: |
      Different sector identifiers MUST produce different pairwise
      subs for the same local account at the same OP.
    status: active

  - id: PW-44
    severity: P0
    spec: OIDC Core §8.1
    behaviour: |
      Clients that share a sector identifier MUST receive the same
      pairwise sub for the same local account (the sector grouping
      is the whole point).
    status: active

  - id: PW-45
    severity: P0
    spec: OIDC Core §8.1
    behaviour: |
      A subject_type=public client receives the local account id
      verbatim as the sub; the pairwise transform does not run.
    status: active

  - id: PW-46
    severity: P0
    spec: OIDC Core §16
    behaviour: |
      The pairwise sub stays within 255 characters as the spec
      recommends.
    status: active

  - id: PW-50
    severity: P0
    spec: OIDC Core §8
    behaviour: |
      The id_token sub follows the client's subject_type (public ->
      local id, pairwise -> pairwise sub).
    status: active

  - id: PW-51
    severity: P0
    spec: OIDC Core §5.3
    behaviour: |
      The /userinfo response sub follows the same rule as the
      id_token sub.
    status: active

  - id: PW-52
    severity: P1
    spec: RFC 7662
    behaviour: |
      The introspection response sub follows the access_token's
      issuing client's subject_type (pairwise where applicable).
    status: active

  - id: PW-53
    severity: P0
    spec: OIDC Core §3.1.2.1
    behaviour: |
      id_token_hint sub comparison uses the public / pairwise sub
      that matches the client's subject_type (consistent with
      claims#CL-61 / claims#CL-63).
    status: active

  - id: PW-54
    severity: P0
    spec: OIDC Core §5.5.1
    behaviour: |
      For a pairwise client using claims.id_token.sub.value, the
      requested value MUST match the pairwise sub or the OP returns
      login_required (consistent with claims#CL-51 / claims#CL-53).
    status: out-of-scope
    out_of_scope_reason: "Blocked by the claims parameter, not by pairwise. Pairwise issuance is wired end to end (PW-50..PW-53 bind it), but the OP has no /authorize gate that compares an OIDC Core 1.0 §5.5 claims.id_token.sub.value entry against the resolved subject and fails with login_required — the entry is parsed and persisted, never enforced. claims#CL-51 and claims#CL-53 are out of scope on exactly that ground. This row is the pairwise-flavoured case of that missing gate, so it becomes bindable when the gate lands, and its pairwise half needs nothing further."

  - id: PW-60
    severity: P0
    spec: OIDC Core §16
    behaviour: |
      Rotating the pairwise salt invalidates every pairwise sub
      across all clients; embedder documentation MUST flag this
      consequence.
    status: active

  - id: PW-61
    severity: P0
    spec: OIDC Core §16
    behaviour: |
      The local account id MUST NOT be emitted verbatim into logs
      or audit event payloads delivered to a pairwise client; only
      the pairwise sub is exposed.
    status: out-of-scope
    out_of_scope_reason: "The delivery channel this row guards does not exist. Audit events are never delivered to a client: op.WithAuditLogger hands audit.Event to the deployment operator, and the OP deliberately stamps ActorID with the OP-internal subject there (internal/authorizeendpoint/completion.go, internal/tokenendpoint/refresh.go) precisely so an operator can correlate one account across clients — pseudonymising the operator's own audit trail would defeat it. Every client-facing egress does carry the projected value, and each is bound: id_token by PW-50, userinfo by PW-51, introspection by PW-52, the id_token_hint comparison by PW-53, and the JWT access token by PW-40. Log redaction inside the embedder's sink is the embedder's concern."

  - id: PW-62
    severity: P1
    spec: OIDC Core §8
    behaviour: |
      When the pairwise feature is enabled, discovery's
      subject_types_supported advertises pairwise so clients know
      they may select it.
    status: active

  - id: PW-63
    severity: P2
    spec: OIDC Core §8
    behaviour: |
      The OP exposes a hook (e.g. WithPairwiseSubject(salt, hashFn))
      that lets the embedder supply per-environment salt and hash
      function.
    status: active

  - id: PW-64
    severity: P1
    spec: OIDC Core §8.1
    behaviour: |
      The sector_identifier_uri fetch completes within the
      registration request lifetime and uses a bounded HTTP
      timeout.
    status: out-of-scope
    out_of_scope_reason: "Same sector-document fetch blocker as PW-21..PW-27: asserting that the sector_identifier_uri fetch is bounded requires driving a slow upstream through the OP's resolver, and the op surface exposes no WithSectorHTTPClient seam to point the resolver at a test server. The timeout is enforced and covered at the resolver level by internal/sector/resolver_test.go. Bind alongside PW-21..PW-27 when an injection point lands."

  - id: PW-65
    severity: P2
    spec: OIDC Core §8.1
    behaviour: |
      The sector_identifier_uri response is cacheable, but change
      detection is the OP's responsibility; the spec does not
      mandate a particular freshness policy.
    status: out-of-scope
    out_of_scope_reason: "Same sector-document fetch blocker as PW-21..PW-27: observing cache behaviour needs two fetches against a test-controlled sector document, which the missing WithSectorHTTPClient seam makes undriveable from a black-box scenario. The row is also deliberately soft — the spec fixes no freshness policy — so what is bindable is the OP's own caching choice, covered at the resolver level by internal/sector/resolver_test.go."

  - id: PW-70
    severity: P0
    spec: OIDC Core §8 / project v0.9.1 contract
    behaviour: |
      The subject-mode immutability gate at op.New refuses to switch
      subject-issuance strategies on a re-used metadata store even
      when no grants survive. Specifically, when [store.SubjectModeKey]
      is absent but the [store.OpInitKey] sentinel is present (a
      previously-used store whose subject-mode row was wiped or
      truncated), op.New MUST refuse any non-public construction; the
      "fresh install" inference cannot be trusted because the marker
      ABSENCE is no longer a reliable fresh-install signal. A public
      construction on the same shape proceeds and writes the marker
      back through.
    status: active
