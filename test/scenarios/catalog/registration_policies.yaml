# yaml-language-server: $schema=./schema.json
feature: registration_policies
prefix: RP
title: Registration Policies
specs:
  - RFC 7591 §5.2 — Software Statement / Registration Policies
  - OpenID Connect Dynamic Client Registration §3 — Metadata Validation
  - OP design — features.registration.policies map of name to function

description: |
  OP-administrator policy hooks bound to Initial Access Tokens (IAT)
  or Registration Access Tokens (RAT). Policies apply default values,
  enforce values, and run validation across DCR and registration
  management. Covers configuration coupling, IAT-bound and RAT-bound
  policy execution, validation of the policies array, error mapping,
  and audit logging.

rows:
  - id: RP-CFG-01
    severity: P0
    spec: RFC 7591 §5.2
    behaviour: |
      Configuring policies without enabling adapter-managed IATs
      causes OP construction to fail with "registration policies are
      only available in conjuction with adapter-backed initial access
      tokens".
    status: out-of-scope
    out_of_scope_reason: "The 'registration policies' feature describes JS oidc-provider's configuration hook where the embedder supplies a map of named callback functions that mutate registration metadata (apply defaults, enforce values, throw InvalidClientMetadata for validation failures) and bind that named set to each Initial Access Token / Registration Access Token. go-oidc-provider does not implement this hook surface in v1.0: op.RegistrationOption exposes IATTTL / IATUses / GrantTypes / RotateRAT etc. but no Policies field, and there is no public function-typed callback option. This is intentional product scope — Go's typed callback ergonomics differ from JS's dynamic hook map, and equivalent customisation is achievable in Go by wrapping the registration handler at the embedder's HTTP middleware layer or by validating the InitialAccessToken record before issuance. RP-CFG-* rows additionally tie configuration coupling errors ('policies are only available with adapter-backed initial access tokens', 'fixed-string IAT + policies unsupported') to JS-only construction-time wiring that has no Go-side analogue. Re-opening this feature would require new public surface (a Policies map type, audit event extensions for registration_*.success, IAT save/find pipelines that carry the policies array); not on the v1.0 roadmap."

