# yaml-language-server: $schema=./schema.json
feature: userinfo
prefix: UI
title: UserInfo endpoint
specs:
  - OIDC Core 1.0 §5.3 (UserInfo Endpoint)
  - OIDC Core 1.0 §5.3.1 (HTTP method), §5.3.2 (Successful response), §5.3.3 (Error response)
  - OIDC Core 1.0 §5.4 (Requesting Claims using Scope Values)
  - RFC 6750 §2 (Authenticated Bearer Token), §3 (Bearer error responses)
  - RFC 6749 §5.2 (Error responses), §10.4
  - RFC 7235 §2.1 (Authorization header syntax)
  - RFC 9449 §7 (DPoP error responses)
  - OIDC Discovery 1.0 (userinfo_endpoint, userinfo_signing_alg_values_supported)

description: |
  /me endpoint contract: configuration interlocks, GET / POST claim
  filtering, bearer-token presentation rules (Authorization header,
  query, body), and the family of 401 / 403 / 400 / 404 error shapes
  that protect the endpoint from misuse.

rows:
  - id: UI-001
    severity: P1
    spec: OIDC Core §5.3.2 (signed/encrypted userinfo presupposes the endpoint)
    behaviour: |
      Building the OP with jwt-userinfo enabled while the userinfo
      endpoint is disabled MUST fail at construction with a
      configuration error stating that jwt-userinfo requires the
      userinfo endpoint; there is no silent fallback.
    status: out-of-scope
    out_of_scope_reason: "Signed / Encrypted UserInfo response is intentionally not supported. docs/plans/002-product-design.md §\"Out-of-scope\" (line 2153) records: \"Signed / Encrypted UserInfo response — TLS + plain JSON で十分、JWS/JWE userinfo は実装負荷に見合わない.\" UserInfo always returns application/json."

  - id: UI-002
    severity: P1
    spec: OIDC Core §5.3.2; §5.4
    behaviour: |
      A GET /me with a Bearer access_token whose scope includes
      openid email returns 200 with sub and email present in the JSON
      body; a rejected email_verified claim is omitted from the
      response.
    status: active

  - id: UI-003
    severity: P1
    spec: OIDC Core §5.3.1 (POST allowed)
    behaviour: |
      A POST /me carrying the same access_token as UI-002 returns
      200 with the same body composition.
    status: active

  - id: UI-004
    severity: P2
    spec: OIDC Core §5.3 (operational observability)
    behaviour: |
      A successful userinfo call exposes Client, Grant, AccessToken,
      and Account on the request context for hooks and audit
      consumers.
    status: out-of-scope
    out_of_scope_reason: "Internal request-context plumbing is not part of the public wire surface of go-oidc-provider v1.0; observability hooks attach via op.WithAuditEmitter (op.AuditEvent), not via implicit ctx.entities. The upstream 'oidc-provider request.entities' inspection is not portable to a non-Node OP."

  - id: UI-005
    severity: P0
    spec: RFC 6750 §3.1; OIDC Core §5.3.3
    behaviour: |
      A GET /me with a syntactically opaque access_token that the OP
      cannot resolve returns 401 with error=invalid_token and the
      description "invalid token provided".
    status: active

  - id: UI-006
    severity: P0
    spec: RFC 6750 §3.1
    behaviour: |
      A GET /me without an Authorization header and without any
      other token carrier returns 401 with error=invalid_token and
      the description "no access token provided".
    status: active

  - id: UI-007
    severity: P0
    spec: OIDC Core §5.3.1; RFC 6750 §3.1
    behaviour: |
      An access_token that resolves but lacks the openid scope yields
      403 with error=insufficient_scope, scope=openid, and the
      description "access token missing openid scope".
    status: out-of-scope
    out_of_scope_reason: "v1.0 /userinfo does not enforce per-request scope; OIDC Core §5.3.1 'insufficient_scope' is not part of the v1.0 wire (no scope gate at /userinfo). Reconsider when v1.x adds RFC 6750 §3.1 scope enforcement."

  - id: UI-008
    severity: P0
    spec: RFC 6749 §10.4; RFC 6750 §3.1
    behaviour: |
      When the access_token is otherwise valid but its bound client
      can no longer be loaded, the endpoint returns 401 with
      error=invalid_token and the description "invalid token
      provided".
    status: out-of-scope
    out_of_scope_reason: "v1.0 /userinfo never resolves the client by id (no GetClient call on the path). 'Client gone' has no observable wire effect. Out-of-scope until the userinfo handler grows a per-request client check."

  - id: UI-009
    severity: P0
    spec: OIDC Core §5.3.2 (sub MUST be issued for an existing account); RFC 6750 §3.1
    behaviour: |
      When the access_token is otherwise valid but the bound account
      no longer resolves (UserStore returns ErrNotFound), the endpoint
      returns 401 with WWW-Authenticate carrying error=invalid_token
      and the description "subject unknown".
    status: active

  - id: UI-010
    severity: P1
    spec: OIDC Core §5.4 (request can narrow the response)
    behaviour: |
      A GET /me?scope=openid against a token issued with
      scope=openid email returns 200 with only sub (the request
      narrows the response).
    status: out-of-scope
    out_of_scope_reason: "v1.0 /userinfo does not consult a request-level scope parameter; OIDC Core §5.4 'request narrows scope' has no effect (the access token's granted scope is the only ground truth)."

  - id: UI-011
    severity: P0
    spec: OIDC Core §5.4; RFC 6750 §3.1
    behaviour: |
      A GET /me?scope=openid profile against a token issued with
      scope=openid email yields 403 with error=insufficient_scope,
      scope=profile, and the description "access token missing
      requested scope" (request must not widen the token).
    status: out-of-scope
    out_of_scope_reason: v1.0 /userinfo does not enforce per-request scope; OIDC Core §5.4 widening rejection is not part of the v1.0 wire (no scope gate at /userinfo). Reconsider when v1.x adds RFC 6750 §3.1 scope enforcement.

  - id: UI-012
    severity: P0
    spec: RFC 6750 §3; RFC 9449 §7 (DPoP challenge)
    behaviour: |
      A GET /me with no Authorization header, query, or body yields
      401 with WWW-Authenticate equal to `Bearer realm="userinfo"`
      (single challenge; v1.0 does not enumerate DPoP alongside Bearer
      because the bare "missing credentials" branch leaves the wire
      free of error= / scope= attributes).
    status: active

  - id: UI-013
    severity: P0
    spec: RFC 6750 §2 (clients MUST NOT use more than one method to transmit the token)
    behaviour: |
      A POST /me that carries the access_token both via Authorization:
      Bearer header AND via the access_token= form field returns 400
      with WWW-Authenticate `Bearer error="invalid_request",
      error_description="The request is missing a required parameter
      or is malformed"`. (v1.0 does not consult the URL query for
      access tokens, so the multi-channel collision is observable on
      the body channel only.)
    status: active

  - id: UI-014
    severity: P0
    spec: RFC 6750 §2.1; RFC 7235 §2.1
    behaviour: |
      An Authorization header literally equal to "Bearer" (no token
      component) yields 401 with the bare WWW-Authenticate challenge
      `Bearer realm="userinfo"` (v1.0 treats the unrecognised header
      shape as missing credentials rather than as an invalid_request
      diagnostic).
    status: active

  - id: UI-015
    severity: P0
    spec: RFC 6750 §2.1; RFC 7235 §2.1
    behaviour: |
      An Authorization header that contains "Bearer " followed by
      additional whitespace-delimited parts (e.g. "Bearer some three")
      is parsed as token="some three"; the verifier rejects the value
      and the endpoint returns 401 with WWW-Authenticate carrying
      error=invalid_token and the description "The access token is
      invalid".
    status: active

  - id: UI-016
    severity: P0
    spec: RFC 6750 §2.1
    behaviour: |
      An Authorization header whose scheme is neither Bearer nor DPoP
      (e.g. "Authorization: Basic ...") is treated as missing
      credentials: the endpoint returns 401 with the bare
      WWW-Authenticate challenge `Bearer realm="userinfo"`.
    status: active

  - id: UI-017
    severity: P0
    spec: RFC 6750 §2.3, §3
    behaviour: |
      A GET /me?access_token= with an empty value returns 401 with
      error=invalid_token "no access token provided"; the
      WWW-Authenticate challenges include both Bearer and DPoP.
    status: out-of-scope
    out_of_scope_reason: "v1.0 deliberately does not consult URL query for the access token (RFC 9700 §2.4 hardening: query-string credentials are forbidden as a defence against referer leakage / proxy logging). The empty query value is therefore unobservable as a distinct error path; the request collapses onto the bare-challenge 'no credentials' path UI-006 already covers."

  - id: UI-018
    severity: P0
    spec: RFC 6750 §2.2, §3
    behaviour: |
      A POST /me with `access_token=` in an
      application/x-www-form-urlencoded body (empty value) is parsed
      as token="", which the verifier rejects: the endpoint returns
      401 with WWW-Authenticate carrying error=invalid_token and the
      description "The access token is invalid".
    status: active

  - id: UI-019
    severity: P0
    spec: RFC 6750 §3
    behaviour: |
      A POST /me with no Authorization header and an empty body is
      treated as missing credentials: the endpoint returns 401 with
      the bare WWW-Authenticate challenge `Bearer realm="userinfo"`.
    status: active
