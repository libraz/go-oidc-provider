# Gate topology — source of truth for api/gates.md.
#
# Every verification command this repository runs, the question it
# actually answers, and the shipped surfaces it drives.
#
# The file exists because a green gate has repeatedly been read as a
# broader claim than it makes. The conformance suite passed while a
# defect lived in three shipped multi-account sign-in paths, because the
# suite drives one authenticated session and never follows an
# add-account link. Nothing in the tree recorded that limit, so a ledger
# closed four audits against a gate that could not see them.
#
# `level` is the load-bearing field. A surface every gate reaches only at
# `static` level is compiled, vetted and linted, and never run: a defect
# in it survives a fully green tree. `make gates` fails on such a
# surface unless it carries a `static_only_reason`, which is a written,
# reviewable decision rather than an oversight.
#
# Schema: tools/gatetool/model.go. Run `make gates-write` after editing.

